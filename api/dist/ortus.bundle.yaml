  headers:
    ETag:
      description: Strong entity revision. Send unchanged in If-Match for updates.
      schema:
        type: string
        examples:
          - '"rev-7"'
    IdempotencyReplayed:
      description: true if a stored command response was replayed.
      schema:
        type: boolean
    RequestId:
      description: Non-secret correlation identifier.
      schema:
        type: string
    RetryAfter:
      description: Number of seconds until a retry may be attempted.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Malformed JSON/header or invalid cursor binding.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "Domain conflict: overlap, invalid lifecycle, in-flight/reused idempotency key, exhausted quota, insufficient stock or incompatible plan downgrade."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DependencyUnavailable:
      description: Control DB, object storage or identity provider is unavailable; sensitive writes fail closed. Retry after the specified delay (W0.08).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated actor lacks action permission, tenant/module is suspended, or cookie CSRF/Origin validation failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: Public capability/nonce/upload has expired or been revoked.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found or not visible; foreign tenant and nonexistent identifiers are indistinguishable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PlanRequired:
      description: Optional use only for missing paid entitlement; never for ordinary RBAC denial. Client must also use stable code plan_required.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: If-Match revision is stale; fetch current entity and resolve the conflict.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: Required If-Match or idempotency precondition missing.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Request, anonymous upload or query cost limit exceeded; retry after specified delay.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: Upload or request exceeds an explicit configured limit.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: Missing, expired or invalid authentication.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Validation:
      description: Typed or business validation failed; see field violations.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AccessCheck:
      type: object
      additionalProperties: false
      properties:
        check:
          $ref: "#/components/schemas/AccessCheckStep"
        passed:
          type: boolean
        detail:
          type: string
          maxLength: 500
          description: Human-readable reason in Russian, without hidden object names.
      required:
        - check
        - passed
    AccessCheckStep:
      type: string
      enum:
        - tenant-membership-and-binding
        - tenant-state
        - module-installation
        - plan-entitlement
        - separation-of-duties
        - permission
        - resource-scope
        - relationship
        - field-policy
      description: A step of x-authorization-order (authentication is implied by the request).
    AccessExplanation:
      type: object
      additionalProperties: false
      properties:
        memberId:
          $ref: "#/components/schemas/Id"
        permission:
          type: string
        orgUnitId:
          $ref: "#/components/schemas/Id"
        object:
          $ref: "#/components/schemas/ObjectRef"
        allowed:
          type: boolean
        decisiveCheck:
          $ref: "#/components/schemas/AccessCheckStep"
        denyCode:
          $ref: "#/components/schemas/ProblemCode"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/AccessCheck"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/AccessGrantTrace"
        hiddenGrants:
          type: boolean
          description: True when at least one grant of the member that carries the permission lies outside the actor scope. Such grants are not listed, and no count or details (role, unit, object, group, validity) are given.
        policyVersion:
          type: string
      required:
        - memberId
        - permission
        - allowed
        - decisiveCheck
        - checks
        - grants
        - hiddenGrants
        - policyVersion
      description: decisiveCheck is the first failed check, or permission when allowed. denyCode is the Problem.code the member would get. allowed, decisiveCheck and denyCode describe the real decision over all grants of the member; grants lists only the grants visible to the actor, and grants outside the actor scope are reported only by hiddenGrants=true, with no count and no details. So allowed=true with no matching visible grant means the access comes from a grant the actor cannot inspect.
    AccessGrantTrace:
      type: object
      additionalProperties: false
      properties:
        assignmentId:
          $ref: "#/components/schemas/Id"
        roleId:
          $ref: "#/components/schemas/Id"
        roleName:
          type: string
        via:
          type: string
          enum:
            - direct
            - group
            - owner
            - temporary
        groupId:
          $ref: "#/components/schemas/Id"
        scope:
          $ref: "#/components/schemas/Scope"
        validUntil:
          $ref: "#/components/schemas/Instant"
        matches:
          type: boolean
        mismatch:
          type: string
          enum:
            - out_of_scope
            - other_object
            - object_scope_without_object
            - expired
            - dormant_module
            - function_blocked
          description: Why the grant does not apply; object scopes count only for the same object (PD-53).
      required:
        - roleId
        - roleName
        - via
        - scope
        - matches
    Appointment:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        orgUnitId:
          $ref: "#/components/schemas/Id"
        serviceId:
          $ref: "#/components/schemas/Id"
        serviceRevision:
          type: integer
          minimum: 1
          format: int64
        clientId:
          $ref: "#/components/schemas/Id"
        practitionerMemberId:
          $ref: "#/components/schemas/Id"
        roomId:
          $ref: "#/components/schemas/Id"
        equipmentIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        window:
          $ref: "#/components/schemas/TimeWindow"
        bookingId:
          $ref: "#/components/schemas/Id"
        status:
          type: string
          enum:
            - confirmed
            - performed_pending_posting
            - completed
            - cancelled
            - no_show
        revision:
          type: integer
          minimum: 1
          format: int64
        performedAt:
          $ref: "#/components/schemas/Instant"
      required:
        - id
        - orgUnitId
        - serviceId
        - serviceRevision
        - clientId
        - practitionerMemberId
        - roomId
        - equipmentIds
        - window
        - bookingId
        - status
        - revision
      description: No complete cash ledger or other practitioners schedule is included. Sensitive client fields are resolved by their own field-level grants. Status performed_pending_posting records the factual treatment before inventory accounting closes. It does not claim stock posting or client payment.
    AppointmentComplete:
      type: object
      additionalProperties: false
      properties:
        warehouseId:
          $ref: "#/components/schemas/Id"
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/ConsumptionOverride"
        note:
          type: string
          maxLength: 2000
      required:
        - warehouseId
        - overrides
      description: Requires performed_pending_posting. Close accounting and recipe-based inventory issue in one tenant database transaction. Overrides require inventory.consumption.override. A stock shortage returns 409 and leaves the already recorded performance and performed_pending_posting status intact; no negative inventory is silently created. After correction retry the same operation; consume once. Completion does not claim payment.
    AppointmentCompletion:
      type: object
      additionalProperties: false
      properties:
        appointment:
          $ref: "#/components/schemas/Appointment"
        inventoryMovementIds:
          type: array

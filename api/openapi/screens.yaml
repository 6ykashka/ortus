# Экран → операции контракта (план v2 §3.4: ведёт стюард контракта этапа; W0.07 — заготовка).
# Ключ — kebab-case ключ экрана; title — подпись пункта меню или диалога прототипа 14.10;
# stage — этап плана; ws — WS страницы (карточки §4); operations — operationId, которые экран вызывает
# в режиме stand. Операции, которых ещё нет в контракте, добавляет контрактный PR шага (W0.08, W1.00…);
# до этого список пуст или неполон (note). Проверка: node tools/gen/contract.mjs --check.
version: 1
screens:
  shell:
    title: Оболочка (шапка, меню, AccessGate)
    stage: 1
    ws: W1.20
    operations:
      - getMyContext
      - getCsrfToken
      - selectTenant
      - getMyNotificationSummary
      - logout
    note: Переключатель бизнеса — selectTenant (S1-07); счётчик входящих — getMyNotificationSummary (W0.08).

  auth-login:
    title: Вход
    stage: 1
    ws: W1.22
    operations: [startLogin, completeLogin, getCsrfToken, getMyContext]
    note: no-reference (B-6). Вход через BFF (OIDC Code + PKCE); dev-вход ?persona= — вне контракта, только e2e-сборка (PD-54).

  auth-invitation:
    title: Принятие приглашения
    stage: 1
    ws: W1.22
    operations: [inspectInvitation, startLogin, acceptInvitation, getMyContext]
    note: no-reference (B-6). Токен — во фрагменте ссылки, в API — только в теле (W0.08).

  inbox:
    title: Входящие
    stage: 1
    ws: W1.22
    operations: [listMyNotifications, markMyNotificationsRead, getMyNotificationSummary]
    note: no-reference (B-6). Панель входящих в шапке (S1-26); доставка в реальном времени — ADR PD-58 (W1.00).

  company-users:
    title: Пользователи и роли
    stage: 1
    ws: W1.23
    operations:
      - listMembers
      - getMember
      - updateMember
      - inviteMember
      - listRoles
      - getRole
      - createRole
      - updateRole
      - deleteRole
      - listAssignments
      - createAssignment
      - revokeAssignment
      - listOrgUnits
      - createOrgUnit
      - getOrgUnit
      - updateOrgUnit
      - listGroups
      - listOwners
      - explainAccess
    note: Группы, владельцы и «Почему доступно» — диалоги ниже (W0.08).

  modal-group:
    title: Группа
    stage: 1
    ws: W1.23
    operations: [createGroup, getGroup, updateGroup, deleteGroup, setGroupMembers, listMembers]
    note: no-reference (B-6); 03 «Группы и владельцы».

  modal-transfer-owner:
    title: Передать владение
    stage: 1
    ws: W1.23
    operations: [listOwners, transferOwnership, revokeOwnership, listMembers]
    note: no-reference (B-6); S1-16, AUTH-08.

  modal-explain-access:
    title: Почему доступно
    stage: 1
    ws: W1.23
    operations: [explainAccess]
    note: S1-14, AUTH-04; объектная область — PD-53.

  company-people-import:
    title: Импорт сотрудников из CSV
    stage: 1
    ws: W1.23
    operations: [createPeopleImport, getPeopleImport, commitPeopleImport, listOrgUnits]
    note: no-reference (B-6); S1-10. Импорт машин — контракт fleet (W2.00).

  modal-assign:
    title: Назначить роль
    stage: 1
    ws: W1.23
    operations: [createAssignment, listRoles, listOrgUnits]

  modal-invite:
    title: Пригласить участника
    stage: 1
    ws: W1.23
    operations: [inviteMember, listRoles, getTenantSubscription]

  modal-create-role:
    title: Создать роль
    stage: 1
    ws: W1.23
    operations: [createRole, listRoles]

  company-modules:
    title: Модули и место
    stage: 1
    ws: W1.24
    operations:
      - listModuleCatalog
      - getModuleInstallation
      - setModuleInstallation
      - getModuleSettings
      - updateModuleSettings
      - getStorageUsage
      - requestStorageChange

  company-storage:
    title: Хранилище
    stage: 1
    ws: W1.24
    operations: [getStorageUsage]
    note: no-reference (B-6, S1-22). Разбивка по модулям и сессии загрузки — контракт шага 1.8.

  core-files:
    title: Файлы
    stage: 1
    ws: W1.24
    operations:
      - getFile
      - getFileDownload
      - initiateUpload
      - completeUpload
      - getUploadSession
      - abortUpload
    note: Список файлов (listFiles) — контракт шага 1.8 (W1.00).

  modal-upload:
    title: Загрузка файла
    stage: 1
    ws: W1.24
    operations: [initiateUpload, getUploadSession, completeUpload, abortUpload]
    note: no-reference (B-6); S1-20. Общий диалог загрузки (прогресс, отмена, повтор) для осмотров, чеков, вложений; сессия — getUploadSession.

  platform-tenants:
    title: Организации
    stage: 1
    ws: W1.25
    operations:
      - listPlatformTenants
      - getPlatformTenant
      - createPlatformTenant
      - updatePlatformTenant
      - getPlatformSubscription
      - updatePlatformSubscription
    note: Продление trial с причиной и аудит оператора — W1.11.

  platform-users:
    title: Пользователи
    stage: 4
    ws: W4.61
    operations: [listPlatformUsers]
    note: Экран оператора этапа 4 (4.6); блокировка и сброс второго фактора — контракт W4.00.

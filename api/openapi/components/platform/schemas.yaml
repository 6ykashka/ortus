# Контракт Ортус · компоненты тега platform. Пишет только стюард контракта (план v2 §3.5).
Tenant:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
    status:
      type: string
      enum:
        - provisioning
        - trial
        - active
        - grace
        - read_only
        - suspended
        - closing
        - closed
    ownerUserIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    revision:
      type: integer
      minimum: 1
      format: int64
  required:
    - id
    - name
    - status
    - ownerUserIds
    - createdAt
    - revision
  description: ownerUserIds may be empty only during provisioning. Activation requires at least one accepted active owner. Closing does not itself delete data.
TenantCreate:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    ownerEmail:
      type: string
      format: email
    timeZone:
      $ref: ../common/schemas.yaml#/TimeZone
    planKey:
      type: string
  required:
    - name
    - ownerEmail
    - timeZone
    - planKey
  description: Creates the platform control-plane record and provisioning job. Owner membership is established only after verified invitation acceptance.
TenantPatch:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    status:
      type: string
      enum:
        - active
        - suspended
    reason:
      type: string
      minLength: 5
      maxLength: 500
  description: Only provided fields change. Suspending blocks writes and operational release; owner gets recovery/billing access. No implicit data deletion.
TenantPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/Tenant
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
PlatformUser:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    displayName:
      type: string
    email:
      type: string
      format: email
    status:
      type: string
      enum:
        - invited
        - active
        - suspended
    lastSeenAt:
      $ref: ../common/schemas.yaml#/Instant
    tenantCount:
      type: integer
      minimum: 0
      format: int64
  required:
    - id
    - displayName
    - email
    - status
    - tenantCount
  description: Platform support metadata only; business content is inaccessible without separately audited break-glass access, not specified here.
PlatformUserPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/PlatformUser
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
PlatformSubscriptionUpdate:
  type: object
  additionalProperties: false
  properties:
    planKey:
      type: string
    status:
      type: string
      enum:
        - trialing
        - active
        - past_due
        - grace
        - read_only
        - cancelled
    periodEndsAt:
      $ref: ../common/schemas.yaml#/Instant
    trialEndsAt:
      $ref: ../common/schemas.yaml#/Instant
    graceEndsAt:
      $ref: ../common/schemas.yaml#/Instant
    cancelAtPeriodEnd:
      type: boolean
    manualEntitlements:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Entitlement
    reason:
      type: string
      minLength: 5
      maxLength: 500
  required:
    - planKey
    - status
    - cancelAtPeriodEnd
    - manualEntitlements
    - reason
  description: Privileged, audited operation. Manual entitlements must have sourceType=manual, expiry and a ticket/reason; plan/trial entitlements are derived by the billing service.
# W1.00 (0.4.0-stage1): команды оператора с причиной и журнал платформы (S1-04, S1-23).
TenantStatusChange:
  type: object
  additionalProperties: false
  properties:
    reason:
      type: string
      minLength: 5
      maxLength: 500
      description: Why the operator acts (support ticket, payment, client request). Stored in platform_audit and tenants.state_reason; shown to the owner without the operator name.
  required:
    - reason
  description: Body of suspendPlatformTenant and resumePlatformTenant. The reason is mandatory (S1-04, PLAT-02).
TrialExtension:
  type: object
  additionalProperties: false
  properties:
    days:
      type: integer
      minimum: 1
      maximum: 30
      description: Calendar days added to the trial (the prototype extends by 14).
    reason:
      type: string
      minLength: 5
      maxLength: 500
  required:
    - days
    - reason
  description: Body of extendPlatformTrial (S1-04, PLAT-05).
PlatformAuditActor:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum:
        - operator
        - owner
        - system
    accountId:
      $ref: ../common/schemas.yaml#/Id
    displayName:
      type: string
      maxLength: 200
      description: Display name at the time of the action; absent for system actions.
  required:
    - kind
  description: Who acted. accountId is the accounts.id of an operator or owner; system rows (billing scheduler, provisioner) have neither accountId nor displayName.
PlatformAuditTarget:
  type: object
  additionalProperties: false
  properties:
    type:
      type: string
      enum:
        - tenant
        - subscription
        - account
        - operator
        - price_book
    id:
      $ref: ../common/schemas.yaml#/Id
    tenantId:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
      maxLength: 200
      description: Display name of the target at the time of the action (tenant name, e-mail of an account).
  required:
    - type
  description: What the action changed. tenantId is set for tenant, subscription and tenant-scoped account rows and drives the tenantId filter. Rows of subscription.* actions (trial_started, trial_extended, trial_ended…) have type subscription, tenantId and the tenant name; tenant.* actions have type tenant.
PlatformAuditEvent:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: Monotonic row id (platform_audit.id); also the order of rows with equal at.
    at:
      $ref: ../common/schemas.yaml#/Instant
    action:
      type: string
      pattern: ^[a-z][a-z_]*(\.[a-z][a-z_]*)+$
      maxLength: 80
      examples:
        - tenant.suspended
        - tenant.resumed
        - subscription.trial_extended
        - subscription.trial_ended
        - tenant.created
        - storage.quota_changed
      description: Open set of dotted action codes; the client shows unknown codes as a generic line.
    actor:
      $ref: ./schemas.yaml#/PlatformAuditActor
    target:
      $ref: ./schemas.yaml#/PlatformAuditTarget
    reason:
      type: string
      maxLength: 500
    result:
      type: string
      enum:
        - ok
        - denied
        - failed
    details:
      type: object
      additionalProperties:
        type: string
        maxLength: 200
      maxProperties: 20
      description: Scalar parameters of the action as strings, numbers in decimal (days, trialEndsAt, quotaBytes, fromStatus, toStatus). Never business content of a tenant and never restricted fields.
  required:
    - id
    - at
    - action
    - actor
    - target
    - result
  description: One row of platform_audit (control DB). Rows are append-only.
PlatformAuditPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/PlatformAuditEvent
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Newest first. Opaque cursor is bound to the operator, the filter and the sort.

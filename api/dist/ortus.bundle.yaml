components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC-issued short-lived API access token. Validate signature, issuer, audience, exp, nbf and tenant binding. Platform tokens have distinct audience/capability from tenant tokens.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ortus_session
      description: Secure HttpOnly SameSite=Lax host-only browser session issued after OIDC + PKCE. Mutations also require X-CSRF-Token and exact allowed Origin. Do not send this cookie with a bearer token.
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated state changes; not required with bearer-only authentication. Invalid/missing token or Origin yields 403. Conditional requirement cannot be represented by OpenAPI required=true.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the preceding response; no offset pagination.
      schema:
        type: string
        maxLength: 2048
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable per intended command. Retain record at least 7 days; financial deduplication also retains a durable tenant+actor+operation+key digest receipt. Key is scoped to tenant+actor+operation. Reuse only for an identical request.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag obtained from latest GET or mutation response. * is not accepted. Missing=428; stale=412. Idempotent replay is checked before current revision precondition.
      schema:
        type: string
        pattern: ^"[^"\s]+"$
        examples:
          - '"rev-7"'
    Limit:
      name: limit
      in: query
      required: false
      description: ""
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OrgUnitFilter:
      name: orgUnitId
      in: query
      required: false
      description: Optional narrower scope, never an expansion beyond actor grants.
      schema:
        $ref: "#/components/schemas/Id"
    Origin:
      name: Origin
      in: header
      required: false
      description: Required and checked against the deployment allowlist for cookie-authenticated state changes and browser public-form submissions/uploads. Never accept wildcard with credentialed requests.
      schema:
        type: string
        format: uri
    appointmentId:
      name: appointmentId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: "#/components/schemas/Id"
    assignmentId:
      name: assignmentId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: "#/components/schemas/Id"
    bookingId:
      name: bookingId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: "#/components/schemas/Id"
    datasetId:
      name: datasetId
      in: path
      required: true
      description: Authorized logical dataset key, not a SQL table.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_.-]{1,99}$
    defectId:
      name: defectId
      in: path
      required: true
      description: W2.00 (0.5.0-stage2). Opaque UUID of a fleet.defects row; same-tenant and visibility checks are mandatory.
      schema:
        $ref: "#/components/schemas/Id"
    expenseId:
      name: expenseId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: "#/components/schemas/Id"
    fileId:

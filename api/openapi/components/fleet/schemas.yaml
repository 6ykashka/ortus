# W2.00 (0.5.0-stage2): рейс от плана до приёмки (Q-45), доработка (S2-10), дефекты осмотра (S2-17).
TripState:
  type: string
  enum:
    - planned
    - assigned
    - inspection
    - defect_review
    - on_route
    - returning
    - submitted
    - rework
    - accepted
    - cancelled
  description: "W2.00 (0.5.0-stage2). Trip lifecycle (fleet.trips.state, docs/10-data-model): planned → assigned → inspection → (defect_review →) on_route → returning → submitted → accepted | rework → submitted; any state before on_route → cancelled. Every transition is a server command with a permission check and If-Match. Prototype TRIP_STATE labels are client texts."
TripCargo:
  type: object
  additionalProperties: false
  properties:
    description:
      type: string
      minLength: 1
      maxLength: 500
      description: Cargo kind as planned by the logist (Сухой груз · 14 паллет-мест).
    weightKg:
      $ref: ../common/schemas.yaml#/Quantity
    volumeM3:
      $ref: ../common/schemas.yaml#/Quantity
    lengthM:
      $ref: ../common/schemas.yaml#/Quantity
    temperatureMinC:
      $ref: ../common/schemas.yaml#/Decimal
    temperatureMaxC:
      $ref: ../common/schemas.yaml#/Decimal
  required:
    - description
    - weightKg
    - volumeM3
    - lengthM
  description: Total cargo of the trip; compatibility compares sums of mass and volume (not 3D packing). Temperature bounds are both present or both absent.
TripStop:
  type: object
  additionalProperties: false
  properties:
    sequence:
      type: integer
      minimum: 1
      format: int64
    op:
      type: string
      enum:
        - load
        - unload
    address:
      type: string
      minLength: 1
      maxLength: 500
    plannedAt:
      $ref: ../common/schemas.yaml#/Instant
    weightKg:
      $ref: ../common/schemas.yaml#/Quantity
    volumeM3:
      $ref: ../common/schemas.yaml#/Quantity
    contact:
      type: string
      maxLength: 200
  required:
    - sequence
    - op
    - address
    - weightKg
    - volumeM3
  description: Stop of a planned trip (fleet.trip_stops). Arrival marks of the driver (Прибыл) stay on the device in the pilot (03 §15 п. 8).
ReworkStep:
  type: string
  enum:
    - photos
    - odometer
    - expenses
    - checklist
  description: "Section of a returned shift (prototype REV_STEPS): photos — Фото при сдаче, odometer — Пробег, expenses — Расходы, checklist — Чек-лист и дефекты."
TripReviewSummary:
  type: object
  additionalProperties: false
  properties:
    decision:
      type: string
      enum:
        - approve
        - reject
        - maintenance_required
        - rework
    comment:
      type: string
      maxLength: 5000
    steps:
      type: array
      items:
        $ref: ./schemas.yaml#/ReworkStep
    attempt:
      type: integer
      minimum: 1
      format: int64
      description: Review round of the trip (fleet.trip_reviews.attempt).
    reviewerMemberId:
      $ref: ../common/schemas.yaml#/Id
    reviewedAt:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - decision
    - attempt
    - reviewerMemberId
    - reviewedAt
  description: Latest manager review of the trip (reviewTrip); a rework card shows its comment and steps to the driver.
TripPlan:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    number:
      type: string
      minLength: 1
      maxLength: 32
      description: Human trip number from core.counters (Р-208).
    title:
      type: string
      minLength: 1
      maxLength: 200
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
    state:
      $ref: ./schemas.yaml#/TripState
    plannedWindow:
      $ref: ../common/schemas.yaml#/TimeWindow
    distanceKm:
      $ref: ../common/schemas.yaml#/Quantity
    cargo:
      $ref: ./schemas.yaml#/TripCargo
    stops:
      type: array
      maxItems: 100
      items:
        $ref: ./schemas.yaml#/TripStop
    driverMemberId:
      $ref: ../common/schemas.yaml#/Id
    driverDisplayName:
      type: string
      maxLength: 200
      description: Name of the driver for trip cards (a temporary pool driver is shown by the pool code until approval).
    vehicleId:
      $ref: ../common/schemas.yaml#/Id
    reservationId:
      $ref: ../common/schemas.yaml#/Id
    holdExpiresAt:
      $ref: ../common/schemas.yaml#/Instant
    departureInspectionId:
      $ref: ../common/schemas.yaml#/Id
    returnInspectionId:
      $ref: ../common/schemas.yaml#/Id
    blockingDefectId:
      $ref: ../common/schemas.yaml#/Id
    lastReview:
      $ref: ./schemas.yaml#/TripReviewSummary
    startedAt:
      $ref: ../common/schemas.yaml#/Instant
    routeCompletedAt:
      $ref: ../common/schemas.yaml#/Instant
    returnedAt:
      $ref: ../common/schemas.yaml#/Instant
    acceptedAt:
      $ref: ../common/schemas.yaml#/Instant
    revision:
      type: integer
      minimum: 1
      format: int64
  required:
    - id
    - number
    - title
    - orgUnitId
    - state
    - plannedWindow
    - cargo
    - stops
    - revision
  description: "W2.00 (0.5.0-stage2, Q-45). A trip from planning to acceptance — one fleet.trips row in any TripState. The 0.1 Trip is the operational projection of the same row after startTrip: same id, same revision and ETag, so returnTrip and reviewTrip take the If-Match of either. No earnings, payroll totals or derived salary values (AC-05): earnings are read only through the Earnings tag. Absent optional fields mean not assigned yet (driver, vehicle, reservation, inspections, defect, review)."
TripPlanCreate:
  type: object
  additionalProperties: false
  properties:
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
    title:
      type: string
      minLength: 1
      maxLength: 200
    plannedWindow:
      $ref: ../common/schemas.yaml#/TimeWindow
    distanceKm:
      $ref: ../common/schemas.yaml#/Quantity
    cargo:

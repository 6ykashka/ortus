      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          at:
            $ref: ../common/schemas.yaml#/Instant
          kind:
            type: string
            enum:
              - payment
              - expense
              - accrual
          text:
            type: string
          amount:
            $ref: ./schemas.yaml#/RepairMoneyDelta
        required:
          - at
          - kind
          - text
          - amount
    estimateVersion:
      type: integer
      minimum: 1
  required:
    - projectId
    - contract
    - received
    - expenses
    - marginPlan
    - movements
CrewAccrual:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    projectId:
      $ref: ../common/schemas.yaml#/Id
    workerId:
      $ref: ../common/schemas.yaml#/Id
    workerName:
      type: string
    role:
      type: string
    amount:
      $ref: ../common/schemas.yaml#/Money
    state:
      type: string
      enum:
        - pending_act
        - accrued
        - proposed
        - paid
    selfEmployed:
      type: boolean
    actId:
      $ref: ../common/schemas.yaml#/Id
    work:
      type: string
  required:
    - id
    - projectId
    - workerId
    - workerName
    - role
    - amount
    - state
    - selfEmployed
CrewAccrualList:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/CrewAccrual
  required:
    - items
PayoutRequest:
  type: object
  additionalProperties: false
  properties:
    accrualIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
      minItems: 1
      maxItems: 200
  required:
    - accrualIds
PayoutResult:
  type: object
  additionalProperties: false
  properties:
    proposalId:
      $ref: ../common/schemas.yaml#/Id
    accruals:
      type: array
      items:
        $ref: ./schemas.yaml#/CrewAccrual
  required:
    - proposalId
    - accruals
  description: The payout creates a proposal of a cash operation (W5.31, Q-W4.00-repair-12); the payment itself is posted by the cashier. No integration with «Мой налог» — accounting only.
Subcontractor:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
    scope:
      type: string
    active:
      type: boolean
    memberId:
      $ref: ../common/schemas.yaml#/Id
    accessUntil:
      type: string
      format: date
    contract:
      $ref: ../common/schemas.yaml#/Money
    paid:
      $ref: ../common/schemas.yaml#/Money
  required:
    - id
    - name
    - scope
    - active
SubcontractorList:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/Subcontractor
  required:
    - items
SubcontractorAccessSet:
  type: object
  additionalProperties: false
  properties:
    active:
      type: boolean
    until:
      type: string
      format: date
  required:
    - active
ClientLink:
  type: object
  additionalProperties: false
  properties:
    active:
      type: boolean
    sentAt:
      $ref: ../common/schemas.yaml#/Instant
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
    revokedAt:
      $ref: ../common/schemas.yaml#/Instant
    sentTo:
      type: string
      maxLength: 40
  required:
    - active
ClientLinkIssued:
  type: object
  additionalProperties: false
  properties:
    link:
      $ref: ./schemas.yaml#/ClientLink
    url:
      type: string
      maxLength: 500
  required:
    - link
    - url
  description: The URL with the token is returned once; the database keeps only the token hash. The link lives until the object is handed over (Q-W4.00-repair-10).
ClientCabinet:
  type: object
  additionalProperties: false
  properties:
    projectName:
      type: string
    address:
      type: string
    clientName:
      type: string
    readinessPct:
      type: integer
      minimum: 0
      maximum: 100
    stages:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name:
            type: string
          state:
            type: string
            enum:
              - done
              - started
              - planned
        required:
          - name
          - state
    photos:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          fileId:
            $ref: ../common/schemas.yaml#/Id
          date:
            type: string
            format: date
        required:
          - fileId
          - date
    documents:
      type: array
      items:
        $ref: ./schemas.yaml#/RepairDocument
    paid:
      $ref: ../common/schemas.yaml#/Money
    contract:
      $ref: ../common/schemas.yaml#/Money
    estimate:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
            - draft
            - sent
            - approved
            - replaced
        total:
          $ref: ../common/schemas.yaml#/Money
      required:
        - version
        - state
        - total
  required:
    - projectName
    - address
    - clientName
    - readinessPct
    - stages
    - photos
    - documents
    - paid
    - contract
ClientEstimateApproval:
  type: object
  additionalProperties: false
  properties:
    version:
      type: integer
      minimum: 1
    state:
      type: string
      enum:
        - draft
        - sent
        - approved
        - replaced
  required:
    - version
    - state
ClientSign:
  type: object
  additionalProperties: false
  properties:
    smsCode:
      type: string
      pattern: ^[0-9]{4,8}$
  required:
    - smsCode
RepairRejectReason:
  type: string
  enum:
    - already_in_estimate
    - client_refused
    - warranty
    - not_agreed_with_client
  description: "Reason of rejecting a change order (design/docs/19 «Допработы после договора»): already in the estimate, client refused, warranty, not agreed with the client. The foreman sees it."
RepairScheduleReason:
  type: string
  enum:
    - client_request
    - material_delay
    - executor_busy
    - rework
    - weather_or_drying
    - scope_change
    - other
  description: "Reason of a schedule move (prototype GREASONS): client request, material delay, executor busy, rework, weather or drying, scope change, other."
RepairDocumentKind:
  type: string
  enum:
    - contract
    - agreement
    - act
    - invoice
    - handover_act
    - warranty

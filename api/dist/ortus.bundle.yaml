          format: uuid
          readOnly: true
          description: "W2.40 (0.5.1-stage2). Legal entity of the trip (fleet.trips.legal_entity_id → org.legal_entities, nullable FK): the server fills it with the legal entity of the trip company by default; there is no UI and no write field in stage 2 (createTripPlan does not take it). null or absent — not assigned yet."
        revision:
          type: integer
          minimum: 1
          format: int64
      required:
        - id
        - number
        - title
        - orgUnitId
        - state
        - plannedWindow
        - cargo
        - stops
        - revision
      description: "W2.00 (0.5.0-stage2, Q-45). A trip from planning to acceptance — one fleet.trips row in any TripState. The 0.1 Trip is the operational projection of the same row after startTrip: same id, same revision and ETag, so returnTrip and reviewTrip take the If-Match of either. No earnings, payroll totals or derived salary values (AC-05): earnings are read only through the Earnings tag. Absent optional fields mean not assigned yet (driver, vehicle, reservation, inspections, defect, review)."
    TripPlanCreate:
      type: object
      additionalProperties: false
      properties:
        orgUnitId:
          $ref: "#/components/schemas/Id"
        title:
          type: string
          minLength: 1
          maxLength: 200
        plannedWindow:
          $ref: "#/components/schemas/TimeWindow"
        distanceKm:
          $ref: "#/components/schemas/Quantity"
        cargo:
          $ref: "#/components/schemas/TripCargo"
        stops:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/TripStop"
        driverMemberId:
          $ref: "#/components/schemas/Id"
      required:
        - orgUnitId
        - title
        - plannedWindow
        - cargo
        - stops
      description: Planned trip (S2-13). The server assigns the number, validates stop order and per-leg load (mass and volume separately, never below zero) and the driver (active member with the driver work profile in scope). The vehicle is assigned later by assignTripVehicle or the driver reservation.
    TripPlanPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TripPlan"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 2048
      required:
        - items
        - nextCursor
      description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
    TripReturn:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          const: return
        returnInspectionId:
          $ref: "#/components/schemas/Id"
      required:
        - action
        - returnInspectionId
      description: Requires latest trip ETag. Validates same vehicle/driver, non-decreasing odometer and checklist; records returnedAt server-side. Offline return remains draft until this succeeds.
    TripReview:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
            - approve
            - reject
            - maintenance_required
            - rework
        comment:
          type: string
          maxLength: 5000
        steps:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ReworkStep"
          description: "W2.00 (0.5.0-stage2, S2-10). Sections the driver must redo (Что вернуть на доработку). Decision rework returns a submitted trip to the driver by sections: the trip moves to rework, the vehicle stays occupied, the driver resubmits a return inspection (attempt + 1) and returnTrip moves the trip back to submitted. rework requires a non-blank comment and at least one step; otherwise 422 validation_failed with the prototype texts: comment — Опишите, что нужно исправить; steps — Отметьте хотя бы один раздел для доработки. steps with another decision — 422. Review is allowed only from submitted, otherwise 409 invalid_transition (Смена уже обработана)."
      required:
        - decision
      description: Only responsible manager/owner. Approve closes review and may release the vehicle if no maintenance block; rejection does not undo trip facts or delete expenses.
    TripReviewSummary:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
            - approve
            - reject
            - maintenance_required
            - rework
        comment:
          type: string
          maxLength: 5000
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ReworkStep"
        attempt:
          type: integer
          minimum: 1
          format: int64
          description: Review round of the trip (fleet.trip_reviews.attempt).
        reviewerMemberId:
          $ref: "#/components/schemas/Id"
        reviewedAt:
          $ref: "#/components/schemas/Instant"
      required:
        - decision
        - attempt
        - reviewerMemberId
        - reviewedAt
      description: Latest manager review of the trip (reviewTrip); a rework card shows its comment and steps to the driver.
    TripStart:
      type: object
      additionalProperties: false
      properties:
        reservationId:
          $ref: "#/components/schemas/Id"
        departureInspectionId:
          $ref: "#/components/schemas/Id"
      required:
        - reservationId
        - departureInspectionId
      description: "Single online transaction: consume unexpired reservation, validate current vehicle/driver grants and complete ready-photo checklist, confirm no blocking damage, acquire operational vehicle lock, create in_progress trip and outbox event. If manager preapproval is configured inspection must be approved. No client status override."
    TripState:
      type: string
      enum:
        - planned
        - assigned
        - inspection
        - defect_review
        - on_route
        - returning
        - submitted
        - rework
        - accepted
        - cancelled
      description: "W2.00 (0.5.0-stage2). Trip lifecycle (fleet.trips.state, docs/10-data-model): planned → assigned → inspection → (defect_review →) on_route → returning → submitted → accepted | rework → submitted; any state before on_route → cancelled. Every transition is a server command with a permission check and If-Match. Prototype TRIP_STATE labels are client texts."
    TripStop:
      type: object
      additionalProperties: false
      properties:
        sequence:
          type: integer
          minimum: 1
          format: int64
        op:
          type: string
          enum:
            - load
            - unload
        address:
          type: string
          minLength: 1
          maxLength: 500
        plannedAt:
          $ref: "#/components/schemas/Instant"
        weightKg:
          $ref: "#/components/schemas/Quantity"
        volumeM3:
          $ref: "#/components/schemas/Quantity"
        contact:
          type: string
          maxLength: 200
      required:
        - sequence
        - op
        - address
        - weightKg
        - volumeM3
      description: Stop of a planned trip (fleet.trip_stops). Arrival marks of the driver (Прибыл) stay on the device in the pilot (03 §15 п. 8).
    TripVehicleAssignment:
      type: object
      additionalProperties: false
      properties:
        vehicleId:
          $ref: "#/components/schemas/Id"
      required:
        - vehicleId
      description: Vehicle the logist assigns to a planned trip (Назначить на рейс).
    UploadComplete:
      type: object
      additionalProperties: false
      properties:
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
        - sha256
    UploadCreate:
      type: object
      additionalProperties: false
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
          format: int64
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        purpose:
          type: string
          enum:
            - inspection
            - expense_receipt
            - knowledge_attachment
            - form_attachment
            - repair_evidence
        owner:
          $ref: "#/components/schemas/ObjectRef"
      required:
        - fileName
        - contentType
        - sizeBytes
        - sha256
        - purpose
        - owner
      description: Reject oversized or unsupported MIME; reserve bytes before issuing a URL. Owner belongs to same tenant and the actor can attach files to it. Before inspection creation, departure photos attach to the reservation and return photos to the trip; submitInspection binds them atomically to its evidence. Expense receipts likewise attach to the trip before expense creation. A repair report may attach photos to its project before the work log exists. These are explicit allowed owner transitions, never arbitrary reparenting. File display name is not an object storage path.
    UploadSession:
      type: object
      additionalProperties: false
      properties:
        uploadId:
          $ref: "#/components/schemas/Id"
        fileId:
          $ref: "#/components/schemas/Id"
        state:
          type: string
          enum:
            - issued
            - uploaded
            - completed
            - expired
            - aborted
          description: issued — ticket handed out; uploaded — object seen in quarantine; completed — completeUpload accepted (scan follows); expired/aborted — reservation released.
        purpose:
          type: string
          enum:
            - inspection
            - expense_receipt
            - knowledge_attachment
            - form_attachment
            - repair_evidence
          description: Same values as UploadCreate.purpose of initiateUpload (0.1). The value is stored verbatim in files.objects.purpose (tenant 0001), one to one, without dotted refinements; the dotted examples in the 0001 column comment (inspection.front, expense.receipt) predate the contract and are not used. The slot inside the owner (front, rear, receipt…) belongs to the owning object, not to purpose.
        owner:
          $ref: "#/components/schemas/ObjectRef"
        sizeBytes:
          type: integer
          minimum: 1
          format: int64
        reservedBytes:
          type: integer
          minimum: 0
          format: int64
        ticketExpiresAt:
          $ref: "#/components/schemas/Instant"
        sessionExpiresAt:
          $ref: "#/components/schemas/Instant"
        fileStatus:
          type: string
          enum:
            - pending_upload
            - quarantined
            - ready
            - rejected
        createdAt:
          $ref: "#/components/schemas/Instant"
      required:
        - uploadId
        - fileId
        - state
        - purpose
        - owner
        - sizeBytes
        - reservedBytes
        - ticketExpiresAt
        - sessionExpiresAt
        - fileStatus
        - createdAt
      description: Upload session (S1-20) — quota reservation, private PUT ticket, completion and scan. A session never grants list, read or delete rights on other files.
    UploadTicket:
      type: object
      additionalProperties: false
      properties:
        uploadId:
          $ref: "#/components/schemas/Id"
        fileId:
          $ref: "#/components/schemas/Id"
        method:
          type: string
          const: PUT
        uploadUrl:
          type: string
          format: uri
        requiredContentType:
          type: string
        requiredSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        expiresAt:
          $ref: "#/components/schemas/Instant"
        maxBytes:
          type: integer
          minimum: 1
          format: int64
      required:
        - uploadId
        - fileId
        - method
        - uploadUrl
        - requiredContentType
        - requiredSha256
        - expiresAt
        - maxBytes
      description: Single object capability, 15 minute TTL, private quarantine namespace. URL is a secret; do not log or persist in analytics. Endpoint does not grant list/read/delete permissions.
    Vehicle:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        orgUnitId:
          $ref: "#/components/schemas/Id"
        registrationNumber:
          type: string
        displayName:
          type: string
        bodyType:
          type: string
          enum:
            - van
            - box
            - flatbed
            - refrigerated
            - tent
        capacity:
          $ref: "#/components/schemas/VehicleCapacity"
        temperatureMinC:
          $ref: "#/components/schemas/Decimal"
        temperatureMaxC:
          $ref: "#/components/schemas/Decimal"
        equipment:
          type: array
          items:
            type: string
            enum:
              - tail_lift
              - side_loading
              - pallet_jack
              - refrigerator
        status:
          type: string
          enum:
            - available
            - reserved
            - in_use
            - maintenance
            - blocked
        odometerKm:
          $ref: "#/components/schemas/Quantity"
        revision:
          type: integer
          minimum: 1
          format: int64
        heldByTripId:
          $ref: "#/components/schemas/Id"
          description: W2.00 (0.5.0-stage2). Trip the vehicle is held for (logist assignment or driver reservation); the card chip Назначена на {trip} / Ваша бронь. Absent when the vehicle is not held.
        statusNote:
          type: string
          maxLength: 200
          description: "W2.00. Short reason shown after the status label: planned maintenance (Плановое ТО до 03.10), a confirmed defect (неисправность подтверждена), a hold for another trip (другой рейс). Derived by the server from maintenance bookings, defects and reservations; never free text from a driver."
        depot:
          type: string
          maxLength: 200
          description: W2.00. Home depot or yard of the vehicle (Склад № 1), shown in the vehicle row.
      required:

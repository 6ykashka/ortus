    WorkLogPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkLog"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 2048
      required:
        - items
        - nextCursor
      description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
    WorkProfile:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        function:
          type: string
          enum:
            - driver
            - practitioner
            - foreman
            - manager
        validFrom:
          $ref: "#/components/schemas/Instant"
        validUntil:
          type:
            - string
            - "null"
          format: date-time
          pattern: Z$
          description: Exclusive end; null — open-ended.
        state:
          type: string
          enum:
            - scheduled
            - active
            - ended
          description: Derived from the period and the server clock.
        revision:
          type: integer
          minimum: 1
          format: int64
      required:
        - id
        - function
        - validFrom
        - validUntil
        - state
        - revision
      description: A work function of a person with a half-open period [validFrom, validUntil) — people.work_profiles (tenant 0001). Periods of the same function never overlap.
    WorkProfileCreate:
      type: object
      additionalProperties: false
      properties:
        function:
          type: string
          enum:
            - driver
            - practitioner
            - foreman
            - manager
        validFrom:
          $ref: "#/components/schemas/Instant"
        validUntil:
          $ref: "#/components/schemas/Instant"
      required:
        - function
        - validFrom
    WorkProfileList:
      type: object
      additionalProperties: false
      properties:
        memberId:
          $ref: "#/components/schemas/Id"
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkProfile"
          maxItems: 200
      required:
        - memberId
        - items
    WorkProfilePatch:
      type: object
      additionalProperties: false
      properties:
        validUntil:
          $ref: "#/components/schemas/Instant"
      required:
        - validUntil
    Worker:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        displayName:
          type: string
        trade:
          type: string
        status:
          type: string
          enum:
            - active
            - archived
      required:
        - id
        - displayName
        - trade
        - status
      description: Non-login person record; no userId, credentials or organization membership. It must never consume a user seat or inherit access merely because work is recorded for them.
    WorkerCreate:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 150
        trade:
          type: string
          maxLength: 100
      required:
        - displayName
        - trade
x-contract-status: design-proposal-not-implemented
x-authorization-order:
  - authenticate
  - tenant-membership-and-binding
  - tenant-state
  - module-installation
  - plan-entitlement
  - separation-of-duties
  - permission
  - resource-scope
  - relationship
  - field-policy
x-separation-of-duties:
  rule: active_driver_work_profile_incompatible_with_earnings
  evaluate:
    - active professional assignments / member workProfiles
    - direct roles
    - group memberships
    - role changes
    - scope inheritance
    - temporary grants
    - owner binding
  onConflict: 409 separation_of_duties_conflict
  runtime: deny earnings for an active driver work profile even when a conflicting grant or owner binding exists; a driving qualification alone does not activate the work profile

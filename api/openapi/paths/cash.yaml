# Контракт Ортус · тег Cash: пути и операции. Пишет только стюард контракта (план v2 §3.5).
/api/v1/tenants/{tenantId}/cash/accounts:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listCashAccounts
    tags:
      - Cash
    summary: Read internal cash accounts and balances
    x-permissions:
      - cash.read
      - cash.advance.self
    x-scope: tenant-org-unit-account-self
    description: "W5.00 (0.12.0-stage5): the accounts of the scope with v2 fields (kind, shift mode, limits, my rights); balance is null without cash.balance.read. The holder of an advance account sees it with cash.advance.self (scope self)."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/cash/schemas.yaml#/CashAccountPage
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Cursor
      - $ref: ../components/common/parameters.yaml#/Limit
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
            - cash_drawer
            - safe
            - advance
            - acquiring
            - bank
            - virtual
      - name: orgUnitId
        in: query
        required: false
        schema:
          $ref: ../components/common/schemas.yaml#/Id
    x-permissions-mode: any
  post:
    operationId: createCashAccount
    tags:
      - Cash
    summary: Create a zero-balance internal cash account
    x-permissions:
      - cash.accounts.manage
    x-scope: tenant-org-unit
    description: "W5.00 (0.12.0-stage5): Create an internal cash account of one of six kinds with zero balance (cash.manage of 0.1 is renamed cash.accounts.manage). A terminal (acquiring) is bound to its cash desk (drawerAccountId)."
    responses:
      "201":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/cash/schemas.yaml#/CashAccount
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "402":
        $ref: ../components/common/responses.yaml#/PlanRequired
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/cash/schemas.yaml#/CashAccountCreate
    x-permissions-mode: all
/api/v1/tenants/{tenantId}/cash/operations:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listCashOperations
    tags:
      - Cash
    summary: List visible append-only ledger postings
    x-permissions:
      - cash.read
      - cash.advance.self
    x-scope: tenant-org-unit-account-self
    description: "W5.00 (0.12.0-stage5): the visible ledger rows with filters by account, type and shift."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/cash/schemas.yaml#/CashOperationPage
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Cursor
      - $ref: ../components/common/parameters.yaml#/Limit
      - name: accountId
        in: query
        required: false
        schema:
          $ref: ../components/common/schemas.yaml#/Id
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
            - in
            - out
            - refund
            - move_in
            - move_out
            - opening
            - adjust
            - storno
      - name: shiftId
        in: query
        required: false
        schema:
          $ref: ../components/common/schemas.yaml#/Id
    x-permissions-mode: any
  post:
    operationId: postCashOperation
    tags:
      - Cash
    summary: Record an internal receipt, expense or linked reversal
    x-permissions:
      - cash.post
    x-scope: tenant-org-unit-account
    description: "A financial posting is atomic, idempotent and immutable. W5.00 (0.12.0-stage5): refund additionally requires cash.refund, opening (the first row of an account) cash.accounts.manage (Q-W4.00-cash-8); a reversal is reverseCashOperation. Over the role limit the response is 202 with an approval request (Q-W4.00-cash-2). A closed shift — 409 shift_closed; the same source — 409 duplicate_source; the same receipt — 409 duplicate_receipt; not enough funds — 409 insufficient_funds. This records internal management cash, not a fiscal receipt or bank transaction."
    responses:
      "201":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/cash/schemas.yaml#/CashOperation
      "202":
        description: "Accepted: the amount exceeds the role limit; an approval request is created instead of a ledger posting (Q-W4.00-cash-2)."
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/cash/schemas.yaml#/CashApprovalRequest
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "402":
        $ref: ../components/common/responses.yaml#/PlanRequired
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/cash/schemas.yaml#/CashOperationCreate
          example:
            accountId: 10000000-0000-4000-8000-000000000001
            type: in
            direction: in
            method: cash
            amount:
              amountMinor: 500000
              currency: RUB
            category: service_payment
            categoryId: service
            basis: Оплата визита
            occurredAt: "2026-10-05T09:30:00Z"
            relatedObject:
              moduleKey: spa
              entityType: appointment
              entityId: 20000000-0000-4000-8000-000000000002
    x-permissions-mode: all
    x-events:
      - cash.operation.posted.v1
      - cash.approval.requested.v1

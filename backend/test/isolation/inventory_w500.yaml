# Матрица изоляции: склад контракта 0.12.0-stage5 (W5.00, контрактный PR этапа 5); хендлеры — W5.10.
# Строки писались до хендлера (pending, W5.00); W5.10 снял pending: без сессии 401, чужая организация 404 (AC-02),
# владелец читает списки склада (200, tenant:b в ответе нет) и получает 404 на резерв, которого нет. Строки с созданием
# складов и номенклатуры владельцу требуют фикстур склада (их нет в фикстурах W1.04) — вне W5.10. Отказы шлюза (403
# forbidden_action, module_not_installed) — отдельный файл без pending. Склады вне области — 404.
# Формат — README.md.
# После правки: go -C backend generate ./test/isolation
module: inventory_w500
endpoints:
  - op: listWarehouses
    method: GET
    path: /api/v1/tenants/{tenantId}/inventory/warehouses
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
        note: владелец видит свою организацию; чужой tenant:b в ответе нет (AC-02)
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        note: чужая организация — как несуществующая (AC-02)
  - op: createWarehouse
    method: POST
    path: /api/v1/tenants/{tenantId}/inventory/warehouses
    rows:
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
        body: "{}"
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        body: "{}"
        note: чужая организация — как несуществующая (AC-02)
  - op: updateInventoryItem
    method: PATCH
    path: /api/v1/tenants/{tenantId}/inventory/items/{itemId}
    rows:
      - actor: anonymous
        params: { tenantId: tenant:a, itemId: tenant:missing }
        status: 401
        body: "{}"
      - actor: b.owner
        params: { tenantId: tenant:a, itemId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: "{}"
        note: чужая организация — как несуществующая (AC-02)
  - op: listInventoryBalances
    method: GET
    path: /api/v1/tenants/{tenantId}/inventory/balances
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
        note: владелец видит свою организацию; чужой tenant:b в ответе нет (AC-02)
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        note: чужая организация — как несуществующая (AC-02)
  - op: listInventoryReservations
    method: GET
    path: /api/v1/tenants/{tenantId}/inventory/reservations
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
        note: владелец видит свою организацию; чужой tenant:b в ответе нет (AC-02)
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        note: чужая организация — как несуществующая (AC-02)
  - op: createInventoryReservation
    method: POST
    path: /api/v1/tenants/{tenantId}/inventory/reservations
    rows:
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
        body: "{}"
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        body: "{}"
        note: чужая организация — как несуществующая (AC-02)
  - op: releaseInventoryReservation
    method: POST
    path: /api/v1/tenants/{tenantId}/inventory/reservations/{reservationId}/release
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, reservationId: tenant:missing }
        status: 404
        code: not_found
        note: нет такого резерва — 404 владельцу, как и чужой (AC-01)
      - actor: anonymous
        params: { tenantId: tenant:a, reservationId: tenant:missing }
        status: 401
      - actor: b.owner
        params: { tenantId: tenant:a, reservationId: tenant:missing }
        status: 404
        absent: [tenant:a]
        note: чужая организация — как несуществующая (AC-02)

# Локальный стенд Ортус. Не для production. (design/docs/repo-skeleton/docker-compose.yml)
# Вызов: node deploy/compose/stand.mjs <up|down|ps>  или
#   docker compose -p $COMPOSE_PROJECT_NAME -f deploy/compose/docker-compose.yml --env-file .env <cmd>
# .env для слота агента: node deploy/compose/stand.mjs init --slot <N>  (имя ortus-s<N>, порты + 100 × N).
# Образы закреплены по digest (D-04): docker buildx imagetools inspect <image>:<tag>, снято 15.10.2026.
# api, worker, web запускаются отдельно (make dev, W0.09).
name: ${COMPOSE_PROJECT_NAME:-ortus}

x-hc: &hc
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

# postgres:17.11 (D-04: только PostgreSQL 17, без прогона на 16.4 — W2.49). Тот же digest — migratetest.Postgres17,
# accesstest.Image и PG_TEST_IMAGES jobs integration и isolation в .github/workflows/ci.yml (тесты сверяют).
x-pg-image: &pg-image postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3

services:
  postgres:
    image: *pg-image
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:?}
      POSTGRES_PASSWORD: ${PG_SUPERPASS:?}
      POSTGRES_DB: ortus_control
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
    ports:
      - { target: 5432, published: "${POSTGRES_PORT:-5432}", host_ip: 127.0.0.1, protocol: tcp }
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d ortus_control']

  # Тестовая база в памяти (профиль test): быстрые integration-прогоны без testcontainers.
  postgres-test:
    image: *pg-image
    profiles: [test]
    command:
      ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off", "-c", "synchronous_commit=off"]
    environment:
      POSTGRES_USER: ortus
      POSTGRES_PASSWORD: ortus
      POSTGRES_DB: ortus_test
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - { target: 5432, published: "${PG_TEST_PORT:-5433}", host_ip: 127.0.0.1, protocol: tcp }
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U ortus -d ortus_test"]

  # Официальные образы minio/minio и minio/mc больше не публикуются анонимно (Docker Hub, quay.io, ghcr — 10.2026).
  # pgsty/minio, pgsty/mc — сообщественная сборка того же кода с тем же CLI (решение — в отчёте W0.06).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    ports:
      - { target: 9000, published: "${MINIO_PORT:-9000}", host_ip: 127.0.0.1, protocol: tcp }
      - {
          target: 9001,
          published: "${MINIO_CONSOLE_PORT:-9001}",
          host_ip: 127.0.0.1,
          protocol: tcp,
        }
    volumes: [minio:/data]
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]

  # Одноразовый: создаёт бакет. Не входит в up --wait: node deploy/compose/stand.mjs bucket
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    profiles: [init]
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-ortus-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - { target: 8025, published: "${MAILPIT_UI_PORT:-8025}", host_ip: 127.0.0.1, protocol: tcp }
      - { target: 1025, published: "${SMTP_PORT:-1025}", host_ip: 127.0.0.1, protocol: tcp }
    healthcheck:
      <<: *hc
      test: ["CMD", "/mailpit", "readyz"]

  # Образ без shell — healthcheck нет; проверка снаружи: GET http://127.0.0.1:${OTEL_HEALTH_PORT}/
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports:
      - { target: 4317, published: "${OTEL_GRPC_PORT:-4317}", host_ip: 127.0.0.1, protocol: tcp }
      - { target: 4318, published: "${OTEL_HTTP_PORT:-4318}", host_ip: 127.0.0.1, protocol: tcp }
      - {
          target: 13133,
          published: "${OTEL_HEALTH_PORT:-13133}",
          host_ip: 127.0.0.1,
          protocol: tcp,
        }

  # Профиль keycloak (нужен с шага 1.3, W1.03). Realm-файлы — deploy/compose/keycloak/ (W1.03).
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4
    profiles: [keycloak]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASS:?}
      KC_HEALTH_ENABLED: "true"
    ports:
      - { target: 8080, published: "${KEYCLOAK_PORT:-8081}", host_ip: 127.0.0.1, protocol: tcp }
    volumes:
      - { type: bind, source: ./keycloak, target: /opt/keycloak/data/import, read_only: true }
    healthcheck:
      <<: *hc
      start_period: 60s
      retries: 40
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]

volumes:
  pg: {}
  minio: {}

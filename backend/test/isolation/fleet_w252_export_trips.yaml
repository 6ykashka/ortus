# Матрица изоляции: выгрузка CSV «Поездок» (exportDataset, контракт 0.6.1-stage2 стюарда W2.52, D-11 комплекта) —
# хендлер W2.50 (fleet/csv, pending снят). Выгрузка — те же строки, что queryDataset (data_trips.yaml W2.08): область права набора, скрытые поля
# не попадают в файл. data.export у фикстур есть только у владельца; рейсов в фикстурах нет, id записей в файл не
# попадают — положительная строка проверяет absent. Отказ шлюза без data.export — fleet_w252_gate.yaml.
# Формат — README.md. После правки: go -C backend generate ./test/isolation
module: fleet_w252_export_trips
endpoints:
  - op: exportDataset
    method: POST
    path: /api/v1/tenants/{tenantId}/datasets/fleet.trips/export
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b, vehicle:b.msk1]
        body: '{"select": ["trip", "state"], "filters": [], "sort": []}'
        note: владелец выгружает поездки своей организации
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        body: '{"select": ["trip"], "filters": [], "sort": []}'
        note: чужая организация — как несуществующая (AC-02)
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
        body: '{"select": ["trip"], "filters": [], "sort": []}'

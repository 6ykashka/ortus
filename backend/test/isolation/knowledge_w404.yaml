# Матрица изоляции: «База знаний» контракта 0.9.0-stage4 (W4.04, контрактный PR 3 этапа 4); хендлеры — W4.31 (pending
# снят: строки проверяют ответы сервера модуля internal/modules/knowledge).
# Пространства, узлы, запросы доступа и правила — данные организации (схема kb, tenant 0024): чужая организация — 404,
# как несуществующая (AC-01, AC-02), без сессии — 401. Фикстуры с содержимым (W4.31) дают каждому тенанту пространство
# «Регламенты» space:<t>.rules со страницей page:<t>.rules-intro, открытый запрос kb_request:<t>.ask и правило
# kb_rule:<t>.review. Строки «чужой объект в своём тенанте»: id пространства, узла, запроса или правила организации B
# в пути организации A — владельцу A 404, как несуществующий (у каждого эндпоинта с {spaceId}, {nodeId}, {requestId},
# {ruleId}, кроме команд с If-Match). id tenant:missing — такого объекта нет ни в одной базе: владельцу своей
# организации — 404. Скрытое пространство или узел своей организации — тоже 404 (раздел 2.2 разбора knowledge.md,
# «скрытое не видно нигде») — integration-тесты W4.31 на сиде W4.30. Команды с If-Match (updateKnowledgeSpace,
# publishKnowledgeNodeVersion, setKnowledgeNodeAccess, updateKnowledgePage) строки не передают (README, «Цель набора»)
# — у них только отказы
# до хендлера (без сессии — 401, чужая организация — 404 раньше предусловия). Изменяющие строки владельца своей
# организации над объектами фикстур не пишутся: набор общий для всех матриц. Отказы шлюза по правам —
# knowledge_w404_gate.yaml. Формат — README.md. После правки: go -C backend generate ./test/isolation
module: knowledge_w404
endpoints:
  # Пространства
  - op: listKnowledgeSpaces
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/spaces
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        present: [space:a.rules]
        absent: [tenant:b, space:b.rules]
        note: пространства своей организации; пространств тенанта B нет
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        note: чужая организация — как несуществующая
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
  - op: createKnowledgeSpace
    method: POST
    path: /api/v1/tenants/{tenantId}/knowledge/spaces
    rows:
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        body: '{"name": "Охрана труда", "access": "open", "templateKey": "blank"}'
        note: пространство в чужой организации — 404 до тела
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
        body: '{"name": "Охрана труда", "access": "open", "templateKey": "blank"}'
  - op: listKnowledgeSpaceTemplates
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/space-templates
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
        note: шаблоны — константы кода, данных тенанта B в ответе нет
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
  - op: updateKnowledgeSpace
    method: PATCH
    path: /api/v1/tenants/{tenantId}/knowledge/spaces/{spaceId}
    rows:
      - actor: b.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: '{"access": "limited", "dryRun": true}'
        note: правка пространства чужой организации — 404 до предусловия If-Match
      - actor: anonymous
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 401
        body: '{"access": "limited", "dryRun": true}'
  - op: getKnowledgeSpaceTree
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/spaces/{spaceId}/tree
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:b]
        note: пространства нет в организации — 404 и владельцу
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: space:b.rules }
        status: 404
        absent: [tenant:b, space:b.rules]
        note: чужой объект в своём тенанте — пространство организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:a]
        note: дерево чужой организации по id — как несуществующее
      - actor: anonymous
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 401
  - op: searchKnowledge
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/search?q=rules
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
        note: поиск — только по своей организации
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
  # Узел
  - op: getKnowledgeNode
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:b]
        note: узла нет в организации — 404 и владельцу
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: page:b.rules-intro }
        status: 404
        absent: [tenant:b, page:b.rules-intro]
        note: чужой объект в своём тенанте — страница организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
        note: узел чужой организации по id — как несуществующий
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
  - op: getKnowledgeNodeVersion
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/versions/1
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:b]
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: page:b.rules-intro }
        status: 404
        absent: [tenant:b, page:b.rules-intro]
        note: чужой объект в своём тенанте — страница организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
  - op: createKnowledgeNode
    method: POST
    path: /api/v1/tenants/{tenantId}/knowledge/spaces/{spaceId}/nodes
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:b]
        body: '{"kind": "page", "title": "Выезд в непогоду"}'
        note: страница в несуществующем пространстве — 404
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: space:b.rules }
        status: 404
        absent: [tenant:b, space:b.rules]
        body: '{"kind": "page", "title": "Выезд в непогоду"}'
        note: чужой объект в своём тенанте — пространство организации B в пути A, как несуществующий
      - actor: a.driver-msk1
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:b]
        body: '{"kind": "page", "title": "Моя страница"}'
        note: возврат 1 — шлюз пускает читающего (knowledge.read), пространство и право создавать проверяет модуль
      - actor: b.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: '{"kind": "page", "title": "Выезд в непогоду"}'
      - actor: anonymous
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 401
        body: '{"kind": "page", "title": "Выезд в непогоду"}'
  - op: publishKnowledgeNodeVersion
    method: POST
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/versions
    rows:
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: '{"body": "Новый текст."}'
        note: публикация в чужой организации — 404 до предусловия If-Match
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
        body: '{"body": "Новый текст."}'
  - op: setKnowledgeNodeStatus
    method: POST
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/status
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:b]
        body: '{"status": "active"}'
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: page:b.rules-intro }
        status: 404
        absent: [tenant:b, page:b.rules-intro]
        body: '{"status": "active"}'
        note: чужой объект в своём тенанте — страница организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: '{"status": "active"}'
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
        body: '{"status": "active"}'
  - op: moveKnowledgeNode
    method: POST
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/move
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:b]
        body: '{"parentId": null, "dryRun": true}'
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: page:b.rules-intro }
        status: 404
        absent: [tenant:b, page:b.rules-intro]
        body: '{"parentId": null, "dryRun": true}'
        note: чужой объект в своём тенанте — страница организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: '{"parentId": null, "dryRun": true}'
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
        body: '{"parentId": null, "dryRun": true}'
  - op: archiveKnowledgeNode
    method: POST
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/archive
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:b]
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: page:b.rules-intro }
        status: 404
        absent: [tenant:b, page:b.rules-intro]
        note: чужой объект в своём тенанте — страница организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
  - op: restoreKnowledgeNode
    method: POST
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/restore
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:b]
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: page:b.rules-intro }
        status: 404
        absent: [tenant:b, page:b.rules-intro]
        note: чужой объект в своём тенанте — страница организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
  - op: listKnowledgeArchive
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/spaces/{spaceId}/archive
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:b]
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: space:b.rules }
        status: 404
        absent: [tenant:b, space:b.rules]
        note: чужой объект в своём тенанте — пространство организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 401
  - op: ackKnowledgeNode
    method: POST
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/ack
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:b]
        body: '{"version": 1}'
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: page:b.rules-intro }
        status: 404
        absent: [tenant:b, page:b.rules-intro]
        body: '{"version": 1}'
        note: чужой объект в своём тенанте — страница организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: '{"version": 1}'
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
        body: '{"version": 1}'
  # Доступ узла
  - op: getKnowledgeNodeAccess
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/access
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:b]
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: page:b.rules-intro }
        status: 404
        absent: [tenant:b, page:b.rules-intro]
        note: чужой объект в своём тенанте — страница организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
        note: список доступа узла чужой организации — как несуществующий
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
  - op: setKnowledgeNodeAccess
    method: PUT
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/access
    rows:
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: '{"mode": "inherit", "entries": [], "dryRun": true}'
        note: сохранение доступа в чужой организации — 404 до предусловия If-Match
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
        body: '{"mode": "inherit", "entries": [], "dryRun": true}'
  - op: listKnowledgeAccessCandidates
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/access/candidates
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:b]
        note: кандидаты — люди, роли и группы только своей организации
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: page:b.rules-intro }
        status: 404
        absent: [tenant:b, page:b.rules-intro]
        note: чужой объект в своём тенанте — страница организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
  - op: getKnowledgeAccessMap
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/spaces/{spaceId}/access-map
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:b]
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: space:b.rules }
        status: 404
        absent: [tenant:b, space:b.rules]
        note: чужой объект в своём тенанте — пространство организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 401
  - op: explainKnowledgeAccess
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/explain?memberId={memberId}
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing, memberId: person:b.owner@b }
        status: 404
        absent: [tenant:b]
        note: объяснение по узлу, которого нет, — 404; человек тенанта B в ответе не раскрывается
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: page:b.rules-intro, memberId: person:b.owner@b }
        status: 404
        absent: [tenant:b, page:b.rules-intro]
        note: чужой объект в своём тенанте — страница организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing, memberId: person:b.owner@b }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing, memberId: person:b.owner@b }
        status: 401
  # Запросы доступа
  - op: createKnowledgeAccessRequest
    method: POST
    path: /api/v1/tenants/{tenantId}/knowledge/nodes/{nodeId}/requests
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:b]
        body: '{"can": "edit"}'
      - actor: a.owner
        params: { tenantId: tenant:a, nodeId: page:b.rules-intro }
        status: 404
        absent: [tenant:b, page:b.rules-intro]
        body: '{"can": "edit"}'
        note: чужой объект в своём тенанте — страница организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: '{"can": "edit"}'
      - actor: anonymous
        params: { tenantId: tenant:a, nodeId: tenant:missing }
        status: 401
        body: '{"can": "edit"}'
  - op: decideKnowledgeAccessRequest
    method: POST
    path: /api/v1/tenants/{tenantId}/knowledge/requests/{requestId}/decision
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, requestId: tenant:missing }
        status: 404
        absent: [tenant:b]
        body: '{"decision": "deny"}'
        note: запроса нет в организации — 404
      - actor: a.owner
        params: { tenantId: tenant:a, requestId: kb_request:b.ask }
        status: 404
        absent: [tenant:b, kb_request:b.ask]
        body: '{"decision": "deny"}'
        note: чужой объект в своём тенанте — запрос доступа организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, requestId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: '{"decision": "deny"}'
        note: решение по запросу чужой организации — как несуществующий
      - actor: anonymous
        params: { tenantId: tenant:a, requestId: tenant:missing }
        status: 401
        body: '{"decision": "deny"}'
  - op: listKnowledgeAccessRequests
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/spaces/{spaceId}/requests
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:b]
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: space:b.rules }
        status: 404
        absent: [tenant:b, space:b.rules]
        note: чужой объект в своём тенанте — пространство организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 401
  # Участники пространства
  - op: listKnowledgeSpaceMembers
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/spaces/{spaceId}/members
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:b]
      - actor: a.owner
        params: { tenantId: tenant:a, spaceId: space:b.rules }
        status: 404
        absent: [tenant:b, space:b.rules]
        note: чужой объект в своём тенанте — пространство организации B в пути A, как несуществующий
      - actor: b.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:a]
        note: участники пространства чужой организации — как несуществующее
      - actor: anonymous
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 401
  - op: setKnowledgeSpaceMember
    method: PUT

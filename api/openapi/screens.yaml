# Истории без своего экрана (DoR W1.00, W2.00): серверные механизмы и проверки, видимые только тестами и изоляцией.
storiesWithoutScreen:
  S1-02: Resolver «сессия → членство → состояние → TenantContext» без запасной главной БД — серверная история (W1.02); видна только через ошибки шлюза и строки изоляции.
  S1-03: Migration controller (canary → партии → остальные) — серверная история W1.02; операторского экрана миграций в эталоне нет.
  S1-11: Оценщик permit() и scopeQuery() — серверная история W1.04; в интерфейсе проявляется через AccessGate, меню и «Почему доступно».
  S1-24: Outbox worker (lease, повторы, dead-letter) — W1.01; ручной повтор — команда cmd/worker, HTTP-операции и экрана нет (бриф W1.00 §10 п. 8).
  S1-25: Idempotency middleware — заголовок Idempotency-Key всех изменяющих операций и таблицы idempotency_keys (tenant 0001, control 0005); экрана нет.
  S2-19: Матрица устройств для камеры и офлайна и ранний полевой тест (R-04) — проекты устройств Playwright и чек-лист полевого теста (W2.31); своего экрана нет, проверяются экраны водителя.

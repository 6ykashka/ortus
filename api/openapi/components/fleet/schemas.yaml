# Контракт Ортус · компоненты тега fleet. Пишет только стюард контракта (план v2 §3.5).
VehicleCapacity:
  type: object
  additionalProperties: false
  properties:
    payloadKg:
      $ref: ../common/schemas.yaml#/Quantity
    volumeM3:
      $ref: ../common/schemas.yaml#/Quantity
    cargoLengthM:
      $ref: ../common/schemas.yaml#/Quantity
    cargoWidthM:
      $ref: ../common/schemas.yaml#/Quantity
    cargoHeightM:
      $ref: ../common/schemas.yaml#/Quantity
  required:
    - payloadKg
    - volumeM3
    - cargoLengthM
    - cargoWidthM
    - cargoHeightM
Vehicle:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
    registrationNumber:
      type: string
    displayName:
      type: string
    bodyType:
      type: string
      enum:
        - van
        - box
        - flatbed
        - refrigerated
        - tent
    capacity:
      $ref: ./schemas.yaml#/VehicleCapacity
    temperatureMinC:
      $ref: ../common/schemas.yaml#/Decimal
    temperatureMaxC:
      $ref: ../common/schemas.yaml#/Decimal
    equipment:
      type: array
      items:
        type: string
        enum:
          - tail_lift
          - side_loading
          - pallet_jack
          - refrigerator
    status:
      type: string
      enum:
        - available
        - reserved
        - in_use
        - maintenance
        - blocked
    odometerKm:
      $ref: ../common/schemas.yaml#/Quantity
    revision:
      type: integer
      minimum: 1
      format: int64
    heldByTripId:
      $ref: ../common/schemas.yaml#/Id
      description: "W2.00 (0.5.0-stage2). Trip the vehicle is held for (logist assignment or driver reservation); the card chip Назначена на {trip} / Ваша бронь. Absent when the vehicle is not held."
    statusNote:
      type: string
      maxLength: 200
      description: "W2.00. Short reason shown after the status label: planned maintenance (Плановое ТО до 03.10), a confirmed defect (неисправность подтверждена), a hold for another trip (другой рейс). Derived by the server from maintenance bookings, defects and reservations; never free text from a driver."
    depot:
      type: string
      maxLength: 200
      description: W2.00. Home depot or yard of the vehicle (Склад № 1), shown in the vehicle row.
    orgUnitSince:
      $ref: ../common/schemas.yaml#/Instant
      readOnly: true
      description: "W2.52 (0.6.1-stage2, W2.42). Start of the current company assignment (fleet.vehicle_assignments.valid_from) — present after the vehicle was moved between companies (moveVehicle); absent when it stays in the company of its registration. History — listVehicleAssignments."
  required:
    - id
    - orgUnitId
    - registrationNumber
    - displayName
    - bodyType
    - capacity
    - equipment
    - status
    - odometerKm
    - revision
  description: Vehicle availability alone does not imply permission to reserve. Driver sees only own unit/pool and explicitly loaned vehicles, without earnings or manager-only internal fields.
VehicleCreate:
  type: object
  additionalProperties: false
  properties:
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
    registrationNumber:
      type: string
    displayName:
      type: string
    bodyType:
      type: string
      enum:
        - van
        - box
        - flatbed
        - refrigerated
        - tent
    capacity:
      $ref: ./schemas.yaml#/VehicleCapacity
    temperatureMinC:
      $ref: ../common/schemas.yaml#/Decimal
    temperatureMaxC:
      $ref: ../common/schemas.yaml#/Decimal
    equipment:
      type: array
      items:
        type: string
        enum:
          - tail_lift
          - side_loading
          - pallet_jack
          - refrigerator
    odometerKm:
      $ref: ../common/schemas.yaml#/Quantity
    depot:
      type: string
      maxLength: 200
      description: W2.00 (0.5.0-stage2). Home depot or yard of the vehicle.
  required:
    - orgUnitId
    - registrationNumber
    - displayName
    - bodyType
    - capacity
    - equipment
    - odometerKm
VehiclePage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/Vehicle
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
ReservationCreate:
  type: object
  additionalProperties: false
  properties:
    vehicleId:
      $ref: ../common/schemas.yaml#/Id
    driverMemberId:
      $ref: ../common/schemas.yaml#/Id
    window:
      $ref: ../common/schemas.yaml#/TimeWindow
    routeId:
      $ref: ../common/schemas.yaml#/Id
    tripId:
      $ref: ../common/schemas.yaml#/Id
      description: "W2.00 (0.5.0-stage2). Planned trip the vehicle is reserved for (driver Забронировать on the trip card). The server checks compatibility with the trip cargo (409 vehicle_incompatible with the reasons), moves the trip to inspection and links the hold to it (sched.reservations source fleet.trip). window must lie within the trip window."
  required:
    - vehicleId
    - driverMemberId
    - window
  description: Server checks visible resource pool, driver qualifications, maintenance, overlapping reservations/trips/appointments and route fit. Locks driver+vehicle atomically. Driver self-service can only reserve for their own memberId.
Reservation:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    vehicleId:
      $ref: ../common/schemas.yaml#/Id
    driverMemberId:
      $ref: ../common/schemas.yaml#/Id
    window:
      $ref: ../common/schemas.yaml#/TimeWindow
    state:
      type: string
      enum:
        - held
        - released
        - expired
        - consumed
        - confirmed
    holdExpiresAt:
      $ref: ../common/schemas.yaml#/Instant
      description: "W2.71 (0.6.3-stage2). held — the end of the hold (a hold of an offer: = chooseUntil); confirmed — the end of the window (it never expires before the trip starts)."
    routeId:
      $ref: ../common/schemas.yaml#/Id
    revision:
      type: integer
      minimum: 1
      format: int64
    tripId:
      $ref: ../common/schemas.yaml#/Id
      description: W2.00 (0.5.0-stage2). Planned trip of the hold (ReservationCreate.tripId or assignTripVehicle).
    # W2.71 (0.6.3-stage2, S2-20): брони предложения — альтернативы одного рейса, подтверждается ровно одна.
    offerGroupId:
      $ref: ../common/schemas.yaml#/Id
      description: "W2.71 (0.6.3-stage2, S2-20). The offer the reservation belongs to (sched.reservations.offer_group_id): the alternative vehicles of one trip created by the approval of a pool request (DriverTransfer.vehicle.offerGroupId) or by assignTripVehicle with alternativeVehicleId; exactly one reservation of the group becomes confirmed (tenant 0023 partial unique index), the others released."
    offeredToMemberId:
      $ref: ../common/schemas.yaml#/Id
      description: "W2.71 (0.6.3-stage2, S2-20). The driver who chooses (sched.reservations.offered_to) — the driver of the trip; fleet.reservations.choose in scope self opens only the reservations offered to the actor."
    offerKind:
      type: string
      enum:
        - host
        - usual
      description: "W2.71 (0.6.3-stage2, S2-20). host — a vehicle of the company of the trip (the logist put it, «Поставил логист»); usual — the usual vehicle of the driver from his company (DriverPoolPublication.usualVehicleId, «Ваша обычная»). Present on reservations of an offer and on the only offered vehicle of a pool request."
    chooseUntil:
      $ref: ../common/schemas.yaml#/Instant
      description: "W2.71 (0.6.3-stage2, S2-20 rule 4, TD-02). Deadline of the choice — the start of the trip window minus 30 minutes; holdExpiresAt of a held reservation of the offer equals it. Absent when there is nothing to choose (one offered vehicle)."
    chosenAt:
      $ref: ../common/schemas.yaml#/Instant
      description: W2.71 (0.6.3-stage2, S2-20). When the reservation of an offer became confirmed (chooseReservation of the driver or the logist, the scheduler at chooseUntil).
    releasedAt:
      $ref: ../common/schemas.yaml#/Instant
      description: W2.71 (0.6.3-stage2, S2-20). When the reservation was released (state released).
    releaseReason:
      type: string
      enum:
        - chosen
        - deadline
        - manager
        - transfer_ended
      description: "W2.71 (0.6.3-stage2, S2-20). Why a reservation was released: chosen — the driver chose another vehicle of the offer; deadline — chooseUntil passed without a choice (the usual vehicle returns to its company); manager — the logist of the trip kept another vehicle («Оставить …») or released it (releaseReservation, assignTripVehicle); transfer_ended — the pool transfer of the trip ended (revoked, expired, completed) before the trip started."
  required:
    - id
    - vehicleId
    - driverMemberId
    - window
    - state
    - holdExpiresAt
    - revision
  description: "held is server-confirmed and blocks overlaps only until holdExpiresAt. Trip start must consume the hold before expiry. A client offline draft is never a reservation. W2.71 (0.6.3-stage2, S2-20, Q-W2.70-1): confirmed — the vehicle chosen from an offer or the only vehicle offered to the driver (the approval of a pool request, assignTripVehicle on a trip of a temporary driver of the pool): it holds the vehicle for the trip window until the trip starts or the window ends and does not expire before (holdExpiresAt = window.endsAt); startTrip consumes held or confirmed. The reservations of an offer (offerGroupId) are held with holdExpiresAt = chooseUntil; the vehicle is occupied only for the trip window (sched.reservations.during — the window, rule 3), before it the usual vehicle works in its company."
ReservationPatch:
  type: object
  additionalProperties: false
  properties:
    action:
      type: string
      const: release
    reason:
      type: string
      maxLength: 500
  required:
    - action
ReservationPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/Reservation
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
InspectionPhoto:
  type: object
  additionalProperties: false
  properties:
    role:
      type: string
      enum:
        - front
        - rear
        - left
        - right
        - odometer
        - cargo
        - damage
    fileId:
      $ref: ../common/schemas.yaml#/Id
    capturedAt:
      $ref: ../common/schemas.yaml#/Instant
      description: W2.52 (0.6.1-stage2). Capture time claimed by the device — advisory only, never evidence (files.objects.capture_at); the evidence time is serverCapturedAt.
    serverCapturedAt:
      $ref: ../common/schemas.yaml#/Instant
      readOnly: true
      description: "W2.52 (0.6.1-stage2, антифрод фото W2.43; ответ владельца 17.10 «время съёмки фиксирует сервер»). Moment the server received and verified the photo — completeUpload of its upload session (files.upload_sessions.completed_at), frozen in fleet.inspection_photos at submitInspection. Returned in Inspection.photos; ignored in InspectionCreate."
    duplicateWarning:
      $ref: ../common/schemas.yaml#/FileDuplicateWarning
      description: W2.52 (0.6.1-stage2, W2.43). Duplicate of an earlier file of the tenant by sha256, as found at submitInspection and frozen with the photo (later uploads do not change it). Returned in Inspection.photos only; a warning for the manager, never a refusal.
  required:
    - role
    - fileId
    - capturedAt
InspectionCheck:
  type: object
  additionalProperties: false
  properties:
    key:
      type: string
    result:
      type: string
      enum:
        - pass
        - fail
        - not_applicable
    comment:
      type: string
      maxLength: 1000
  required:
    - key
    - result
InspectionCreate:
  type: object
  additionalProperties: false
  properties:
    checklistVersionId:
      $ref: ../common/schemas.yaml#/Id
    vehicleId:
      $ref: ../common/schemas.yaml#/Id
    reservationId:
      $ref: ../common/schemas.yaml#/Id
    tripId:
      $ref: ../common/schemas.yaml#/Id
    kind:
      type: string
      enum:
        - departure
        - return
    odometerKm:
      $ref: ../common/schemas.yaml#/Quantity
    fuelPercent:
      type: integer
      minimum: 0
      maximum: 100
    checks:
      type: array
      items:
        $ref: ./schemas.yaml#/InspectionCheck
      minItems: 1
    photos:
      type: array
      items:
        $ref: ./schemas.yaml#/InspectionPhoto
      minItems: 1
      maxItems: 30
    reportedDamage:
      type: string
      maxLength: 5000
    capturedAt:
      $ref: ../common/schemas.yaml#/Instant
    defects:
      type: array
      maxItems: 20
      items:
        $ref: ./schemas.yaml#/InspectionDefectReport
      description: "W2.00 (0.5.0-stage2). Structured defects marked by the driver (zone from the inspection dictionary, description, severity). A blocking defect on a departure inspection (Критический — машина не может выехать) puts the inspection to requires_review, the defect to in_review (queue fleet.defects, S2-17), the trip to defect_review and makes the vehicle unavailable until decideInspectionDefect. On a return inspection severity blocking is not accepted (422): criticality is chosen only before departure."
    comment:
      type: string
      maxLength: 1000
      description: W2.00. Driver comment for the manager (Комментарий для менеджера) on a return inspection.
  required:
    - checklistVersionId
    - vehicleId
    - kind
    - odometerKm
    - fuelPercent
    - checks
    - photos
    - capturedAt
  description: Departure requires reservationId; return requires tripId. Conditional checks are server-enforced. Photo roles come from versioned checklist. Offline capture may be uploaded as a draft; submitting inspection never authorizes departure.
Inspection:
  type: object
  additionalProperties: false
  properties:
    checklistVersionId:
      $ref: ../common/schemas.yaml#/Id
    id:
      $ref: ../common/schemas.yaml#/Id
    vehicleId:
      $ref: ../common/schemas.yaml#/Id
    memberId:
      $ref: ../common/schemas.yaml#/Id
    kind:
      type: string
      enum:
        - departure
        - return
    status:
      type: string
      enum:
        - submitted
        - requires_review
        - approved
        - rejected
    odometerKm:
      $ref: ../common/schemas.yaml#/Quantity
    fuelPercent:
      type: integer
      minimum: 0
      maximum: 100
    checks:
      type: array
      items:
        $ref: ./schemas.yaml#/InspectionCheck
    photos:
      type: array
      items:
        $ref: ./schemas.yaml#/InspectionPhoto
    capturedAt:
      $ref: ../common/schemas.yaml#/Instant
    submittedAt:
      $ref: ../common/schemas.yaml#/Instant
    revision:
      type: integer
      minimum: 1
      format: int64
    tripId:
      $ref: ../common/schemas.yaml#/Id
      description: W2.00 (0.5.0-stage2). Trip of the inspection (departure through the reservation, return directly).
    attempt:
      type: integer
      minimum: 1
      format: int64
      description: "W2.00. Attempt of this kind for the trip: a return inspection resubmitted after rework has attempt 2, 3… (Q-51); the trip refers to the latest one."
    comment:
      type: string
      maxLength: 1000
      description: W2.00. Driver comment for the manager (return inspection).
    defects:
      type: array
      items:
        $ref: ./schemas.yaml#/InspectionDefect
      description: W2.00. Defects recorded with this inspection and their current review state.
  required:
    - checklistVersionId
    - id
    - vehicleId
    - memberId
    - kind
    - status
    - odometerKm
    - fuelPercent
    - checks
    - photos
    - capturedAt
    - submittedAt
    - revision
InspectionPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/Inspection
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:

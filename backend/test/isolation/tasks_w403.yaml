# Матрица изоляции: «Задачи и проекты» контракта 0.10.0-stage4 (W4.03, контрактный PR 2 этапа 4; хендлеры — W4.11).
# Проекты, задачи, правила и вложения — в области tasks.* (проект — по уровню доступа, TP-03; задача исполнителя —
# область self); чужая организация — 404 (AC-02), без сессии — 401. Содержимое фикстур (W4.11, content_tasks.go): в
# обеих организациях «Автопарк» (project:<t>.fleet) — ограниченный проект Москвы-1 с задачами fleet-1 (исполнитель —
# водитель, область self), fleet-2 (на согласовании) и правилом fleet-rule; «Стройка» (project:<t>.build) — закрытый
# проект, ролей в нём нет ни у кого, задача build-1 у водителя. Ключ перехода и пункт чек-листа — не UUID: в пути —
# литералы t3 и ch-1.
# Изоляция между проектами (W4.03 возврат 1): роль руководителя «Автопарка» (a.project-lead) в «Стройке» не даёт
# ничего — 404, как несуществующий; TP-03 — «Стройка» без роли владельца в ней — 404 и владельцу. «Согласующий»
# (a.project-approver) проходит шлюз transitionTask по tasks.approve. Чужой id в пути и в теле (W4.03 integratorNotes
# п. 3) — 404 и владельцу; чужой id в теле, который контракт отклоняет как 422 (родитель setTaskParent, файл
# attachTaskFiles, сотрудник действия правила), формат строк не выражает — их проверяют integration-тесты модуля.
# Команды с If-Match строки не передают If-Match (README, «Цель набора»): без него строгий сервер отвечает 428 раньше
# хендлера, поэтому здесь у них только отказы шлюза — без сессии 401, чужая организация 404; строки акторов, которых
# шлюз пропускает, — tasks_w411_ifmatch_test.go (If-Match, который не совпадает ни с одной ревизией). Отказы шлюза
# (403) — tasks_w403_gate.yaml. Формат — README.md.
# После правки: go -C backend generate ./test/isolation
module: tasks_w403
endpoints:
  - op: listTaskProjects
    method: GET
    path: /api/v1/tenants/{tenantId}/projects
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        present: [project:a.fleet]
        absent: [tenant:b, project:a.build]
        note: список своей организации; «Стройка» закрыта и владельцу (TP-03), объектов тенанта B нет
      - actor: a.project-lead
        params: { tenantId: tenant:a }
        status: 200
        present: [project:a.fleet]
        absent: [tenant:b, project:a.build]
        note: руководитель «Автопарка» видит только свой проект
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        note: чужая организация — как несуществующая (AC-02)
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401

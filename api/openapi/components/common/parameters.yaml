datasetId:
  name: datasetId
  in: path
  required: true
  description: Authorized logical dataset key, not a SQL table.
  schema:
    type: string
    pattern: ^[a-z][a-z0-9_.-]{1,99}$
publicToken:
  name: publicToken
  in: path
  required: true
  description: Unpredictable revocable public-form capability; avoid logs and referrer leakage.
  schema:
    type: string
    minLength: 32
    maxLength: 256
Cursor:
  name: cursor
  in: query
  required: false
  description: Opaque cursor from the preceding response; no offset pagination.
  schema:
    type: string
    maxLength: 2048
Limit:
  name: limit
  in: query
  required: false
  description: ""
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 50
OrgUnitFilter:
  name: orgUnitId
  in: query
  required: false
  description: Optional narrower scope, never an expansion beyond actor grants.
  schema:
    $ref: ./schemas.yaml#/Id
IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: Stable per intended command. Retain record at least 7 days; financial deduplication also retains a durable tenant+actor+operation+key digest receipt. Key is scoped to tenant+actor+operation. Reuse only for an identical request.
  schema:
    type: string
    minLength: 16
    maxLength: 128
    pattern: ^[A-Za-z0-9._:-]+$
IfMatch:
  name: If-Match
  in: header
  required: true
  description: Strong ETag obtained from latest GET or mutation response. * is not accepted. Missing=428; stale=412. Idempotent replay is checked before current revision precondition.
  schema:
    type: string
    pattern: ^"[^"\s]+"$
    examples:
      - '"rev-7"'
Csrf:
  name: X-CSRF-Token
  in: header
  required: false
  description: Required for cookie-authenticated state changes; not required with bearer-only authentication. Invalid/missing token or Origin yields 403. Conditional requirement cannot be represented by OpenAPI required=true.
  schema:
    type: string
    minLength: 16
    maxLength: 256
Origin:
  name: Origin
  in: header
  required: false
  description: Required and checked against the deployment allowlist for cookie-authenticated state changes and browser public-form submissions/uploads. Never accept wildcard with credentialed requests.
  schema:
    type: string
    format: uri
# W2.52 (0.6.1-stage2): история машины (W2.42) и справочник категорий расходов (W2.41).
vehicleId:
  name: vehicleId
  in: path
  required: true
  description: W2.52 (0.6.1-stage2). Opaque UUID of a fleet.vehicles row; same-tenant and visibility checks are mandatory (a vehicle outside the scope of the actor — 404, as a missing one).
  schema:
    $ref: ./schemas.yaml#/Id
categoryCode:
  name: categoryCode
  in: path
  required: true
  description: W2.52 (0.6.1-stage2). ExpenseCategory.code — the stable code of a tenant expense category (fuel, wash, parking, toll, tire_service, other or a code of a category created by the owner); TripExpense.kind carries the same value.
  schema:
    type: string
    pattern: ^[a-z][a-z0-9_]{1,49}$
    maxLength: 50
# W4.06 (0.7.0-stage4): сохранённый вид набора и задание выгрузки «Данных» (W4.50).
viewId:
  name: viewId
  in: path
  required: true
  description: W4.06 (0.7.0-stage4). Opaque UUID of a saved view of the dataset; a view the member may not see — 404.
  schema:
    $ref: ./schemas.yaml#/Id
exportJobId:
  name: exportJobId
  in: path
  required: true
  description: W4.06 (0.7.0-stage4). Opaque UUID of an export job; a job of another member — 404 (the owner of the organization reads the journal, never the file).
  schema:
    $ref: ./schemas.yaml#/Id

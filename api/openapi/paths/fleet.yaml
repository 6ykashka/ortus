# Контракт Ортус · тег Fleet: пути и операции. Пишет только стюард контракта (план v2 §3.5).
/api/v1/tenants/{tenantId}/fleet/vehicles:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listVehicles
    tags:
      - Fleet
    summary: List scoped vehicles, optionally free for an interval
    x-permissions:
      - fleet.vehicles.read
    x-scope: tenant-org-unit-resource-pool
    description: Supply both availability bounds or neither. Filter evaluates current holds, trips, maintenance and scope. An availability list is advisory; POST reservation is authoritative. Cross-company borrowing needs an approved transfer/pool grant.
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/fleet/schemas.yaml#/VehiclePage
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Cursor
      - $ref: ../components/common/parameters.yaml#/Limit
      - $ref: ../components/common/parameters.yaml#/OrgUnitFilter
      - name: availableFrom
        in: query
        required: false
        description: ""
        schema:
          $ref: ../components/common/schemas.yaml#/Instant
      - name: availableUntil
        in: query
        required: false
        description: ""
        schema:
          $ref: ../components/common/schemas.yaml#/Instant
      - name: bodyType
        in: query
        required: false
        description: ""
        schema:
          type: string
          enum:
            - van
            - box
            - flatbed
            - refrigerated
            - tent
      - name: minPayloadKg
        in: query
        required: false
        description: ""
        schema:
          $ref: ../components/common/schemas.yaml#/Quantity
    x-permissions-mode: all
  post:
    operationId: createVehicle
    tags:
      - Fleet
    summary: Register a vehicle and capacity/equipment
    x-permissions:
      - fleet.vehicles.manage
    x-scope: tenant-or-org-unit
    description: Register a vehicle and capacity/equipment
    responses:
      "201":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/fleet/schemas.yaml#/Vehicle
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "402":
        $ref: ../components/common/responses.yaml#/PlanRequired
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/fleet/schemas.yaml#/VehicleCreate
    x-permissions-mode: all

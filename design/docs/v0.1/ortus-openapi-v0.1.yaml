          boolean: '#/components/schemas/BooleanValue'
          date: '#/components/schemas/DateValue'
          instant: '#/components/schemas/InstantValue'
          reference: '#/components/schemas/ReferenceValue'
          money: '#/components/schemas/MoneyValue'

        status: 404
        absent: [tenant:b]
        note: пространства нет в организации — 404 и владельцу
      - actor: b.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:a]
        note: дерево чужой организации по id — как несуществующее
      - actor: anonymous
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 401
  - op: searchKnowledge
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/search?q=rules

          type: string
          enum:
          - count
          - sum
          - avg
          - min
          - max
        fieldKey:
          type: string
        alias:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,49}$
      required:
      - function
      - alias
    DatasetQuery:
      type: object
      additionalProperties: false
      properties:
        select:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
        filters:
          type: array
          items:
            $ref: '#/components/schemas/QueryFilter'
          maxItems: 50
        sort:
          type: array
          items:
            $ref: '#/components/schemas/QuerySort'
          maxItems: 5
        groupBy:
          type: array
          items:
            type: string
          maxItems: 5
        aggregates:
          type: array
          items:
            $ref: '#/components/schemas/QueryAggregate'
          maxItems: 20
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        cursor:
          type: string
          maxLength: 2048
      required:
      - select
      - filters
      - sort
      - limit
      description: Only AND filters in v0.1. No SQL, joins, arbitrary expressions, executable formulas or unbounded
        scans. Scope predicates are injected server-side before grouping. Hidden fields cannot appear in select/filter/sort/group/aggregate.
        select fields in aggregate mode must belong to groupBy; aggregate aliases are returned as field keys.

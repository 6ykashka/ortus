        - invalid_transition
        - separation_of_duties_conflict
        - delegation_exceeds_grant
        - last_owner_required
        - quota_exceeded
        - downgrade_below_usage
        - idempotency_key_reused
        - idempotency_in_progress
        - estimate_version_locked
        - estimate_draft_exists
        - change_order_closed

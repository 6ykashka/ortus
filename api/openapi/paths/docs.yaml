# Контракт Ортус · тег Docs: пути и операции. Пишет только стюард контракта (план v2 §3.5).
/api/v1/tenants/{tenantId}/docs:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listDocuments
    tags:
      - Docs
    summary: List documents visible to the member
    x-permissions:
      - docs.read
    x-scope: docs-folder-doc
    description: W7.00 (documents.md §2.2). Documents the access chain opens; a finance document is closed for the function «Водитель» always. «Ждут меня» — items with my.wait. 403 module_not_installed when the module is off.
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/docs/schemas.yaml#/DocumentList
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Cursor
      - $ref: ../components/common/parameters.yaml#/Limit
      - name: q
        in: query
        required: false
        description: Search in titles and in the text layer of scans (full-text index, Q-W4.00-documents-1).
        schema:
          type: string
          maxLength: 100
      - name: folderId
        in: query
        required: false
        description: Only the documents of this folder and its subfolders.
        schema:
          type: string
          format: uuid
      - name: filter
        in: query
        required: false
        description: Filter of the list (docsView); archive — Q-W4.00-documents-9.
        schema:
          type: string
          enum:
            - all
            - mine
            - shared
            - route
            - archive
    x-permissions-mode: all
  post:
    operationId: createDocument
    tags:
      - Docs
    summary: Create a document
    x-permissions:
      - docs.create
    x-scope: docs-folder-doc
    description: W7.00 (documents.md §2.2) (docCreate). Version 1; a scan queues the OCR job (not for pdn). 422 validation_failed, 403 forbidden_action (level 4 in the folder), 409 quota_exceeded (storage), 413 payload too large. The number of the document by the kind and the legal entity — core.counters, a later WS (DOC-12, Q-W4.00-documents-7). Emits docs.created.v1.
    responses:
      "201":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/docs/schemas.yaml#/Document
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "413":
        $ref: ../components/common/responses.yaml#/TooLarge
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/docs/schemas.yaml#/DocCreate
    x-permissions-mode: all

# операции (tenant-org-unit-repair-project: tenant, unit, repair_project, relation), но раньше проверяет, что модуль
# подключён. W6.11: модуль подключён у организации A (только WithInTenant, fixtures/content_repairs.go) и не подключён у B —
# у B владелец получает 403 module_not_installed (modules_gate.yaml), у A менеджер логистики без repairs.* — 403
# forbidden_action. Положительные строки хендлеров — repairs_w600.yaml. Команды с If-Match получают 403 шлюза раньше
# предусловия. Формат — README.md.

        serviceId:
          $ref: "#/components/schemas/Id"
        clientId:
          $ref: "#/components/schemas/Id"
        practitionerMemberId:
          $ref: "#/components/schemas/Id"
        roomId:
          $ref: "#/components/schemas/Id"
        equipmentIds:

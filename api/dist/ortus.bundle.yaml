          type: string
          enum:
            - ml
            - g
            - piece
      required:
        - itemId
        - quantity
        - unit
      description: "Item base unit must match or have an explicit conversion. Example: massage oil 25 ml per completed treatment."
    CsrfToken:
      type: object
      additionalProperties: false
      properties:
        csrfToken:
          type: string
          minLength: 16
          maxLength: 256
          description: Synchronizer token of the current session; send unchanged as X-CSRF-Token.
        headerName:
          type: string
          const: X-CSRF-Token
        expiresAt:
          $ref: "#/components/schemas/Instant"
      required:
        - csrfToken
        - headerName
        - expiresAt
      description: Valid until the session ends or expiresAt; never stored in localStorage or URLs.
    Dataset:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        moduleKey:
          type: string
        name:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDescriptor"
        allowedAggregations:
          type: array
          items:
            type: string
            enum:
              - count
              - sum
              - avg
              - min
              - max
        permissionVersion:
          type: string
      required:
        - id
        - moduleKey
        - name
        - fields
        - allowedAggregations
        - permissionVersion
      description: Dataset and field catalog is filtered before response. fleet.earnings is absent from driver catalog. SQL table names and storage keys are never exposed.
    DatasetCatalog:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dataset"
      required:
        - items
    DatasetQuery:
      type: object
      additionalProperties: false
      properties:
        select:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
        filters:
          type: array
          items:
            $ref: "#/components/schemas/QueryFilter"
          maxItems: 50
        sort:
          type: array
          items:
            $ref: "#/components/schemas/QuerySort"
          maxItems: 5
        groupBy:
          type: array
          items:
            type: string
          maxItems: 5
        aggregates:
          type: array
          items:
            $ref: "#/components/schemas/QueryAggregate"
          maxItems: 20
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        cursor:
          type: string
          maxLength: 2048
      required:
        - select
        - filters
        - sort
        - limit
      description: Only AND filters in v0.1. No SQL, joins, arbitrary expressions, executable formulas or unbounded scans. Scope predicates are injected server-side before grouping. Hidden fields cannot appear in select/filter/sort/group/aggregate. select fields in aggregate mode must belong to groupBy; aggregate aliases are returned as field keys.
    DatasetQueryResult:
      type: object
      additionalProperties: false
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRow"
        nextCursor:
          type:
            - string
            - "null"
        schemaVersion:
          type: string
      required:
        - rows
        - nextCursor
        - schemaVersion
      description: No unrestricted total count; aggregation is computed only over visible scoped rows. Personal data export is a separate permission/async contract.
    DatasetRow:
      type: object
      additionalProperties: false
      properties:
        recordId:
          type: string
        cells:
          type: array
          items:
            $ref: "#/components/schemas/FieldEntry"
      required:
        - recordId
        - cells
    DateValue:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: date
        value:
          type: string
          format: date
      required:
        - type
        - value
    Decimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
      examples:
        - "12.500"
      description: Exact decimal. Never a binary floating point number.
      maxLength: 40
    DecimalValue:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: decimal
        value:
          $ref: "#/components/schemas/Decimal"
      required:
        - type
        - value
    DecisionItem:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable key of the card within the queue (<kind>:<object id>); the same situation keeps its key between reads.
        kind:
          type: string
          pattern: ^[a-z][a-z0-9]*(\.[a-z][a-z0-9_]*)+$
          maxLength: 100
          description: "Source and situation, <module>.<event>. Stage 2 sources: fleet.blocking_defect, fleet.trip_review, fleet.trip_without_driver (logistics); tenant.trial_ended, tenant.trial_ending, tenant.storage_high, access.members_without_role (organization, owner only). Sources of later stages add kinds additively; a client shows an unknown kind as a neutral card without action."
        moduleKey:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,49}$
          description: Module of the source (fleet, billing, members); a disabled module contributes no cards.
        tone:
          type: string
          enum:
            - danger
            - warn
            - info
            - neutral
        object:
          $ref: "#/components/schemas/ObjectRef"
        params:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 500
          description: Values for the card text composed by the client dictionary (tripNumber, zone, description, driverName, startsAt, daysLeft, percent…). Never contains data the member may not read in the source module.
        occurredAt:
          $ref: "#/components/schemas/Instant"
      required:
        - key
        - kind
        - moduleKey
        - tone
        - params
    DecisionQueue:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: "#/components/schemas/Id"
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/DecisionItem"
        total:
          type: integer
          minimum: 0
          format: int64
          description: Number of cards before the limit (показано 8 из N).
        generatedAt:
          $ref: "#/components/schemas/Instant"
      required:
        - tenantId
        - items
        - total
        - generatedAt
      description: Cards ordered by tone (danger → warn → info → neutral), then by the source registration order (logistics → organization → later modules), as homeVM of the prototype.
    DefectDecision:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
            - allow_departure
            - confirm_out_of_service
          description: allow_departure — Дефект некритичный — разрешить выезд; confirm_out_of_service — Подтвердить неисправность.
        comment:
          type: string
          maxLength: 2000
      required:
        - decision
    DownloadTicket:
      type: object
      additionalProperties: false
      properties:
        fileId:
          $ref: "#/components/schemas/Id"
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          $ref: "#/components/schemas/Instant"
      required:
        - fileId
        - downloadUrl
        - expiresAt
      description: Short-lived URL only after current object+field permission and ready state checks. Private-by-default storage; direct object keys never form part of this API.
    DriverAvailability:
      type: object
      additionalProperties: false
      properties:
        driverMemberId:
          $ref: "#/components/schemas/Id"
        displayName:
          type: string
        homeOrgUnitId:
          $ref: "#/components/schemas/Id"
        qualifications:
          type: array
          items:
            type: string
        freeWindow:
          $ref: "#/components/schemas/TimeWindow"
        terms:
          type: string
          maxLength: 500
          description: W2.00 (0.5.0-stage2). Terms published by the owning company (По соглашению фирм группы).
      required:
        - driverMemberId
        - displayName
        - homeOrgUnitId
        - qualifications
        - freeWindow
      description: Only explicitly published exchange-pool participants. No contacts, earnings, historical trips or staff dossier. Free status is advisory; transfer approval rechecks scheduling.
    DriverAvailabilityPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DriverAvailability"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 2048
      required:
        - items
        - nextCursor
      description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
    DriverTransfer:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        driverMemberId:
          $ref: "#/components/schemas/Id"
        sourceOrgUnitId:
          $ref: "#/components/schemas/Id"
        targetOrgUnitId:
          $ref: "#/components/schemas/Id"
        window:

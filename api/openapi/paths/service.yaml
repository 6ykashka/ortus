/api/v1/tenants/{tenantId}/service/requests:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listServiceRequests
    tags:
      - Service
    summary: List requests of a queue
    x-permissions:
      - service.requests.read
    x-scope: service-direction
    description: "W7.00 (service.md §2.3). The queue of the visible directions ordered by the main term, then by age; the phone is a mask; a request with about = me is not listed (PD-53 leak of the prototype is closed: every command is checked with the direction)."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/service/schemas.yaml#/ServiceRequestList
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Cursor
      - $ref: ../components/common/parameters.yaml#/Limit
      - name: directionId
        in: query
        required: false
        description: One direction; absent — all visible.
        schema:
          type: string
          format: uuid
      - name: queue
        in: query
        required: false
        description: Queue; an unknown one — as open.
        schema:
          type: string
          enum:
            - open
            - noreply
            - mine
            - risk
            - late
            - wait
            - low
            - done
      - name: kind
        in: query
        required: false
        description: Kind.
        schema:
          type: string
          enum:
            - complaint
            - claim
            - question
            - idea
            - thanks
            - warranty
            - cargo
      - name: channel
        in: query
        required: false
        description: Channel.
        schema:
          type: string
          enum:
            - sms
            - bot
            - cabinet
            - widget
            - phone
            - qr
      - name: q
        in: query
        required: false
        description: "Search: key, title, client name, company, old keys. Not by the phone in the first version (Q-W4.00-service-14)."
        schema:
          type: string
          maxLength: 100
    x-permissions-mode: all
  post:
    operationId: createServiceRequest
    tags:
      - Service
    summary: Create a request by a call
    x-permissions:
      - service.requests.create
    x-scope: service-direction
    description: W7.00 (service.md §2.3) (svcCreate). Channel phone, status work, the assignee is the author, the priority by the type (complaint and claim — high). The record «Заведено по звонку», the client message and the timers are created. 422 validation_failed — «Выберите направление», «Выберите тип обращения», «Укажите имя клиента», «Телефон — не меньше 10 цифр», «Опишите, что случилось». Emits service.request.created.v1.
    responses:
      "201":
        description: Successful result.

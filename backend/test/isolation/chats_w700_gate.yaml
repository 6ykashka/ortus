# Матрица изоляции: тег Chats («Чаты») контрактного PR этапа 7 (W7.00, 0.12.0-stage7) — отказы шлюза без pending.
# «Администратор» фикстур не имеет ни одного действия chat.*, docs.*, service.*: шлюз cmd/api отвечает 403 forbidden_action
# до хендлера (нет гранта с действием x-permissions в виде области x-scope), и это верно после него. Формат — README.md.
# После правки: go -C backend generate ./test/isolation
module: chats_w700_gate
endpoints:
  - op: listChats
    method: GET
    path: /api/v1/tenants/{tenantId}/chats
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        note: нет chat.read
  - op: createChat
    method: POST
    path: /api/v1/tenants/{tenantId}/chats
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        body: "{}"
        note: нет chat.create
  - op: createDirectChat
    method: POST
    path: /api/v1/tenants/{tenantId}/chats/direct
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        body: "{}"
        note: нет chat.direct
  - op: getChat
    method: GET
    path: /api/v1/tenants/{tenantId}/chats/{chatId}
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a, chatId: tenant:missing }
        status: 403
        code: forbidden_action
        note: нет chat.read
  - op: updateChat
    method: PATCH
    path: /api/v1/tenants/{tenantId}/chats/{chatId}
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a, chatId: tenant:missing }
        status: 403
        code: forbidden_action
        body: "{}"
        note: нет chat.settings.manage

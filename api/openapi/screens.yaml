# Экран → операции контракта (план v2 §3.4: ведёт стюард контракта этапа; W0.07 — заготовка, W0.08 — этап 1).
# Ключ — kebab-case ключ экрана; title — подпись пункта меню или диалога прототипа 14.10;
# stage — этап плана; ws — WS страницы (карточки §4); stories — истории бэклога 13, которые экран закрывает;
# reference — эталон снимка `design-stage-1` («design-stage-1 · <файл> · <фрагмент> (<анализ>)») или
# «no-reference …» (экрана нет в прототипе, B-6, docs/plan/v2/design-requests.md); operations — operationId,
# которые экран вызывает в режиме stand. DoR этапа 1 (W1.00): каждая история S1-01…S1-30 стоит на экране
# или в storiesWithoutScreen с причиной; DoR этапа 2 (W2.00) — то же для S2-01…S2-19 (эталон design-stage-2 = design-stage-1).
# Этап 4 (W4.02, контрактный PR 1): ключи экранов из DoR W4.00 (docs/plan/v2/analysis/dor/tasks.md §1.1,
# knowledge.md §6.1, forms.md §6), эталон — снимок 19.10 («design-2026-10-19 · …», тег design-2026-10-19) обязателен;
# историй бэклога у этапа 4 нет. Операции новых модулей добавляют контрактные PR tasks, knowledge, forms (README
# «Порядок контрактных PR этапа 4», п. 2–4) — пока у экрана только операции, которые уже есть в контракте.
# Проверка: node tools/gen/contract.mjs --check, tools/gen/stage1b.test.mjs, tools/gen/stage2.test.mjs,
# tools/gen/stage4-w402.test.mjs.
version: 1
screens:
  shell:
    title: Оболочка (шапка, меню, баннеры, AccessGate)
    stage: 1
    ws: W1.20
    stories: [S1-15, S1-19, S1-27, S1-28, S1-29, S1-30]
    reference: design-stage-1 · Ортус CRM.dc.html · шапка, меню, баннеры, AccessGate, нижняя навигация (01-shell §9–12)
    operations:
      - getMyContext
      - getCsrfToken
      - selectTenant
      - getMyNotificationSummary
      - logout
      - createRealtimeTicket
    note: >-
      Баннеры «Пробный период завершён» и «Место организации заполнено» — TenantContext.tenantState (W1.00);
      отзыв прав ≤ 5 с и счётчик входящих — подсказки канала реального времени (ADR-0015, PD-58): клиент
      перечитывает getMyContext и getMyNotificationSummary. Состояние «сессия истекла» — no-reference (B-6).


        - roomId
        - equipmentIds
        - startsAt
        - timeZone
      description: Loads the current service duration/buffers/recipe server-side; reserves practitioner+room+equipment atomically and snapshots service/recipe/price versions. Practitioner may only book own calendar if self-scoped permission allows it.

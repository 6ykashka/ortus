/api/v1/tenants/{tenantId}/fleet/defects/{defectId}/decision:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
    - $ref: ../components/common/parameters.yaml#/defectId
  post:
    operationId: decideInspectionDefect
    tags:
      - Fleet
    summary: Allow departure or confirm a blocking defect
    x-permissions:
      - fleet.inspections.review
    x-scope: responsible-manager-or-owner
    description: "W2.00 (0.5.0-stage2, S2-17, D-29 комплекта; prototype decideDefect). Decision of the responsible manager or owner on a blocking defect in_review; requires If-Match with the defect ETag. allow_departure (Дефект некритичный — разрешить выезд): the defect becomes resolved (shown as признан некритичным), the departure inspection approved, the trip returns to inspection and the driver starts it with the usual startTrip; the vehicle is held for the trip again. confirm_out_of_service (Подтвердить неисправность): the defect becomes confirmed_out_of_service, the vehicle stays unavailable (statusNote неисправность подтверждена), the hold is released and the trip returns to planned without a vehicle. A defect that is not in_review (already decided by someone else) — 409 invalid_transition. The driver receives an inbox notification. Until step 4.1 the queue replaces the manager task of the prototype (W4.24 turns it into a task). Writes an audit row and fleet.defect.decided.v1."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/fleet/schemas.yaml#/InspectionDefect
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "402":
        $ref: ../components/common/responses.yaml#/PlanRequired
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "412":
        $ref: ../components/common/responses.yaml#/PreconditionFailed
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
      - $ref: ../components/common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/fleet/schemas.yaml#/DefectDecision
    x-permissions-mode: all
# W2.51 (0.6.0-stage2, S2-14, AUTH-06/07): публикация водителя в межфирменный пул фирмой-источником.
/api/v1/tenants/{tenantId}/fleet/driver-pool/publications:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listDriverPoolPublications
    tags:
      - Fleet
    summary: List pool publications of the companies of the actor
    x-permissions:
      - fleet.driver_transfers.read
    x-scope: source-manager-or-owner
    description: "W2.51 (0.6.0-stage2, S2-14). Publications of the home companies where the actor reads pool requests (fleet.driver_transfers.read on homeOrgUnitId) or of the whole tenant for the owner, filtered by scope before pagination; order — freeWindow.startsAt descending, then id. A publication whose window is over is returned as expired."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/fleet/schemas.yaml#/DriverPoolPublicationPage
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Cursor
      - $ref: ../components/common/parameters.yaml#/Limit
      - name: state
        in: query
        required: false
        description: Only publications in this state; without it — all.
        schema:
          type: string
          enum:
            - active
            - withdrawn
            - expired
      - name: homeOrgUnitId
        in: query
        required: false
        description: Only publications of this home company (within the scope of the actor).
        schema:
          $ref: ../components/common/schemas.yaml#/Id
    x-permissions-mode: all
  post:
    operationId: publishDriverToPool
    tags:
      - Fleet
    summary: Publish a free driver of the home company to the inter-unit pool
    x-permissions:
      - fleet.driver_transfers.approve
    x-scope: source-manager-or-owner
    description: "W2.51 (0.6.0-stage2, S2-14, AUTH-06). The releasing manager of the home company (fleet.driver_transfers.approve on homeOrgUnitId) or the owner publishes an active member of that company with the driver function for a bounded free window. The server assigns the pseudonymous pool label (Водитель #N); other companies see only DriverAvailability. Order of checks, as createTripPlan (AC-01): an actor with no fleet.driver_transfers.approve in any company — 403 forbidden_action; an unknown homeOrgUnitId and a company the actor cannot see (org_units.read) get the same 422 validation_failed (field homeOrgUnitId, code unknown, detail «Подразделение не найдено.») — the answer never reveals which companies exist; a visible company without the right — 403 forbidden_action. An unknown member, a member outside homeOrgUnitId, an inactive member or a member without the driver function get the same 422 validation_failed (field driverMemberId, same detail) — the answer never reveals members of other companies; a window not in the future — 422 validation_failed (field freeWindow); a window overlapping another publication of the driver that is not withdrawn (active or expired) or a trip of the driver — 409 resources_unavailable (canonical code of driver_unavailable 0.1). Writes an audit row and fleet.pool.published.v1. W2.71 (0.6.3-stage2, S2-20 rule 1, TD-01): usualVehicleId — the usual vehicle of the driver, an active vehicle of homeOrgUnitId visible to the actor; an unknown, invisible, archived vehicle or a vehicle of another company — the same 422 validation_failed (field usualVehicleId, code vehicle), checked after the driver."
    responses:
      "201":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/fleet/schemas.yaml#/DriverPoolPublication
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "402":
        $ref: ../components/common/responses.yaml#/PlanRequired
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/fleet/schemas.yaml#/DriverPoolPublicationCreate
    x-permissions-mode: all

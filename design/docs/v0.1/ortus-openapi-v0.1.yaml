          type: string
          enum:
          - eq
          - ne
          - lt
          - lte
          - gt
          - gte
          - in
          - contains
          - is_null
        values:
          type: array
          items:
            $ref: '#/components/schemas/FieldValue'
          maxItems: 100
      required:

# Контракт Ортус · компоненты тегов docs и publicdocs (W7.00). Пишет только стюард контракта (план v2 §3.5).
DocMemberRef:
  type: object
  additionalProperties: false
  properties:
    memberId:
      $ref: ../common/schemas.yaml#/Id
    displayName:
      type: string
      maxLength: 200
  required:
    - memberId
    - displayName
  description: Member of the organization shown by name.
DocLink:
  type: object
  additionalProperties: false
  properties:
    object:
      $ref: ../common/schemas.yaml#/ObjectRef
    label:
      type: string
      maxLength: 200
  required:
    - object
  description: Link of a document with a record (object, trip, set, supply, client, vehicle, task); a reference never grants access.
DocShareEntry:
  type: object
  additionalProperties: false
  properties:
    who:
      type: string
      enum:
        - all
        - member
        - group
        - role
        - relation
      description: all — everybody of the area; member; group; role (role in the area); relation (foreman of the object — the only relation of the first version).
    refId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Id
        - type: "null"
    orgUnitId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Id
        - type: "null"
    object:
      oneOf:
        - $ref: ../common/schemas.yaml#/ObjectRef
        - type: "null"
    level:
      type: string
      enum:
        - view
        - comment
        - suggest
        - edit
        - manage
    until:
      type:
        - string
        - "null"
      format: date
    label:
      type: string
      maxLength: 200
      description: Display name of the target.
    byDisplayName:
      type: string
      maxLength: 200
    at:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - who
    - level
  description: Entry of the access list of a folder or a document (docs/24 share).
DocChainStep:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum:
        - ok
        - "no"
        - wait
        - up
        - inh
      description: ok — grants, no — denies, wait — after login, up — raises, inh — inherited.
    title:
      type: string
      maxLength: 200
    detail:
      type: string
      maxLength: 500
  required:
    - kind
    - title
    - detail
  description: "A step of the chain «Откуда доступ» (docAccess.chain): folder, document, role, relation, function «Водитель», invitation, block."
DocWait:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum:
        - approve
        - sign
        - ack
        - returned
        - mention
        - ocr
      description: "What waits for the member (docWaits): approve, sign, ack, returned, mention, ocr."
    due:
      type: string
      format: date
    by:
      type: string
      maxLength: 200
    comment:
      type: string
      maxLength: 1000
    commentId:
      $ref: ../common/schemas.yaml#/Id
    count:
      type: integer
      minimum: 0
      format: int64
  required:
    - kind
  description: Waiting item of «Ждут меня» and of the «Требует решения» queue.
DocCan:
  type: object
  additionalProperties: false
  properties:
    view:
      type: boolean
    comment:
      type: boolean
    suggest:
      type: boolean
    edit:
      type: boolean
    share:
      type: boolean
    shareExternal:
      type: boolean
    export:
      type: boolean
    convert:
      type: boolean
    sign:
      type: boolean
    route:
      type: boolean
    manage:
      type: boolean
    locked:
      type: boolean
      description: "Closed for editing (on a route or signed): edit is false."
  required:
    - view
    - comment
    - suggest
    - edit
    - share
    - shareExternal
    - export
    - convert
    - sign
    - route
    - manage
    - locked
  description: What the member may do with the document (docRights). Computed by the server; the client never recomputes it.
DocMy:
  type: object
  additionalProperties: false
  properties:
    level:
      type:
        - string
        - "null"
      enum:
        - view
        - comment
        - suggest
        - edit
        - manage
        - null
    can:
      $ref: ./schemas.yaml#/DocCan
    maxGrant:
      type:
        - string
        - "null"
      enum:
        - view
        - comment
        - suggest
        - edit
        - manage
        - null
      description: "The highest level the member may give: min(own level, edit)."
    wait:
      type: array
      items:
        $ref: ./schemas.yaml#/DocWait
      maxItems: 10
    chain:
      type: array
      items:
        $ref: ./schemas.yaml#/DocChainStep
      maxItems: 12
    onlyVersion:
      type:
        - integer
        - "null"
      minimum: 1
      format: int64
      description: "A temporary access of a route (acknowledgement) is limited to this version: no comments, suggestions, journal or access list."
  required:
    - level
    - can
    - maxGrant
    - wait
  description: The member’s view of the document; chain only in getDocument.
DocRouteBrief:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - active
        - returned
        - done
        - cancelled
    currentStep:
      type: integer
      minimum: 0
      format: int64
    stepName:
      type:
        - string
        - "null"
      maxLength: 200
    dueDate:
      type:
        - string
        - "null"
      format: date
  required:
    - status
    - currentStep
    - stepName
  description: Route status for the list and the card header.
DocOcr:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - none
        - queued
        - running
        - done
        - failed
    confidence:
      type: number
    at:
      $ref: ../common/schemas.yaml#/Instant
    lang:
      type: string
      maxLength: 20
    doubtful:
      type: integer
      minimum: 0
      format: int64
  required:
    - status
    - doubtful
  description: State of the text layer of a scan (documents.md §1.6). Scans marked pdn are not recognized (DOC-07, Q-W4.00-documents-16).
DocSummary:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    kind:
      type: string
      enum:
        - text
        - sheet
        - pdf
    title:
      type: string
      maxLength: 200
    folderId:
      $ref: ../common/schemas.yaml#/Id
    folderName:
      type: string
      maxLength: 200
    owner:
      $ref: ./schemas.yaml#/DocMemberRef
    status:
      type: string
      enum:
        - draft
        - in_route
        - returned
        - agreed
        - approved
        - signed
        - archived
    sensitivity:
      type: string
      enum:
        - normal
        - finance
        - pdn
    version:
      type: integer
      minimum: 1
      format: int64
    updatedAt:
      $ref: ../common/schemas.yaml#/Instant
    updatedBy:
      oneOf:
        - $ref: ./schemas.yaml#/DocMemberRef
        - type: "null"
    links:
      type: array
      items:
        $ref: ./schemas.yaml#/DocLink
      maxItems: 20
    my:
      $ref: ./schemas.yaml#/DocMy
    route:
      oneOf:
        - $ref: ./schemas.yaml#/DocRouteBrief
        - type: "null"
    ocr:
      oneOf:
        - $ref: ./schemas.yaml#/DocOcr
        - type: "null"
    pdfaCopy:
      type: boolean
  required:
    - id
    - kind
    - title
    - folderId
    - folderName
    - owner
    - status
    - sensitivity
    - version
    - updatedAt
    - updatedBy
    - links
    - my
  description: Row of the document list (listDocuments).
DocumentList:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/DocSummary
      maxItems: 200
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
    counts:
      type: object
      additionalProperties: false
      properties:
        all:
          type: integer
          minimum: 0
          format: int64
        mine:
          type: integer
          minimum: 0
          format: int64
        shared:
          type: integer
          minimum: 0
          format: int64
        route:
          type: integer
          minimum: 0
          format: int64
      required:
        - all
        - mine
        - shared
        - route
  required:
    - items
    - nextCursor
    - counts
  description: Documents visible to the member; counters of the filters «Все · Мои · Мне открыли · На маршруте».
DocField:
  type: object
  additionalProperties: false
  properties:
    key:
      type: string
      maxLength: 60
    src:
      type: string
      maxLength: 60
    value:
      type: string
      maxLength: 500
    from:
      type: string
      maxLength: 200
  required:
    - key
  description: Field of a template filled from the record (CRM fields); frozen at the signature.
DocTempGrant:
  type: object
  additionalProperties: false
  properties:
    member:
      $ref: ./schemas.yaml#/DocMemberRef
    level:
      type: string
      enum:
        - view
        - comment
        - suggest
        - edit
        - manage
    why:
      type: string
      maxLength: 300
    onlyVersion:
      type: integer
      minimum: 1
      format: int64
    keep:
      type: boolean
  required:
    - member
    - level
    - why
  description: Temporary access of a route (approver — comment for the time of the step; acknowledging — read of the approved version, kept).
DocProtectedRange:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      maxLength: 64
    sheet:
      type: string
      maxLength: 100
    range:
      type: string
      maxLength: 40
    name:
      type: string
      maxLength: 100
    who:
      type: array
      items:
        $ref: ./schemas.yaml#/DocShareEntry
      maxItems: 50
  required:
    - id
    - sheet
    - range
    - name
    - who
  description: Protected range of a sheet; Ortus checks it itself when the engine has no API (DOC-03, Q-W4.00-documents-12).
DocJob:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    op:
      type: string
      enum:
        - convert
        - ocr
        - merge
        - split
        - compress
        - pdfa
        - to_docx
        - to_xlsx
        - to_pdf
    docIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
      maxItems: 20
    name:
      type: string
      maxLength: 200
    status:
      type: string
      enum:
        - queued
        - running
        - done
        - failed
    progress:
      type: integer
      minimum: 0
      maximum: 100
      format: int64
    params:
      type: object
      additionalProperties: true
    error:
      type: string
      maxLength: 300
    resultDocumentId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Id
        - type: "null"
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    finishedAt:
      oneOf:
        - $ref: ../common/schemas.yaml#/Instant
        - type: "null"
  required:
    - id
    - op
    - docIds
    - name
    - status
    - createdAt
  description: Job of the documents worker (OCRmyPDF + Tesseract, qpdf, converter). Result — a new version or a new document; counted into the storage.
Document:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    kind:
      type: string
      enum:
        - text
        - sheet
        - pdf
    title:
      type: string
      maxLength: 200
    folderId:
      $ref: ../common/schemas.yaml#/Id
    folderName:
      type: string
      maxLength: 200
    path:
      type: array
      items:
        type: string
        maxLength: 200
        description: Folders from the root.
      maxItems: 12
    owner:
      $ref: ./schemas.yaml#/DocMemberRef
    status:
      type: string
      enum:
        - draft
        - in_route
        - returned
        - agreed
        - approved
        - signed
        - archived
    sensitivity:
      type: string
      enum:
        - normal
        - finance
        - pdn
    version:
      type: integer
      minimum: 1
      format: int64
    mode:
      type: string
      enum:
        - inherit
        - listed
    shares:
      type: array
      items:
        $ref: ./schemas.yaml#/DocShareEntry
      maxItems: 200
    links:
      type: array
      items:
        $ref: ./schemas.yaml#/DocLink
      maxItems: 20
    authors:
      type: array
      items:
        $ref: ./schemas.yaml#/DocMemberRef
      maxItems: 20
    template:
      type:
        - string
        - "null"
      maxLength: 100
    fields:
      type: array
      items:
        $ref: ./schemas.yaml#/DocField
      maxItems: 50
    frozen:
      type:
        - object
        - "null"
      additionalProperties: true
    file:
      oneOf:
        - $ref: ../common/schemas.yaml#/File
        - type: "null"
    pdfaCopy:
      type: boolean
    scan:
      type: boolean
    size:
      type: integer
      minimum: 0
      format: int64
    ocr:
      oneOf:
        - $ref: ./schemas.yaml#/DocOcr
        - type: "null"
    tempGrants:
      type: array
      items:
        $ref: ./schemas.yaml#/DocTempGrant
      maxItems: 50
    jobs:
      type: array
      items:
        $ref: ./schemas.yaml#/DocJob
      maxItems: 20
    route:
      oneOf:
        - $ref: ./schemas.yaml#/DocRoute
        - type: "null"
    protectedRanges:
      type: array
      items:
        $ref: ./schemas.yaml#/DocProtectedRange
      maxItems: 100
    commentCount:
      type: integer
      minimum: 0
      format: int64
    openCommentCount:
      type: integer
      minimum: 0
      format: int64
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    updatedAt:
      $ref: ../common/schemas.yaml#/Instant
    my:
      $ref: ./schemas.yaml#/DocMy
    revision:
      type: integer
      minimum: 1
      format: int64
  required:
    - id
    - kind
    - title
    - folderId
    - folderName
    - path
    - owner
    - status
    - sensitivity
    - version
    - mode
    - shares
    - links
    - authors
    - fields
    - tempGrants
    - jobs
    - protectedRanges
    - commentCount
    - openCommentCount
    - createdAt
    - updatedAt
    - my
    - revision
  description: Document with its access, route, jobs and protected ranges (getDocument). The body is the file of the engine (core.files, D-32 комплекта); versions — listDocVersions. A hidden or finance document for the function «Водитель» — 404 / function_blocked. ETag — revision.
DocFolder:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
      maxLength: 200
    parentId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Id
        - type: "null"
    orgUnitId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Id
        - type: "null"
    mode:
      type: string
      enum:
        - inherit
        - listed
    owner:
      $ref: ./schemas.yaml#/DocMemberRef
    icon:
      type: string
      maxLength: 40
    sensitivity:
      type: string
      enum:
        - normal
        - finance
        - pdn
    link:
      oneOf:
        - $ref: ../common/schemas.yaml#/ObjectRef
        - type: "null"
    hasRouteTemplate:
      type: boolean
    shares:
      type: array
      items:
        $ref: ./schemas.yaml#/DocShareEntry
      maxItems: 200
    documentCount:
      type: integer
      minimum: 0
      format: int64
    my:
      type: object
      additionalProperties: false
      properties:
        level:
          type:
            - string
            - "null"
          enum:
            - view
            - comment
            - suggest
            - edit
            - manage
            - null
        create:
          type: boolean
        manage:
          type: boolean
      required:
        - level
        - create
        - manage
    revision:
      type: integer
      minimum: 1
      format: int64
  required:
    - id
    - name
    - parentId
    - orgUnitId
    - mode
    - owner
    - icon
    - sensitivity
    - hasRouteTemplate
    - shares
    - documentCount
    - my
    - revision
  description: Folder of «Документы»; mode listed breaks the inheritance (like «Только выбранные» of the knowledge base).
DocFolderList:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/DocFolder
      maxItems: 500
  required:
    - items
  description: Folders visible to the member.
DocFolderCreate:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 200
    parentId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Id
        - type: "null"
    orgUnitId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Id
        - type: "null"
    mode:
      type: string
      enum:
        - inherit
        - listed
    icon:
      type: string
      maxLength: 40
    sensitivity:
      type: string
      enum:
        - normal
        - finance
  required:
    - name
  description: "New folder (Q-W4.00-documents-8): name, parent, firm, «Как у родителя» / «Только выбранные»."
DocFolderPatch:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 200
    mode:
      type: string
      enum:
        - inherit
        - listed
    icon:
      type: string
      maxLength: 40
    sensitivity:
      type: string
      enum:
        - normal
        - finance
  minProperties: 1
  description: Change of a folder; revision — If-Match.
DocCreate:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum:
        - text
        - sheet
        - pdf
    title:
      type: string
      minLength: 2
      maxLength: 200
    folderId:
      $ref: ../common/schemas.yaml#/Id
    templateId:
      $ref: ../common/schemas.yaml#/Id
    link:
      $ref: ../common/schemas.yaml#/ObjectRef
    csv:
      type: string
      maxLength: 200000
      description: Initial table for a sheet (docCreate csv).
    fileIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
        description: Uploaded files of purpose document (a PDF from files or photos).
      maxItems: 20
    scan:
      type: boolean
      description: "The file is a scan: a job OCR is queued unless sensitivity is pdn."
    sensitivity:
      type: string
      enum:
        - normal
        - finance
        - pdn
      description: "pdn — «Содержит паспорт или водительское удостоверение»: no recognition, access by an explicit list (DOC-07)."
  required:
    - kind
    - title
    - folderId
  description: "Creation of a document (docCreate): 422 validation_failed — «Название — не короче 2 символов», «Выберите папку», «Добавьте файлы или фото», «Выберите рейс / объект для полей шаблона»."
DocPatch:
  type: object
  additionalProperties: false
  properties:
    title:
      type: string
      minLength: 2
      maxLength: 200
    sensitivity:
      type: string
      enum:
        - normal
        - finance
        - pdn
  minProperties: 1
  description: Rename or relabel (docRename); revision — If-Match.
DocImpactPerson:
  type: object
  additionalProperties: false
  properties:
    member:
      $ref: ./schemas.yaml#/DocMemberRef
    from:
      type:
        - string
        - "null"
      enum:
        - view
        - comment
        - suggest
        - edit
        - manage
        - null
    to:
      type:
        - string
        - "null"
      enum:
        - view
        - comment
        - suggest
        - edit
        - manage
        - null
    invited:
      type: boolean
  required:
    - member
    - from
    - to
    - invited
  description: Change of the level of a member.
DocAccessImpact:
  type: object
  additionalProperties: false
  properties:
    gain:
      type: array
      items:
        $ref: ./schemas.yaml#/DocImpactPerson
      maxItems: 500
    lose:
      type: array
      items:
        $ref: ./schemas.yaml#/DocImpactPerson
      maxItems: 500
    up:
      type: array
      items:
        $ref: ./schemas.yaml#/DocImpactPerson
      maxItems: 500
    down:
      type: array
      items:
        $ref: ./schemas.yaml#/DocImpactPerson
      maxItems: 500
  required:
    - gain
    - lose
    - up
    - down
  description: Who gets, loses, raises or lowers the access (diffAccess); shown before saving.
DocMove:
  type: object
  additionalProperties: false
  properties:
    folderId:
      $ref: ../common/schemas.yaml#/Id
    dryRun:
      type: boolean
      description: true — nothing moves, the answer is the impact.
  required:
    - folderId
  description: Move to another folder (docMove).
DocMoveResult:
  type: object
  additionalProperties: false
  properties:
    applied:
      type: boolean
    document:
      oneOf:
        - $ref: ./schemas.yaml#/DocSummary
        - type: "null"
    impact:
      $ref: ./schemas.yaml#/DocAccessImpact
  required:
    - applied
    - impact
  description: "Result of moveDocument: «Документ уже в этой папке» — 422; locked — 409 document_locked."
DocSessionPermissions:
  type: object
  additionalProperties: false
  properties:
    edit:
      type: boolean
    review:
      type: boolean
    comment:
      type: boolean
    download:
      type: boolean
    print:
      type: boolean
    fillForms:
      type: boolean
    protectedRanges:
      type: boolean
  required:
    - edit
    - review
    - comment
    - download
    - print
    - fillForms
    - protectedRanges
  description: Rights of the member in the engine (the claims of the signed config).
DocSessionConfig:
  type: object
  additionalProperties: false
  properties:
    engine:
      type: string
      enum:
        - none
        - r7
        - onlyoffice
      description: "Chosen document server (D-32 комплекта): none until chosen, then r7 or onlyoffice — behind the adapter."
    editorAvailable:
      type: boolean
      description: "false on a stand without the engine: the document opens for viewing (PDF.js) and downloads, editing is off with the hint «Редактор подключается» (Q-W4.00-documents-1)."
    mode:
      type: string
      enum:
        - view
        - edit
        - review
        - comment
    documentKey:
      type: string
      maxLength: 128
      pattern: '^t[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.d[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.v[1-9][0-9]{0,9}$'
      description: 'Key of the version for the engine: t<tenantId>.d<documentId>.v<version> (lowercase UUIDs); changes with every saved version. The tenant is part of the key because the callback of the document server has no session and no tenantId in the path: the tenant database is chosen by the key after the signature is verified.'
    version:
      type: integer
      minimum: 1
      format: int64
    fileUrl:
      type: string
      maxLength: 2048
      description: Short-lived signed URL of the file for the engine or the viewer.
    editorUrl:
      type: string
      maxLength: 2048
    token:
      type: string
      maxLength: 4096
      description: Signed JWT config (HS256, shared secret of the adapter); absent without the engine.
    callbackUrl:
      type: string
      maxLength: 2048
      description: URL of docServerCallback the engine calls on save.
    user:

# Контракт Ортус · компоненты тега data. Пишет только стюард контракта (план v2 §3.5).
FieldDescriptor:
  type: object
  additionalProperties: false
  properties:
    key:
      type: string
    label:
      type: string
    valueType:
      type: string
      enum:
        - text
        - decimal
        - boolean
        - date
        - instant
        - reference
        - money
        - files
        - choices
    nullable:
      type: boolean
    filterOperators:
      type: array
      items:
        type: string
        enum:
          - eq
          - ne
          - lt
          - lte
          - gt
          - gte
          - in
          - contains
          - is_null
    sortable:
      type: boolean
    aggregatable:
      type: boolean
    sensitivity:
      type: string
      enum:
        - standard
        - personal
        - financial
    options:
      type: array
      maxItems: 100
      items:
        $ref: ../common/schemas.yaml#/ChoiceOption
      description: W2.51 (0.6.0-stage2). Codes and labels of a choices field (state of a vehicle or trip, expense category) — for filters and cells; the client may use its own dictionary for the same codes.
  required:
    - key
    - label
    - valueType
    - nullable
    - filterOperators
    - sortable
    - aggregatable
    - sensitivity
Dataset:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      description: "W2.51 (0.6.0-stage2). Logical dataset key (not a SQL table). Stage 2 datasets (S2-16, AC-14; prototype dataVM): fleet.vehicles «Автомобили» (fields displayName «Машина», registrationNumber «Номер», orgUnitName «Фирма», status «Состояние», volumeM3 «Объём, м³»; permission fleet.vehicles.read; entityType vehicle); fleet.trips «Поездки» (trip «Рейс», driverName «Водитель», state «Статус», mileageKm «Пробег, км», earnings «Начисление» — only with fleet.earnings.read and never for an active driver work profile, otherwise listed in hiddenFieldLabels; permission fleet.trips.read; entityType trip); fleet.expenses «Расходы» (trip «Рейс», kind «Категория», occurredOn «Дата», amount «Сумма», status «Статус»; permission fleet.expenses.read; entityType expense). Rows are limited by the scope of the dataset permission before filters, search, sort and pagination."
    moduleKey:
      type: string
    name:
      type: string
    fields:
      type: array
      items:
        $ref: ./schemas.yaml#/FieldDescriptor
    allowedAggregations:
      type: array
      items:
        type: string
        enum:
          - count
          - sum
          - avg
          - min
          - max
    permissionVersion:
      type: string
    permissionKey:
      type: string
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
      description: W2.51 (0.6.0-stage2). Own read permission of the dataset (fleet.trips.read); queryDataset requires data.query AND this key in the scope of the rows.
    entityType:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,49}$
      description: W2.51 (0.6.0-stage2). Entity of DatasetRow.recordId (ObjectRef moduleKey + entityType + recordId) — the client opens the source card of the module («Изменения — в карточке модуля»).
    exportAllowed:
      type: boolean
      description: W2.51 (0.6.0-stage2). The member holds data.export AND the dataset permission («Выгрузить»); the export operation itself is a separate asynchronous contract. W2.52 (0.6.1-stage2, D-11 комплекта) — the synchronous CSV export exportDataset of up to 10 000 rows (stage 2 — fleet.expenses «Расходы», fleet.trips «Поездки», fleet.vehicles «Автомобили»); false for a dataset without export.
    hiddenFieldLabels:
      type: array
      maxItems: 50
      items:
        type: string
        maxLength: 200
      description: W2.51 (0.6.0-stage2). Labels of fields hidden by the rights of the member (prototype «Поле «Начисление» скрыто правами и не участвует в фильтре, сортировке и выгрузке»). Only labels — no keys, values or counts; the fields cannot be selected, filtered, sorted, grouped or aggregated.
    defaultSort:
      type: array
      maxItems: 5
      items:
        $ref: ./schemas.yaml#/QuerySort
      description: W2.51 (0.6.0-stage2). Order of rows without sort.
  required:
    - id
    - moduleKey
    - name
    - fields
    - allowedAggregations
    - permissionVersion
  description: Dataset and field catalog is filtered before response. fleet.earnings is absent from driver catalog. SQL table names and storage keys are never exposed.
DatasetCatalog:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/Dataset
  required:
    - items
QueryFilter:
  type: object
  additionalProperties: false
  properties:
    fieldKey:
      type: string
    operator:
      type: string
      enum:
        - eq
        - ne
        - lt
        - lte
        - gt
        - gte
        - in
        - contains
        - is_null
    values:
      type: array
      items:
        $ref: ../common/schemas.yaml#/FieldValue
      maxItems: 100
  required:
    - fieldKey
    - operator
    - values
  description: Allowlisted field/operator combinations; field ACL checked before compilation. is_null requires no values; eq etc. one value; in multiple values.
QuerySort:
  type: object
  additionalProperties: false
  properties:
    fieldKey:
      type: string
    direction:
      type: string
      enum:
        - asc
        - desc
  required:
    - fieldKey
    - direction
QueryAggregate:
  type: object
  additionalProperties: false
  properties:
    function:
      type: string
      enum:
        - count
        - sum
        - avg
        - min
        - max
    fieldKey:
      type: string
    alias:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,49}$
  required:
    - function
    - alias
DatasetQuery:
  type: object
  additionalProperties: false
  properties:
    select:
      type: array
      items:
        type: string
      minItems: 1
      maxItems: 100
    filters:
      type: array
      items:
        $ref: ./schemas.yaml#/QueryFilter
      maxItems: 50
    sort:
      type: array
      items:
        $ref: ./schemas.yaml#/QuerySort
      maxItems: 5
    groupBy:
      type: array
      items:
        type: string
      maxItems: 5
    aggregates:
      type: array
      items:
        $ref: ./schemas.yaml#/QueryAggregate
      maxItems: 20
    limit:
      type: integer
      minimum: 1
      maximum: 200
      default: 50
    cursor:
      type: string
      maxLength: 2048
      description: W2.51 (0.6.0-stage2). nextCursor of the preceding result. Opaque and bound to the dataset, the member, permissionVersion, filters, search, sort, groupBy and aggregates (select and limit may change); a cursor of another query or a stale permissionVersion — 400 malformed_request «Курсор не подходит к выборке.».
    search:
      type: string
      maxLength: 200
      description: W2.51 (0.6.0-stage2). Case-insensitive substring over the visible text, choice-label, number and date cells of the row («Фильтр — По любому видимому полю»), applied with AND to filters; hidden fields never match.
    includeCount:
      type: boolean
      default: false
      description: W2.51 (0.6.0-stage2). Return visibleCount — the number of the visible scoped rows matching filters and search (the count of the dataset tab).
  required:
    - select
    - filters
    - sort
    - limit
  description: Only AND filters in v0.1. No SQL, joins, arbitrary expressions, executable formulas or unbounded scans. Scope predicates are injected server-side before grouping. Hidden fields cannot appear in select/filter/sort/group/aggregate. select fields in aggregate mode must belong to groupBy; aggregate aliases are returned as field keys.
DatasetRow:
  type: object
  additionalProperties: false
  properties:
    recordId:
      type: string
    cells:
      type: array
      items:
        $ref: ../common/schemas.yaml#/FieldEntry
  required:
    - recordId
    - cells
DatasetQueryResult:
  type: object
  additionalProperties: false
  properties:
    rows:
      type: array
      items:
        $ref: ./schemas.yaml#/DatasetRow
    nextCursor:
      type:
        - string
        - "null"
    schemaVersion:
      type: string
    visibleCount:
      type: integer
      minimum: 0
      maximum: 10000
      format: int64
      description: W2.51 (0.6.0-stage2). Only with includeCount; counted over visible scoped rows after filters and search, capped at 10000.
    visibleCountCapped:
      type: boolean
      description: W2.51 (0.6.0-stage2). true when there are more than 10000 rows.
  required:
    - rows
    - nextCursor
    - schemaVersion
  description: No unrestricted total count; aggregation is computed only over visible scoped rows. Personal data export is a separate permission/async contract.
# W2.52 (0.6.1-stage2, D-11 комплекта «выгрузка CSV расходов и рейсов», W2.50): синхронная выгрузка набора.
DatasetExportCreate:
  type: object
  additionalProperties: false
  properties:
    select:
      type: array
      items:
        type: string
      minItems: 1
      maxItems: 100
      description: Columns of the file in this order (visible fields of the dataset).
    filters:
      type: array
      items:
        $ref: ./schemas.yaml#/QueryFilter
      maxItems: 50
    search:
      type: string
      maxLength: 200
      description: As DatasetQuery.search.
    sort:
      type: array
      items:
        $ref: ./schemas.yaml#/QuerySort
      maxItems: 5
  required:
    - select
    - filters
    - sort
  description: The same rows as queryDataset with these filters, search and sort, without pagination and grouping.
DatasetExport:
  type: object
  additionalProperties: false
  properties:
    datasetId:
      type: string
    fileName:
      type: string
      minLength: 1
      maxLength: 255
      description: Suggested name of the file — <dataset name>-<YYYY-MM-DD>.csv in the time zone of the tenant (Расходы-2026-10-01.csv).
    contentType:
      type: string
      const: text/csv; charset=utf-8
    content:
      type: string
      maxLength: 16777216
      description: The CSV file (see exportDataset) — the client saves it as a file (Blob).
    rowCount:
      type: integer
      minimum: 0
      maximum: 10000
      format: int64
      description: Data rows in the file (the header row excluded).
    rowLimit:
      type: integer
      minimum: 1
      maximum: 10000
      format: int64
      description: Maximum rows of one export (10 000).
    truncated:
      type: boolean
      description: true when more rows match than rowLimit — narrow the filters.
    generatedAt:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - datasetId
    - fileName
    - contentType
    - content
    - rowCount
    - rowLimit
    - truncated
    - generatedAt
# W4.06 (0.7.0-stage4, W4.50): сохранённые виды набора (DATA-03; 07-ux-and-data §3 «Совместимость»).
DatasetViewQuery:
  type: object
  additionalProperties: false
  properties:
    select:
      type: array
      items:
        type: string
      minItems: 1
      maxItems: 100
      description: Columns in this order; absent — the visible fields of the dataset.
    filters:
      type: array
      items:
        $ref: ./schemas.yaml#/QueryFilter
      maxItems: 50
    search:
      type: string
      maxLength: 200
      description: As DatasetQuery.search (prototype «Фильтр — По любому видимому полю»).
    sort:
      type: array
      items:
        $ref: ./schemas.yaml#/QuerySort
      maxItems: 5
  required:
    - filters
    - sort
  description: W4.06 (0.7.0-stage4). The saved query spec of a view — the parts of DatasetQuery without pagination, grouping and count.
DatasetView:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    datasetId:
      type: string
    name:
      type: string
      minLength: 1
      maxLength: 120
      description: "Name of the view (prototype «Поездки: «Р-208»»)."
    visibility:
      type: string
      enum:
        - personal
        - shared
      description: personal — only the author («Вид сохранён · личный»); shared — every member who may query the dataset.
    ownerMemberId:
      $ref: ../common/schemas.yaml#/Id
    ownerDisplayName:
      type: string
      maxLength: 200
    query:
      $ref: ./schemas.yaml#/DatasetViewQuery
    hiddenFieldLabels:
      type: array
      maxItems: 50
      items:
        type: string
        maxLength: 200
      description: Labels of the fields of the saved query hidden from the viewer by rights or removed from the dataset; their filters, columns and sort are cut out of query (values never returned). Absent — the view is complete for the viewer.
    revision:
      type: integer
      minimum: 1
      format: int64
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    updatedAt:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - id
    - datasetId
    - name
    - visibility
    - ownerMemberId
    - ownerDisplayName
    - query
    - revision
    - createdAt
    - updatedAt
  description: W4.06 (0.7.0-stage4, DATA-03). A saved view of a dataset — a query spec, never rows; the rows are those of queryDataset for the viewer.
DatasetViewList:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      maxItems: 200
      items:
        $ref: ./schemas.yaml#/DatasetView
  required:
    - items
DatasetViewCreate:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
    visibility:
      type: string
      enum:
        - personal
        - shared
      default: personal
    query:
      $ref: ./schemas.yaml#/DatasetViewQuery
  required:
    - name
    - query
DatasetViewPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
    visibility:
      type: string
      enum:
        - personal
        - shared
    query:
      $ref: ./schemas.yaml#/DatasetViewQuery
# W4.06 (0.7.0-stage4, W4.50): выгрузка заданием с журналом (07-ux-and-data §3).
DatasetExportJobCreate:
  type: object
  additionalProperties: false
  properties:
    select:
      type: array
      items:
        type: string
      minItems: 1
      maxItems: 100
      description: Columns of the file in this order (visible fields of the dataset).
    filters:
      type: array
      items:
        $ref: ./schemas.yaml#/QueryFilter
      maxItems: 50
    search:
      type: string
      maxLength: 200
    sort:
      type: array
      items:
        $ref: ./schemas.yaml#/QuerySort
      maxItems: 5
    viewId:
      $ref: ../common/schemas.yaml#/Id
      description: The saved view the export started from — for the journal.
  required:
    - select
    - filters
    - sort
DatasetExportJob:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    datasetId:
      type: string
    datasetName:
      type: string
      description: Name of the dataset at the moment of the job (prototype «Выгрузка «Поездки»»).
    viewId:
      $ref: ../common/schemas.yaml#/Id
    state:
      type: string
      enum:
        - queued
        - running
        - ready
        - failed
        - expired
        - revoked
      description: queued → running → ready | failed; ready → expired at expiresAt; queued, running or ready → revoked (revokeReason).
    spec:
      $ref: ./schemas.yaml#/DatasetExportCreate
    columnLabels:
      type: array
      maxItems: 100
      items:
        type: string
        maxLength: 200
      description: Labels of the columns of select at the moment of the job — the header row of the file.
    timeZone:
      $ref: ../common/schemas.yaml#/TimeZone
    snapshotAt:
      $ref: ../common/schemas.yaml#/Instant
      description: Moment of the snapshot of the rows (the worker starts the job); absent while queued.
    rowLimit:
      type: integer
      minimum: 1
      maximum: 100000
      format: int64
      description: Maximum rows of a job (100 000).
    rowCount:
      type: integer
      minimum: 0
      maximum: 100000
      format: int64
      description: Data rows in the file (the header excluded) — when ready.
    truncated:
      type: boolean
      description: More rows match than rowLimit — narrow the filters.
    fileName:
      type: string
      minLength: 1
      maxLength: 255
      description: <dataset name>-<YYYY-MM-DD>.csv in the time zone of the organization, as exportDataset.
    sizeBytes:
      type: integer
      minimum: 0
      format: int64
    failureCode:
      type: string
      enum:
        - timeout
        - too_large
        - source_unavailable
        - internal
      description: Why a failed job failed (never SQL or storage details).
    revokeReason:
      type: string
      enum:
        - author
        - owner
        - permissions_changed
        - module_disabled
    requestedByMemberId:
      $ref: ../common/schemas.yaml#/Id
    requestedByDisplayName:
      type: string
      maxLength: 200
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    startedAt:
      $ref: ../common/schemas.yaml#/Instant
    finishedAt:
      $ref: ../common/schemas.yaml#/Instant
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
      description: The ready file is kept 24 h after finishedAt; then the job is expired and the file is deleted.
    revokedAt:
      $ref: ../common/schemas.yaml#/Instant
    revision:
      type: integer
      minimum: 1
      format: int64
  required:
    - id
    - datasetId
    - datasetName
    - state
    - spec
    - columnLabels
    - timeZone
    - rowLimit
    - requestedByMemberId
    - requestedByDisplayName
    - createdAt
    - revision
  description: W4.06 (0.7.0-stage4, 07-ux-and-data §3). An export of a dataset as a job — a row of the journal. The schema, the time zone, the filters and the snapshot moment are fixed; rights are rechecked when the worker starts and at every download.
DatasetExportJobPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      maxItems: 200
      items:
        $ref: ./schemas.yaml#/DatasetExportJob
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
DatasetExportDownload:
  type: object
  additionalProperties: false
  properties:
    exportJobId:
      $ref: ../common/schemas.yaml#/Id
    downloadUrl:
      type: string
      format: uri
      maxLength: 2048
      description: Short-lived signed link to the CSV file — it lives 5 minutes (expiresAt); the storage refuses it without the signature or after expiresAt (403), a new link — a new getDatasetExportDownload with the rights rechecked. Never logged or shared.
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
    fileName:
      type: string
      minLength: 1
      maxLength: 255
    contentType:
      type: string
      const: text/csv; charset=utf-8
    sizeBytes:
      type: integer
      minimum: 0
      format: int64
  required:
    - exportJobId
    - downloadUrl
    - expiresAt
    - fileName
    - contentType
    - sizeBytes

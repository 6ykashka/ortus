# W1.00 (0.4.0-stage1, S1-04): команды оператора с обязательной причиной и журнал платформы.
/api/v1/platform/tenants/{tenantId}/suspend:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  post:
    operationId: suspendPlatformTenant
    tags:
      - Platform
    summary: Suspend a tenant with a mandatory reason
    x-permissions:
      - platform.tenants.manage
    x-scope: platform
    description: "Operator command (S1-04, PLAT-02): the tenant moves to suspended. New operations, invitations and uploads are closed for every member; started shifts may be finished; the owner keeps recovery and billing access; no data is deleted. Requires If-Match with the tenant ETag. Allowed from trial, active, grace and read_only; already suspended, provisioning, closing or closed returns 409 invalid_transition. Sessions of the tenant receive context.changed over the realtime channel (ADR-0015). Writes a platform_audit row (action tenant.suspended) with the reason in the same transaction. The prototype action Ограничить новые операции maps to this command."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/platform/schemas.yaml#/Tenant
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "412":
        $ref: ../components/common/responses.yaml#/PreconditionFailed
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
      - $ref: ../components/common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/platform/schemas.yaml#/TenantStatusChange
    x-permissions-mode: all
/api/v1/platform/tenants/{tenantId}/resume:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  post:
    operationId: resumePlatformTenant
    tags:
      - Platform
    summary: Resume a suspended tenant with a mandatory reason
    x-permissions:
      - platform.tenants.manage
    x-scope: platform
    description: "Operator command (S1-04, PLAT-02): a suspended tenant returns to the state derived from its subscription (trialing → trial, active → active, grace or past_due → grace, read_only → read_only). Requires If-Match with the tenant ETag. A tenant that is not suspended returns 409 invalid_transition. Sessions of the tenant receive context.changed (ADR-0015). Writes a platform_audit row (action tenant.resumed) with the reason in the same transaction. The prototype action Снять ограничение maps to this command."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:

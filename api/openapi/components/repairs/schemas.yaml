# Контракт Ортус · компоненты тега repairs. Пишет только стюард контракта (план v2 §3.5).
Worker:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    displayName:
      type: string
    trade:
      type: string
    status:
      type: string
      enum:
        - active
        - archived
  required:
    - id
    - displayName
    - trade
    - status
  description: Non-login person record; no userId, credentials or organization membership. It must never consume a user seat or inherit access merely because work is recorded for them.
WorkerCreate:
  type: object
  additionalProperties: false
  properties:
    displayName:
      type: string
      minLength: 1
      maxLength: 150
    trade:
      type: string
      maxLength: 100
  required:
    - displayName
    - trade
RepairProject:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
    address:
      type: string
    status:
      type: string
      enum:
        - draft
        - planned
        - active
        - completed
        - archived
        - handed_over
    foremanMemberId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Id
        - type: "null"
    workers:
      type: array
      items:
        $ref: ./schemas.yaml#/Worker
    revision:
      type: integer
      minimum: 1
      format: int64
    kind:
      type: string
      maxLength: 100
    stage:
      type: string
      maxLength: 100
    areaM2:
      $ref: ../common/schemas.yaml#/Quantity
    rooms:
      type: integer
      minimum: 0
    contractNo:
      type: string
      maxLength: 40
    startOn:
      type: string
      format: date
    dueOn:
      type: string
      format: date
    forecastDueOn:
      type: string
      format: date
    clientName:
      type: string
      maxLength: 150
    clientPhone:
      type: string
      maxLength: 40
    access:
      type: array
      items:
        $ref: ./schemas.yaml#/RepairAccessItem
    measured:
      type: boolean
    handedOverOn:
      type: string
      format: date
    warrantyUntil:
      type: string
      format: date
    templateId:
      $ref: ../common/schemas.yaml#/Id
    leadTaskId:
      $ref: ../common/schemas.yaml#/Id
    readiness:
      $ref: ./schemas.yaml#/RepairReadiness
    todoCount:
      type: integer
      minimum: 0
    todoTop:
      $ref: ./schemas.yaml#/RepairDecision
    budget:
      $ref: ../common/schemas.yaml#/Money
  required:
    - id
    - orgUnitId
    - name
    - address
    - status
    - foremanMemberId
    - workers
    - revision
    - access
    - measured
    - readiness
    - todoCount
  description: "Repair object (RS-08: RepairProject, UI «Объект»). foremanMemberId is null until the owner assigns a foreman; a draft object (status draft) is created at the lead stage «Замер» and has only measurement and estimate. budget (contract amount) and clientPhone are omitted without repairs.finance.read — the server never returns them to the foreman, the crew or a subcontractor."
RepairProjectCreate:
  type: object
  additionalProperties: false
  properties:
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
      minLength: 1
      maxLength: 150
    address:
      type: string
      maxLength: 1000
    workers:
      type: array
      items:
        $ref: ./schemas.yaml#/WorkerCreate
      maxItems: 100
    kind:
      type: string
      maxLength: 100
    areaM2:
      $ref: ../common/schemas.yaml#/Quantity
    rooms:
      type: integer
      minimum: 0
    clientName:
      type: string
      maxLength: 150
    clientPhone:
      type: string
      maxLength: 40
    leadTaskId:
      $ref: ../common/schemas.yaml#/Id
    access:
      type: array
      items:
        $ref: ./schemas.yaml#/RepairAccessItem
      maxItems: 30
    templateId:
      $ref: ../common/schemas.yaml#/Id
    foremanMemberId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Id
        - type: "null"
    budget:
      $ref: ../common/schemas.yaml#/Money
  required:
    - orgUnitId
    - name
    - address
    - workers
  description: Creates a draft object (from a lead at the stage «Замер», Q-W4.00-repair-16) or an active one. Local non-login workers are created in the same transaction. An empty measurement (version 1) is created with the object.
RepairProjectPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/RepairProject
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort.
WorkLogLine:
  type: object
  additionalProperties: false
  properties:
    quantity:
      $ref: ../common/schemas.yaml#/Quantity
    unit:
      type: string
      enum:
        - hour
        - m2
        - m3
        - m
        - piece
        - set
        - trip
        - mesh
        - liter
    workId:
      $ref: ../common/schemas.yaml#/Id
    workerId:
      $ref: ../common/schemas.yaml#/Id
    workCode:
      type: string
    description:
      type: string
      maxLength: 2000
    presenceMinutes:
      type: integer
      minimum: 0
      format: int64
  required:
    - quantity
    - unit
  description: "W6.00: one line = one work of the object with a volume (the prototype mark). workerId and workCode of 0.1 stay optional; presence is not implemented in stage 6 (Q-W4.00-repair-14)."
WorkLogCreate:
  type: object
  additionalProperties: false
  properties:
    projectId:
      $ref: ../common/schemas.yaml#/Id
    workDate:
      type: string
      format: date
    timeZone:
      $ref: ../common/schemas.yaml#/TimeZone
    lines:
      type: array
      items:
        $ref: ./schemas.yaml#/WorkLogLine
      minItems: 1
      maxItems: 100
    evidenceFileIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
      minItems: 1
      maxItems: 20
    note:
      type: string
      maxLength: 5000
    crewWorkerIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
      maxItems: 100
    materials:
      type: array
      items:
        $ref: ./schemas.yaml#/WorkLogMaterial
      maxItems: 100
  required:
    - projectId
    - workDate
    - timeZone
    - lines
    - evidenceFileIds
  description: Only the foreman of the object (repairs.work_logs.submit in its scope). «Отметьте работников» and «Добавьте хотя бы одно фото» of the prototype are validation_failed fields crewWorkerIds and evidenceFileIds; volume above plan + 10 % — reason work_volume_exceeds_plan.
WorkLog:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    projectId:
      $ref: ../common/schemas.yaml#/Id
    submittedByMemberId:
      $ref: ../common/schemas.yaml#/Id
    workDate:
      type: string
      format: date
    timeZone:
      $ref: ../common/schemas.yaml#/TimeZone
    lines:
      type: array
      items:
        $ref: ./schemas.yaml#/WorkLogLine
    evidenceFileIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
    status:
      type: string
      enum:
        - submitted
        - accepted
        - rejected
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    revision:
      type: integer
      minimum: 1
      format: int64
    number:
      type: string
      maxLength: 20
    crewWorkerIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
    materials:
      type: array
      items:
        $ref: ./schemas.yaml#/WorkLogMaterial
    acceptedAt:
      $ref: ../common/schemas.yaml#/Instant
    acceptedByMemberId:
      $ref: ../common/schemas.yaml#/Id
    returnReason:
      type: string
      maxLength: 500
  required:
    - id
    - projectId
    - submittedByMemberId
    - workDate
    - timeZone
    - lines
    - evidenceFileIds
    - status
    - createdAt
    - revision
  description: Accepted volumes only count in the fact (submitted = «На проверке»). The return reason is visible to the foreman, not to the crew (Q-W4.00-repair-3).
WorkLogPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/WorkLog
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort.
RepairUnit:
  type: string
  enum:
    - hour
    - m2
    - m3
    - m
    - piece
    - set
    - trip
    - mesh
    - liter
  description: Unit of volume. 0.1 units hour, m2, m3, m, piece plus set (комплект), trip (рейс), mesh (мешок), liter (литр) of the prototype.
RepairAccessItem:
  type: object
  additionalProperties: false
  properties:
    icon:
      type: string
      maxLength: 40
    text:
      type: string
      maxLength: 200
  required:
    - icon
    - text
RepairReadiness:
  type: object
  additionalProperties: false
  properties:
    acceptedPct:
      type: integer
      minimum: 0
      maximum: 100
    pendingPct:
      type: integer
      minimum: 0
      maximum: 100
    clientPct:
      type: integer
      minimum: 0
      maximum: 100
  required:
    - acceptedPct
    - pendingPct
    - clientPct
  description: Team readiness = accepted volumes to plan (+ pending); client readiness — by signed acts only (Q-W4.00-repair-4). Pending volume is never part of the fact.
RepairDecision:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum:
        - no_foreman
        - work_log_pending
        - work_log_missing
        - schedule_slip
        - stage_no_executor
        - document_wait_signature
        - document_ready
        - supply_pending
        - estimate_with_client
        - change_order_new
        - change_order_priced
        - change_order_sent
        - estimate_missing
        - estimate_draft
        - estimate_sent
        - estimate_approved
    text:
      type: string
      maxLength: 300
    actionLabel:
      type: string
      maxLength: 60
    tab:
      type: string
      enum:
        - overview
        - works
        - measure
        - estimate
        - schedule
        - docs
        - supply
        - finance
        - pay
        - subs
        - client
    refId:
      $ref: ../common/schemas.yaml#/Id
  required:
    - kind
    - text
    - tab
  description: One item of «Требует решения» (the same function feeds the list, the card and «Главная»). Items with sums are returned only with repairs.finance.read.
RepairProjectPatch:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 150
    address:
      type: string
      maxLength: 1000
    kind:
      type: string
      maxLength: 100
    areaM2:
      $ref: ../common/schemas.yaml#/Quantity
    rooms:
      type: integer
      minimum: 0
    contractNo:
      type: string
      maxLength: 40
    dueOn:
      type: string
      format: date
    clientName:
      type: string
      maxLength: 150
    clientPhone:
      type: string
      maxLength: 40
    access:
      type: array
      items:
        $ref: ./schemas.yaml#/RepairAccessItem
      maxItems: 30
  minProperties: 1
RepairForemanAssign:
  type: object
  additionalProperties: false
  properties:
    foremanMemberId:
      $ref: ../common/schemas.yaml#/Id
  required:
    - foremanMemberId
RepairHandOver:
  type: object
  additionalProperties: false
  properties:
    actDocumentId:
      $ref: ../common/schemas.yaml#/Id
    warrantyMonths:
      type: integer
      minimum: 1
      maximum: 120
  required:
    - actDocumentId
  description: The signed «Акт сдачи объекта» (Q-W4.00-repair-21); warranty defaults to the warranty passport of the template (24 or 12 months).
RepairWork:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    projectId:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
    unit:
      $ref: ./schemas.yaml#/RepairUnit
    plan:
      $ref: ../common/schemas.yaml#/Quantity
    fact:
      $ref: ../common/schemas.yaml#/Quantity
    pending:
      $ref: ../common/schemas.yaml#/Quantity
    estimateLineId:
      $ref: ../common/schemas.yaml#/Id
  required:
    - id
    - projectId
    - name
    - unit
    - plan
    - fact
    - pending
RepairWorkList:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/RepairWork
  required:
    - items
RepairPhoto:
  type: object
  additionalProperties: false
  properties:
    fileId:
      $ref: ../common/schemas.yaml#/Id
    workLogId:
      $ref: ../common/schemas.yaml#/Id
    takenAt:
      $ref: ../common/schemas.yaml#/Instant
    status:
      type: string
      enum:
        - accepted
        - pending
  required:
    - fileId
    - workLogId
    - takenAt
    - status
RepairPeople:
  type: object
  additionalProperties: false
  properties:
    clientName:
      type:
        - string
        - "null"
    clientLinkActive:
      type: boolean
    foreman:
      type:
        - object
        - "null"
      additionalProperties: false
      properties:
        memberId:
          $ref: ../common/schemas.yaml#/Id
        displayName:
          type: string
      required:
        - memberId
        - displayName
    crew:
      type: array
      items:
        $ref: ./schemas.yaml#/Worker
    subcontractor:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        accessUntil:
          type:
            - string
            - "null"
          format: date
      required:
        - name
        - accessUntil
  required:
    - clientName
    - clientLinkActive
    - foreman
    - crew
RepairMoneyCard:
  type: object
  additionalProperties: false
  properties:
    contract:
      $ref: ../common/schemas.yaml#/Money
    received:
      $ref: ../common/schemas.yaml#/Money
    expenses:
      $ref: ../common/schemas.yaml#/Money
    marginPlan:
      $ref: ./schemas.yaml#/RepairMoneyDelta
  required:
    - contract
    - received
    - expenses
    - marginPlan
RepairMoneyDelta:
  type: object
  additionalProperties: false
  properties:
    amountMinor:
      type: integer
      format: int64
    currency:
      type: string
      pattern: ^[A-Z]{3}$
  required:
    - amountMinor
    - currency
  description: Signed minor units (difference, margin).
RepairFeedItem:
  type: object
  additionalProperties: false
  properties:
    at:
      $ref: ../common/schemas.yaml#/Instant
    text:
      type: string
      maxLength: 300
    actorName:
      type: string
  required:
    - at
    - text
RepairProjectOverview:
  type: object
  additionalProperties: false
  properties:
    project:
      $ref: ./schemas.yaml#/RepairProject
    decisions:
      type: array
      items:
        $ref: ./schemas.yaml#/RepairDecision
    works:
      type: array
      items:
        $ref: ./schemas.yaml#/RepairWork
    photos:
      type: array
      items:
        $ref: ./schemas.yaml#/RepairPhoto
    people:
      $ref: ./schemas.yaml#/RepairPeople
    money:
      $ref: ./schemas.yaml#/RepairMoneyCard
    feed:
      type: array
      items:
        $ref: ./schemas.yaml#/RepairFeedItem
  required:
    - project
    - decisions
    - works
    - photos
    - people
    - feed
  description: Overview tab (variant 1a). money is present only with repairs.finance.read.
WorkLogMaterial:
  type: object
  additionalProperties: false
  properties:
    priceItemId:
      $ref: ../common/schemas.yaml#/Id
    quantity:
      $ref: ../common/schemas.yaml#/Quantity
  required:
    - priceItemId
    - quantity
WorkLogReturn:
  type: object
  additionalProperties: false
  properties:
    reason:
      type: string
      minLength: 2
      maxLength: 500
  required:
    - reason
ChangeOrder:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    projectId:
      $ref: ../common/schemas.yaml#/Id
    number:
      type: string
      maxLength: 20
    title:
      type: string
      maxLength: 300
    quantity:
      $ref: ../common/schemas.yaml#/Quantity
    unit:
      $ref: ./schemas.yaml#/RepairUnit
    note:
      type: string
      maxLength: 2000
    photoFileIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
    status:
      type: string
      enum:
        - proposed
        - priced
        - sent
        - signed
        - rejected
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    revision:
      type: integer
      minimum: 1
      format: int64
    rejectReason:
      $ref: ./schemas.yaml#/RepairRejectReason
    agreementNo:
      type: integer
      minimum: 1
    estimateVersion:
      type: integer
      minimum: 1
  required:
    - id
    - projectId
    - number
    - title
    - quantity
    - unit
    - note
    - photoFileIds
    - status
    - createdAt
    - revision
ChangeOrderCreate:
  type: object
  additionalProperties: false
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 300
    quantity:
      $ref: ../common/schemas.yaml#/Quantity
    unit:
      $ref: ./schemas.yaml#/RepairUnit
    photoFileIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
      minItems: 1
      maxItems: 20
    note:
      type: string
      maxLength: 2000
  required:
    - title
    - quantity
    - unit
    - photoFileIds
  description: The foreman describes the work without prices. «Опишите, что нужно сделать», «Укажите объём больше нуля», «Приложите хотя бы одно фото»; no change orders before the contract (draft object) and on a handed-over object — change_order_closed.
ChangeOrderReject:
  type: object
  additionalProperties: false
  properties:
    reason:
      $ref: ./schemas.yaml#/RepairRejectReason
  required:
    - reason
ChangeOrderList:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/ChangeOrder
  required:
    - items
MeasurementRoom:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
      maxLength: 100
    lengthM:
      $ref: ../common/schemas.yaml#/Quantity
    widthM:
      $ref: ../common/schemas.yaml#/Quantity
    heightM:
      $ref: ../common/schemas.yaml#/Quantity
    openingsM2:
      $ref: ../common/schemas.yaml#/Quantity
    wet:
      type: boolean
  required:
    - id
    - name
    - lengthM
    - widthM
    - heightM
    - openingsM2
MeasurementRoomInput:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    lengthM:
      $ref: ../common/schemas.yaml#/Quantity
    widthM:
      $ref: ../common/schemas.yaml#/Quantity
    heightM:
      $ref: ../common/schemas.yaml#/Quantity
    openingsM2:
      $ref: ../common/schemas.yaml#/Quantity
    wet:
      type: boolean
  required:
    - name
    - lengthM
    - widthM
    - heightM
    - openingsM2
MeasurementTotals:
  type: object
  additionalProperties: false
  properties:
    floorM2:
      $ref: ../common/schemas.yaml#/Quantity
    wallsM2:
      $ref: ../common/schemas.yaml#/Quantity
    perimeterM:
      $ref: ../common/schemas.yaml#/Quantity
    wetFloorM2:
      $ref: ../common/schemas.yaml#/Quantity
    wetWallsM2:
      $ref: ../common/schemas.yaml#/Quantity
  required:
    - floorM2
    - wallsM2
    - perimeterM
    - wetFloorM2
    - wetWallsM2
Measurement:
  type: object
  additionalProperties: false
  properties:
    projectId:
      $ref: ../common/schemas.yaml#/Id
    version:
      type: integer
      minimum: 1
    rooms:
      type: array
      items:
        $ref: ./schemas.yaml#/MeasurementRoom
    totals:
      $ref: ./schemas.yaml#/MeasurementTotals
    revision:
      type: integer
      minimum: 1
      format: int64
    measuredAt:
      $ref: ../common/schemas.yaml#/Instant
    measuredByMemberId:
      $ref: ../common/schemas.yaml#/Id
  required:
    - projectId
    - version
    - rooms
    - totals
    - revision
MeasurementPut:
  type: object
  additionalProperties: false
  properties:
    rooms:
      type: array
      items:
        $ref: ./schemas.yaml#/MeasurementRoomInput
      maxItems: 100
  required:
    - rooms
  description: A new measurement version; a draft estimate is recalculated (lines «из замера»), sent and approved versions are never changed (Q-W4.00-repair-17).
EstimateSection:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
      maxLength: 150
  required:
    - id
    - name
EstimateLine:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    sectionId:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
      maxLength: 300
    unit:
      $ref: ./schemas.yaml#/RepairUnit
    kind:
      type: string
      enum:
        - work
        - material
    price:
      $ref: ../common/schemas.yaml#/Money
    quantity:
      $ref: ../common/schemas.yaml#/Quantity
    sum:
      $ref: ../common/schemas.yaml#/Money
    manual:
      type: boolean
    isNew:
      type: boolean
    priceItemId:
      $ref: ../common/schemas.yaml#/Id
    formula:
      type: string
      maxLength: 100
    coef:
      $ref: ../common/schemas.yaml#/Quantity
  required:
    - id
    - sectionId
    - name
    - unit
    - kind
    - price
    - quantity
    - sum
    - manual
    - isNew
  description: "id is the stable key of the line between versions of the estimate (repairs.estimate_lines.line_key): a new version copies the lines with the same id and diffEstimates matches them by it; replacing a price list item is «убрано» plus «добавлено»."
Estimate:
  type: object
  additionalProperties: false
  properties:
    projectId:
      $ref: ../common/schemas.yaml#/Id
    version:
      type: integer
      minimum: 1
    kind:
      type: string
      enum:
        - first
        - revision
        - change
    state:
      type: string
      enum:
        - draft
        - sent
        - approved
        - replaced
    sections:
      type: array
      items:
        $ref: ./schemas.yaml#/EstimateSection
    lines:
      type: array
      items:
        $ref: ./schemas.yaml#/EstimateLine
    discountPct:
      type: integer
      minimum: 0
      maximum: 100
    total:
      $ref: ../common/schemas.yaml#/Money
    changeOrderIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
    revision:
      type: integer
      minimum: 1
      format: int64
    baseVersion:
      type: integer
      minimum: 1
    templateId:
      $ref: ../common/schemas.yaml#/Id
    agreementNo:
      type: integer
      minimum: 1
    sentAt:
      $ref: ../common/schemas.yaml#/Instant

          format: date
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/WorkLogLine"
        evidenceFileIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        status:
          type: string
          enum:
            - submitted
            - accepted
            - rejected
        createdAt:
          $ref: "#/components/schemas/Instant"
        revision:
          type: integer
          minimum: 1
          format: int64
      required:
        - id
        - projectId
        - submittedByMemberId
        - workDate
        - timeZone
        - lines
        - evidenceFileIds
        - status
        - createdAt
        - revision
    WorkLogCreate:
      type: object
      additionalProperties: false
      properties:
        projectId:
          $ref: "#/components/schemas/Id"
        workDate:
          type: string
          format: date
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/WorkLogLine"
          minItems: 1
          maxItems: 100
        evidenceFileIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          maxItems: 20
        note:
          type: string
          maxLength: 5000
      required:
        - projectId
        - workDate
        - timeZone
        - lines
        - evidenceFileIds
      description: Foreman can submit only for assigned visible projects and project-linked workers. Corrections are revisions/compensations; historical worker attribution is preserved.
    WorkLogLine:
      type: object
      additionalProperties: false
      properties:
        workerId:
          $ref: "#/components/schemas/Id"
        workCode:
          type: string
        description:
          type: string
          maxLength: 2000
        quantity:
          $ref: "#/components/schemas/Quantity"
        unit:
          type: string
          enum:

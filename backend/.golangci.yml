# golangci-lint v2 (pinned v2.13.2: CLAUDE.md, CI W0.04). Run from backend/: golangci-lint run ./...
# Base: .claude/skills/golang-lint/assets/.golangci.yml; depguard enabled for module boundaries.
version: "2"

run:
  timeout: 5m
  tests: true
  build-tags: [integration, isolation, concurrency]

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  enable:
    # correctness
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - reassign
    # style
    - gocritic
    - revive
    - whitespace
    - godot
    - misspell
    - dupword
    - predeclared
    - errname
    - asciicheck
    # complexity
    - gocyclo
    - nestif
    - funlen
    - dupl
    # performance
    - perfsprint
    - unconvert
    - ineffassign
    - goconst
    # security & resources
    - gosec
    - bidichk
    - bodyclose
    - noctx
    - containedctx
    - fatcontext
    - sqlclosecheck
    - rowserrcheck
    # logging
    - sloglint
    - loggercheck
    # testing
    - testifylint
    - thelper
    - usetesting
    - paralleltest
    # modernization & meta
    - modernize
    - intrange
    - usestdlibvars
    - exhaustive
    - nolintlint
    # module boundaries (design/docs/14-engineering.md: modules talk via platform and */api only)
    - depguard

  exclusions:
    presets: [comments, std-error-handling]
    paths:
      - internal/api/ # generated by make gen
    rules:
      - path: _test\.go
        linters: [errcheck, funlen, dupl, goconst]

  settings:
    depguard:
      rules:
        modules:
          list-mode: strict
          files: ["**/internal/modules/**"]
          allow:
            - $gostd
            - github.com/ortus/ortus-crm/backend/internal/platform
            - github.com/ortus/ortus-crm/backend/internal/api
            - github.com/ortus/ortus-crm/backend/internal/domain
            - github.com/jackc/pgx/v5
            - github.com/google/uuid
            - github.com/stretchr/testify
            - go.uber.org/goleak
            - github.com/testcontainers/testcontainers-go
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 120
      statements: 80
    goconst:
      min-len: 3
      min-occurrences: 4
    gocyclo:
      min-complexity: 13
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  # gofmt + goimports: the same result as the lint-staged hook (gofmt -w).
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/api/

# Матрица изоляции: отказы шлюза «Форм и опросов» (W4.05, контракт 0.11.0-stage4) — без pending. Шлюз cmd/api пускает
# операцию, только если у актора есть грант с действием x-permissions, вид области которого допускает x-scope операции.
# У ролей фикстур нет ни одного действия core.forms: «Менеджер логистики» (a.manager-msk1) и «Водитель» (a.driver-msk1)
# получают 403 до хендлера и после него. reviewFormResponse — x-permissions пуст (права по полям, x-field-permissions):
# отказ даёт хендлер, строки — в forms_w405.yaml. Команды с If-Match получают 403 шлюза раньше предусловия; id объектов —
# tenant:missing. Формат — README.md.
# После правки: go -C backend generate ./test/isolation
module: forms_w405_gate
endpoints:
  - op: listForms
    method: GET
    path: /api/v1/tenants/{tenantId}/forms
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        note: у «Менеджера логистики» фикстур нет действий core.forms — 403 шлюза
      - actor: a.driver-msk1
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        note: у водителя нет действий core.forms (отвечает через осмотр рейса) — 403 шлюза
  - op: createForm
    method: POST
    path: /api/v1/tenants/{tenantId}/forms
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        body: '{"name":"Анкета клиента","orgUnitId":null,"templateId":"blank"}'
        note: у «Менеджера логистики» фикстур нет действий core.forms — 403 шлюза
  - op: getForm
    method: GET
    path: /api/v1/tenants/{tenantId}/forms/{formId}
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, formId: tenant:missing }
        status: 403
        code: forbidden_action
        note: у «Менеджера логистики» фикстур нет действий core.forms — 403 шлюза
  - op: updateForm
    method: PATCH

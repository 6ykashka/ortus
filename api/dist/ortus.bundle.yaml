        - displayName
        - bodyType
        - capacity
        - equipment
        - odometerKm
    VehiclePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Vehicle"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 2048
      required:
        - items

  /api/v1/auth/login:
    parameters: []
    get:
      operationId: startLogin
      tags:
        - Auth
      summary: Start browser sign-in with OIDC Authorization Code + PKCE
      x-permissions: []
      x-scope: identity
      security: []
      x-public-capability: none — starts the OIDC Authorization Code + PKCE flow; the BFF stores a single-use state, nonce and code_verifier in a short-lived pre-auth cookie (10 minutes)
      description: The BFF redirects to the identity provider authorization endpoint. returnTo is a same-origin relative path of the web application; anything else is rejected with 400 malformed_request. No tenant data is read. Browser JavaScript never receives tokens.
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Same-origin relative application path to open after sign-in. Starts with a single /; no scheme, no host, no protocol-relative //, no backslash anywhere (browsers read \ as / in Location, so /\host would leave the origin), no whitespace or control characters. The pattern avoids lookaround so that Go (RE2) and ECMAScript validators agree; the BFF validates it again before redirecting.
          schema:
            type: string
            maxLength: 512
            pattern: ^/(?:[^/\\\s\x00-\x1f\x7f][^\\\s\x00-\x1f\x7f]*)?$
      responses:
        "302":
          description: Redirect to the OIDC provider authorization endpoint.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              description: Authorization endpoint of the identity provider with state, nonce and PKCE S256 challenge.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Pre-auth cookie (HttpOnly, Secure, SameSite=Lax, Path=/api/v1/auth, Max-Age=600) bound to the state.
              schema:
                type: string
            Cache-Control:
              description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
              schema:
                type: string
                const: private, no-store
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
      x-permissions-mode: all
  /api/v1/auth/callback:
    parameters: []
    get:
      operationId: completeLogin
      tags:
        - Auth
      summary: Complete OIDC sign-in and establish the browser session
      x-permissions: []
      x-scope: identity
      security: []
      x-public-capability: OIDC state + PKCE code_verifier from the pre-auth cookie; single use, expires after 10 minutes
      description: Exchanges the authorization code with the PKCE verifier, validates ID token signature, issuer, audience, nonce and expiry, maps the subject to the platform account and issues the __Host-ortus_session cookie. A missing, foreign or expired state returns 401 session_expired (sign in again); an account locked by an operator or an IdP access_denied returns 403 forbidden_action. Signing in does not create memberships; an identity without memberships gets an empty MeContext.tenants.
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code from the identity provider; absent when the provider returns error.
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: true
          description: State issued by startLogin; compared with the pre-auth cookie in constant time.
          schema:
            type: string
            minLength: 16
            maxLength: 256
        - name: error
          in: query
          required: false
          description: OAuth 2.0 error code from the identity provider (e.g. access_denied).
          schema:
            type: string
            maxLength: 64
      responses:
        "302":
          description: Redirect to returnTo (or the application root) with the session cookie set and the pre-auth cookie cleared.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              description: Same-origin relative path saved by startLogin.
              schema:
                type: string
            Set-Cookie:
              description: __Host-ortus_session (HttpOnly, Secure, SameSite=Lax, Path=/); the pre-auth cookie is expired.
              schema:
                type: string
            Cache-Control:
              description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
              schema:
                type: string
                const: private, no-store
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
      x-permissions-mode: all

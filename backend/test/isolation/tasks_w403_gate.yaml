    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, taskId: tenant:missing }
        status: 403
        code: forbidden_action
        body: '{"priority":"urgent"}'
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
      - actor: a.project-approver
        params: { tenantId: tenant:a, taskId: task:a.fleet-2 }
        status: 403
        code: forbidden_action
        body: '{"priority":"urgent"}'
        note: без tasks.update «Согласующий» (только tasks.approve) — 403 шлюза (Q-W4.03-15)
  - op: transitionTask

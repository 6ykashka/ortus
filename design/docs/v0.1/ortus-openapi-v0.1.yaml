  description: Platform operator control plane
- name: Billing
  description: Tenant subscriptions and storage
- name: Access
  description: Members, role assignments and scoped organization structure
- name: Modules
  description: Module installations, permissions and typed settings
- name: Data
  description: Unified authorized dataset registry
- name: Files
  description: Private upload quarantine and authorized download
- name: Tasks
  description: Projects and workflow-controlled tasks
- name: Knowledge
  description: Scoped knowledge pages and revisions
- name: Calendar
  description: Multi-resource availability and atomic bookings
- name: Forms
  description: Versioned forms and response review
- name: PublicForms
  description: Capability-limited anonymous submissions
- name: Fleet
  description: Vehicles, reservations, inspection, trips and dispatch
- name: Earnings
  description: Manager-only confidential driver earnings
- name: Spa
  description: Services, appointments and recipe consumption
- name: Inventory
  description: Immutable warehouse movements
- name: Cash
  description: Internal non-fiscal cash ledger
- name: Repairs
  description: Project work and non-login workers

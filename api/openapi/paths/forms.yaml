/api/v1/tenants/{tenantId}/forms/{formId}/publish:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
    - $ref: ../components/common/parameters.yaml#/formId
  post:
    operationId: publishForm
    tags:
      - Forms
    summary: Publish the draft as the next immutable version
    x-permissions:
      - forms.publish
    x-scope: tenant-org-unit-project
    description: "W4.05 (0.11.0-stage4, prototype publishForm, dialog «Опубликовать «{name}» vN?»): the draft of revision draftRevision becomes version N+1 (a question whose type changed gets the key «{key}-v{N}»), the form accepts responses (status published), the draft equals the new version. If-Match — Form.revision; a draft changed since — 412 revision_mismatch «Черновик изменил другой редактор — обновите страницу». Blocking issues — 422 validation_failed, detail «Найдено ошибок: N. Исправьте их в конструкторе.», violations (field — the question key or form, message — the text of issues(); the checks of api.js with their texts come first: «В форме нет ни одного вопроса», «У вопроса нет текста», «У вопроса «…» нет вариантов ответа», «Публичная форма не может спрашивать «…»: справочники CRM гостю не показываются», «Повторяется идентификатор вопроса …» — Q-W4.00-forms-4). Nothing changed — 409 invalid_transition, reason form_no_changes. A public form requires forms.publish_public as well (403). Answers the form (publishedVersionNumber — «Опубликована версия vN формы «…»»). Event forms.version.published.v1 (the owners — «Опубликована форма «…» vN. Старые ответы сохраняют свои версии»); rules keep their own versions."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control: *a1
        content:
          application/json:
            schema:
              $ref: ../components/forms/schemas.yaml#/Form
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "402":
        $ref: ../components/common/responses.yaml#/PlanRequired
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "412":
        $ref: ../components/common/responses.yaml#/PreconditionFailed
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
      - $ref: ../components/common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/forms/schemas.yaml#/FormPublishRequest
    x-permissions-mode: all

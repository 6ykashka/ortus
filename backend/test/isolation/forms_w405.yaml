# Матрица изоляции: «Формы и опросы» контракта 0.11.0-stage4 (W4.05, контрактный PR 4 этапа 4); хендлеры — W4.21
# (pending снят). Формы, черновики, версии, правила, ответы и группы — в области forms.* (форма — область формы:
# организация или подразделение; ответы — ещё «своё» и связь с объектом, Q-W4.00-forms-9); чужая организация — 404
# (AC-02), без сессии — 401. Содержимое фикстур (W4.21, content_forms.go): в обеих организациях группа «Проверки»
# (form_group:<t>.checks), форма «Осмотр машины» всей организации (form:<t>.insp, её v1 — form_version:<t>.insp) с
# правилом «уведомить» (form_rule:<t>.insp-notify) и принятым ответом водителя Москвы-1 (form_response:<t>.insp-1).
# Чужой id в пути (id организации B в пути организации A) — 404 и владельцу, как несуществующий; чужой id в теле, который
# контракт отклоняет как 422 (sourceFormId, groupId, versionId, nodeId правила «в БЗ», projectId и assigneeMemberId
# правила «задача»; в матрице нет статуса 422), и строки PublicForms (отозванная ссылка, строка индекса без пары в
# тенанте, токен A не ведёт в B — ссылку делают команды с If-Match) — в forms_w405_body_test.go (возврат 1 W4.21). Ключ
# вопроса — не UUID: в пути — литерал q-who. Команды с If-Match строки не передают If-Match (README, «Цель набора»): у
# них отказы до предусловия — без сессии 401, чужая организация 404. Отказы шлюза (403) — forms_w405_gate.yaml.
# Формат — README.md.
# После правки: go -C backend generate ./test/isolation
module: forms_w405
endpoints:

          minimum: 0
          format: int64
      required:
        - id
        - displayName
        - email
        - status
        - tenantCount
      description: Platform support metadata only; business content is inaccessible without separately audited break-glass access, not specified here.
    PlatformUserPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformUser"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 2048
      required:
        - items
        - nextCursor
      description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 100
          format: int64
        code:
          $ref: "#/components/schemas/ProblemCode"
        detail:
          type: string
        requestId:
          type: string
        violations:
          type: array
          items:

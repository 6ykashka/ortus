# Матрица изоляции: операции контракта 0.6.1-stage2 стюарда этапа 2 (W2.52) — до хендлеров W2.41, W2.42, W2.46, W2.50
# (pending: 501 или совпавший ответ шлюза; в строгом режиме -tags isolation_pending — красные до хендлера).
# Справочник категорий расходов (W2.41): читает любой с fleet.expenses.read (водитель — «своё»), правит владелец
# (modules.settings.manage). История машины (W2.42): машина вне области и машина другой организации — один 404,
# как несуществующая (AC-01); периоды чужих фирм не показываются. Импорт CSV машин (W2.50): предпросмотр в области
# fleet.vehicles.manage; чужой импорт и id другой сущности — 404. Чужая организация — 404, без сессии — 401.
# archiveExpenseCategory — буквальный код категории в пути (как ключ набора у queryDataset W2.08); отказы приходят до
# проверки If-Match. Выгрузка CSV (exportDataset, W2.50) «Расходов» — здесь, «Поездок» и «Автомобилей» —
# fleet_w252_export_trips.yaml, fleet_w252_export_vehicles.yaml (op в файле уникален); id записей в файл не попадают,
# поэтому положительные строки проверяют только absent. Положительных строк нет у команд с If-Match (moveVehicle,
# assignInspectionDefect, commitVehicleImport, archiveExpenseCategory): формат строк не передаёт If-Match — их
# проверяют integration-тесты модулей W2.41, W2.42, W2.46, W2.50. 422 (невидимая фирма импорта или перемещения)
# формат не выражает (статусы 200…409) — тоже integration-тесты.
# Отказы шлюза до хендлера — в fleet_w252_gate.yaml без pending. Формат — README.md.
# После правки: go -C backend generate ./test/isolation
module: fleet_w252
endpoints:
  - op: listExpenseCategories
    method: GET
    path: /api/v1/tenants/{tenantId}/fleet/expense-categories
    pending: W2.41
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
        note: справочник организации; данных другой организации нет
      - actor: a.driver-msk1
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
        note: водитель читает справочник для формы расхода (fleet.expenses.read «своё»)
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
  - op: createExpenseCategory
    method: POST
    path: /api/v1/tenants/{tenantId}/fleet/expense-categories
    pending: W2.41
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 201
        absent: [tenant:b]
        body: '{"label": "Изоляция W2.52", "commentRequired": false}'
        note: владелец добавляет категорию; код — следующий custom_N
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        body: '{"label": "Чужая организация", "commentRequired": false}'
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
        body: '{"label": "Без сессии", "commentRequired": false}'
  - op: archiveExpenseCategory
    method: POST
    path: /api/v1/tenants/{tenantId}/fleet/expense-categories/toll/archive
    pending: W2.41
    rows:
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        note: чужая организация — 404 до проверки If-Match
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
  - op: exportDataset
    method: POST
    path: /api/v1/tenants/{tenantId}/datasets/fleet.expenses/export
    pending: W2.50
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b, vehicle:b.msk1]
        body: '{"select": ["trip", "kind", "amount"], "filters": [], "sort": []}'
        note: владелец выгружает расходы своей организации; данных другой организации в файле нет
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        body: '{"select": ["trip", "amount"], "filters": [], "sort": []}'
        note: чужая организация — как несуществующая (AC-02)
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
        body: '{"select": ["trip", "amount"], "filters": [], "sort": []}'
  - op: listVehicleAssignments
    method: GET
    path: /api/v1/tenants/{tenantId}/fleet/vehicles/{vehicleId}/assignments
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, vehicleId: vehicle:a.msk1 }
        status: 200
        present: [unit:a.msk1, vehicle:a.msk1]
        absent: [unit:a.smr2, tenant:b]
        note: история машины своей фирмы (период переноса tenant 0016)
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, vehicleId: vehicle:a.smr2 }
        status: 404
        code: not_found
        absent: [unit:a.smr2]
        note: машина соседней области — как несуществующая (AC-01)
      - actor: a.manager-msk2
        params: { tenantId: tenant:a, vehicleId: vehicle:b.msk1 }
        status: 404
        code: not_found
        absent: [tenant:b]
        note: id другой организации в своей — как несуществующий (AC-02)
      - actor: a.owner
        params: { tenantId: tenant:a, vehicleId: vehicle:a.smr2 }
        status: 200
        present: [unit:a.smr2]
        absent: [tenant:b]
      - actor: b.owner
        params: { tenantId: tenant:a, vehicleId: vehicle:a.msk1 }
        status: 404
        absent: [tenant:a, vehicle:a.msk1]
      - actor: anonymous
        params: { tenantId: tenant:a, vehicleId: vehicle:a.msk1 }
        status: 401
  - op: moveVehicle
    method: POST
    path: /api/v1/tenants/{tenantId}/fleet/vehicles/{vehicleId}/assignments
    rows:
      - actor: b.owner
        params: { tenantId: tenant:a, vehicleId: vehicle:a.msk1 }
        status: 404
        absent: [tenant:a, vehicle:a.msk1]
        body: '{"orgUnitId": "{{unit:a.smr2}}", "reason": "Чужая организация"}'
      - actor: anonymous
        params: { tenantId: tenant:a, vehicleId: vehicle:a.msk1 }
        status: 401
        body: '{"orgUnitId": "{{unit:a.smr2}}", "reason": "Без сессии"}'
  - op: assignInspectionDefect
    method: POST
    path: /api/v1/tenants/{tenantId}/fleet/defects/{defectId}/assignment
    pending: W2.46
    rows:
      - actor: b.owner
        params: { tenantId: tenant:a, defectId: vehicle:a.msk1 }
        status: 404
        absent: [tenant:a]
        body: '{"assigneeMemberId": "{{person:a.manager-msk1@a}}", "dueAt": "2026-10-20T09:00:00Z"}'
        note: чужая организация — 404 до разбора тела
      - actor: anonymous
        params: { tenantId: tenant:a, defectId: vehicle:a.msk1 }
        status: 401
        body: '{"assigneeMemberId": "{{person:a.manager-msk1@a}}", "dueAt": "2026-10-20T09:00:00Z"}'
  - op: createVehicleImport
    method: POST
    path: /api/v1/tenants/{tenantId}/fleet/vehicle-imports
    pending: W2.50
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 201
        present: [unit:a.msk1]
        absent: [tenant:b, vehicle:b.msk1]
        body: '{"fileName": "isolation.csv", "csv": "registration_number;display_name;body_type;payload_kg;volume_m3;cargo_length_m;cargo_width_m;cargo_height_m;odometer_km\nИЗ 252 77;Изоляция;van;1000;10;3;2;2;0", "defaultOrgUnitId": "{{unit:a.msk1}}"}'
        note: предпросмотр в своей организации; машина тёзка другой организации не находится
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        body: '{"fileName": "foreign.csv", "csv": "registration_number\nИЗ 1", "defaultOrgUnitId": "{{unit:a.msk1}}"}'
      - actor: a.two-roles
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        absent: [vehicle:a.smr2]
        body: '{"fileName": "smr2.csv", "csv": "registration_number;display_name;body_type;payload_kg;volume_m3;cargo_length_m;cargo_width_m;cargo_height_m;odometer_km\nИЗ-202;Изоляция;van;1000;10;3;2;2;0", "defaultOrgUnitId": "{{unit:a.smr2}}"}'
        note: fleet.vehicles.manage только в Москве-1; Самару-2 видит наблюдателем — 403 хендлера, машина фирмы не раскрывается
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
        body: '{"fileName": "anonymous.csv", "csv": "registration_number\nИЗ 1", "defaultOrgUnitId": "{{unit:a.msk1}}"}'
  - op: getVehicleImport
    method: GET
    path: /api/v1/tenants/{tenantId}/fleet/vehicle-imports/{importId}
    pending: W2.50
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a, importId: vehicle:a.msk1 }
        status: 404
        code: not_found
        note: id другой сущности — как несуществующий импорт
      - actor: b.owner
        params: { tenantId: tenant:a, importId: vehicle:a.msk1 }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a, importId: vehicle:a.msk1 }
        status: 401
  - op: commitVehicleImport
    method: POST
    path: /api/v1/tenants/{tenantId}/fleet/vehicle-imports/{importId}/commit
    pending: W2.50
    rows:
      - actor: b.owner
        params: { tenantId: tenant:a, importId: vehicle:a.msk1 }
        status: 404
        absent: [tenant:a]
        body: '{"skipInvalidRows": true}'
      - actor: anonymous
        params: { tenantId: tenant:a, importId: vehicle:a.msk1 }
        status: 401
        body: '{"skipInvalidRows": true}'

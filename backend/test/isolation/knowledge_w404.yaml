        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
  - op: updateKnowledgeSpace
    method: PATCH
    path: /api/v1/tenants/{tenantId}/knowledge/spaces/{spaceId}
    pending: W4.31
    rows:
      - actor: b.owner
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: '{"access": "limited", "dryRun": true}'
        note: правка пространства чужой организации — 404 до предусловия If-Match
      - actor: anonymous
        params: { tenantId: tenant:a, spaceId: tenant:missing }
        status: 401
        body: '{"access": "limited", "dryRun": true}'
  - op: getKnowledgeSpaceTree

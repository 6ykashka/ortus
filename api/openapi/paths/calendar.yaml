# Контракт Ортус · тег Calendar: пути и операции. Пишет только стюард контракта (план v2 §3.5).
/api/v1/tenants/{tenantId}/calendar/availability:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  post:
    operationId: findCalendarAvailability
    tags:
      - Calendar
    summary: Find advisory slots satisfying all resources
    x-permissions:
      - calendar.availability.read
    x-scope: tenant-org-unit-self
    description: Advisory only. Exposes busy/free within allowed resources; private titles/details require separate read grants. Server-confirmed booking must recheck all resources atomically.
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/calendar/schemas.yaml#/AvailabilityResult
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/calendar/schemas.yaml#/AvailabilityQuery
    x-permissions-mode: all

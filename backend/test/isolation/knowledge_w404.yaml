    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
        note: поиск — только по своей организации
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401

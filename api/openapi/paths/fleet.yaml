    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listInspectionDefects
    tags:
      - Fleet
    summary: List inspection defects, the blocking defect queue of the manager
    x-permissions:
      - fleet.inspections.review
    x-scope: responsible-manager-or-owner
    description: "W2.00 (0.5.0-stage2, S2-17). Queue of fleet.defects for the responsible manager or owner: state=in_review gives blocking defects waiting for a decision, oldest first. Filtered by the scope of the vehicle and the trip before pagination."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/fleet/schemas.yaml#/InspectionDefectPage
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Cursor
      - $ref: ../components/common/parameters.yaml#/Limit
      - name: state
        in: query
        required: false
        description: "Only defects in these states (repeat the parameter)."
        style: form
        explode: true
        schema:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            enum:
              - open
              - in_review
              - resolved
              - confirmed_out_of_service
      - name: vehicleId
        in: query
        required: false
        description: "Only defects of this vehicle."
        schema:
          $ref: ../components/common/schemas.yaml#/Id
      - name: tripId
        in: query
        required: false
        description: "Only defects of this trip."
        schema:
          $ref: ../components/common/schemas.yaml#/Id
    x-permissions-mode: all

  payload_too_large:
    status: 413
    title: Превышен размер
    ui: Лимит в тексте
    retryable: false
    source: 12:63
  validation_failed:
    status: 422
    title: Ошибки полей
    ui: Ошибки у полей из `violations`
    retryable: false

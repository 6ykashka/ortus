        - measuredAt
        - consistency
        - writeStatus
      description: "Only one billable total: committedBytes + reservedBytes. Bucket values explain this total and are not added twice. Billing policy/version defines backups and replica exclusion. Enforcement uses transactional reservations plus reconciliation; displayed database size is an estimate."

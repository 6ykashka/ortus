# Ортус CRM — конвейер CI (W0.04, план v2 §4 «Этап 0», шаг 0.5 · S0-02).
# Порядок job — design/docs/14-engineering.md «Конвейер CI» без деплоя:
#   lint → contract → unit → integration → isolation → build → e2e
# Шаги и их охрана живут в tools/ci/pipeline.mjs: workflow только ставит инструменты и вызывает
# `node tools/ci/pipeline.mjs --job <id>`. Локально то же самое: `corepack pnpm run ci:local`.
# Шаг без цели (OpenAPI, миграций, gen, изоляции, Playwright, Dockerfile) печатает «пропуск» с
# владельцем; job isolation падает, если эндпоинты есть, а набора изоляции нет (блокирующая).
# Менять этот файл — только интегратор (план §3.5). Сторонние action — по полному SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.13.2
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  HUSKY: "0"
  SCARF_ANALYTICS: "false"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint (prettier, eslint, golangci-lint, actionlint, spectral)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/pipeline.mjs --job lint

  contract:
    name: contract (openapi, permissions, migrations, codegen drift)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/pipeline.mjs --job contract

  unit:
    name: unit (check-icu, typecheck, test)
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/pipeline.mjs --job unit

  integration:
    name: integration (testcontainers)
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/pipeline.mjs --job integration

  isolation:
    name: isolation + concurrency (блокирующая)
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/pipeline.mjs --job isolation

  build:
    name: build (пакеты, go build, образы)
    needs: isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/pipeline.mjs --job build

  e2e:
    name: e2e (Playwright, режим mock)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node tools/ci/pipeline.mjs --job e2e
      - name: отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/apps/web/playwright-report/
            frontend/apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

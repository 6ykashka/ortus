# Реестр кодов ошибок Ортус (W0.07). Источник: docs/12-errors-and-events.md версии 14.10, «Реестр кодов»
# (source: 12:<строка>), и PD-34 плана (source: PD-34). Пишет только стюард контракта, раздел — только добавление.
# Порядок codes = порядок enum ProblemCode (api/openapi/components/errors/schemas.yaml генерируется отсюда).
# Поля кода: status — HTTP; title — колонка «Когда»; ui — «Что делает интерфейс» (дословно); retryable — можно
# повторить с тем же Idempotency-Key после Retry-After; source — откуда код.
# client_states — состояния без HTTP-ответа (не входят в enum). prototype_codes — коды ApiError прототипа 14.10 →
# канон (список — зависит от операции). openapi_0_1_aliases — коды из описаний OpenAPI 0.1 вне реестра → канон.
version: "0.2"
codes:
  malformed_request:
    status: 400
    title: Неразбираемый JSON, неверный параметр
    ui: Общая ошибка, не повторять
    retryable: false
    source: "12:30"
  unknown_field:
    status: 400
    title: В теле поле, которого нет в DTO
    ui: Ошибка разработки, логировать
    retryable: false
    source: "12:31"
  session_expired:
    status: 401
    title: Нет или истекла сессия
    ui: Перелогин с возвратом на экран
    retryable: false
    source: "12:32"
  feature_requires_plan:
    status: 402
    title: Функция недоступна по тарифу
    ui: Владельцу — «Продлить», остальным — «Обратитесь к владельцу»
    retryable: false
    source: "12:33"
  forbidden_action:
    status: 403
    title: Нет действия ни в одной роли
    ui: AccessGate «Нет права»
    retryable: false
    source: "12:34"
  module_not_installed:
    status: 403
    title: Модуль не подключён
    ui: AccessGate «Модуль не подключён»
    retryable: false
    source: "12:35"
  module_read_only:
    status: 403
    title: Модуль в draining/read_only
    ui: Баннер «Только чтение»
    retryable: false
    source: "12:36"
  tenant_read_only:
    status: 403
    title: Тенант в read_only
    ui: Баннер, разрешены чтение и экспорт
    retryable: false
    source: "12:37"
  tenant_suspended:
    status: 403
    title: Тенант приостановлен
    ui: Экран блокировки
    retryable: false
    source: "12:38"
  function_blocked:
    status: 403
    title: Функция `driver` закрывает действие
    ui: Не показывать пункт; при прямом вызове — общий отказ
    retryable: false
    source: "12:39"
  csrf_failed:
    status: 403
    title: Нет или неверен CSRF/Origin
    ui: Перезагрузить страницу
    retryable: false
    source: "12:40"
  origin_not_allowed:
    status: 403
    title: Нет или неверен CSRF/Origin
    ui: Перезагрузить страницу
    retryable: false
    source: "12:40"
  not_found:
    status: 404
    title: Нет объекта или он вне области
    ui: Одинаково для чужих и несуществующих ID
    retryable: false
    source: "12:41"
  reservation_overlap:
    status: 409
    title: Интервал занят
    ui: Конфликт брони, «Обновить список»
    retryable: true
    source: "12:42"
  resources_unavailable:
    status: 409
    title: Не весь комплект ресурсов свободен
    ui: Список недоступных без чужих деталей
    retryable: true
    source: "12:43"
  reservation_expired:
    status: 409
    title: Hold истёк до выезда
    ui: «Бронь истекла, забронируйте снова»
    retryable: false
    source: "12:44"
  vehicle_incompatible:
    status: 409
    title: Не проходит масса/объём/длина/температура
    ui: Причины по проверкам
    retryable: false
    source: "12:45"
  inspection_incomplete:
    status: 409
    title: Нет обязательных фото/пунктов
    ui: Список недостающего
    retryable: false
    source: "12:46"
  blocking_defect_open:
    status: 409
    title: Открыт блокирующий дефект
    ui: «Выезд заблокирован, ждёт менеджера»
    retryable: false
    source: "12:47"
  photo_not_ready:
    status: 409
    title: Файл не в состоянии ready
    ui: Показать статус загрузки
    retryable: false
    source: "12:48"
  invalid_transition:
    status: 409
    title: Переход статуса не разрешён
    ui: Перечитать объект
    retryable: false
    source: "12:49"
    # W4.02 (0.7.0-stage4): Problem.reason — машиночитаемая причина внутри кода. Поля причины: title — когда,
    # ui — текст прототипа дословно (если есть), source — откуда. Список — только добавление.
    reasons:
      not_in_status:
        title: Задача уже не в статусе, из которого идёт переход
        source: tasks.md §2.4 (trCheck, hide); Q-W4.00-tasks-12
      checklist_open:
        title: Переход требует закрытого чек-листа
        ui: Сначала закройте чек-лист
        source: tasks.md §2.4; models.js trCheck; Q-W4.00-tasks-12
      children_open:
        title: Переход требует завершённых подзадач
        ui: "Сначала завершите подзадачи: {ids}"
        source: tasks.md §2.4; models.js trCheck; Q-W4.00-tasks-12
        note: "{ids} — только подзадачи, которые актор видит; скрытые подзадачи reason и detail не называют (если видимых открытых нет — текст без списка). Реализует W4.11 (Q-W4.02-8)."
      author_forbidden:
        title: Автор задачи не выполняет и не согласует этот переход
        ui: Автор задачи не может выполнить этот переход
        source: tasks.md §2.4; models.js trCheck («Вы автор задачи — свою согласовать нельзя» — при согласовании); Q-W4.00-tasks-12
      already_voted:
        title: Участник уже согласовал переход, ждём остальных
        ui: Вы уже согласовали, ждём остальных
        source: tasks.md §2.4; models.js trCheck; Q-W4.00-tasks-12
      doc_route:
        title: Задача — зеркало маршрута документа, переходит только вместе с ним
        source: tasks.md §2.4; Q-W4.00-documents-3
      form_version_changed:
        title: Ответ отправлен по устаревшей версии формы
        source: openapi_0_1_aliases.form_version_changed; forms.md §2.4
      workflow_exists:
        title: У проекта уже есть процесс — «Настроить процесс» не нужен
        source: W4.03; tasks.md §1.3 «Шапка проекта», TP-06 (initTaskProjectWorkflow)
      funnel_fixed:
        title: Воронка «Заявки» — этапы фиксированы, процесса с версиями, уровня доступа и автоматизации у неё нет
        source: W4.03; tasks.md Р-23, Q-W4.00-tasks-15 (старая доска, W4.13)
      # W4.05 (0.11.0-stage4): «Формы и опросы» (forms.md §2.4).
      form_draft_flow:
        title: Устаревшие createFormVersion и publishFormVersion — версии создаёт публикация черновика (publishForm)
        source: W4.05; forms.md §2.2, Q-W4.00-forms-1
      form_not_published:
        title: У формы ещё нет опубликованной версии — отменить изменения, закрыть или возобновить приём нельзя
        ui: У формы ещё нет опубликованной версии
        source: W4.05; api.js:583 (discardFormDraft); forms.md §2.4
      form_no_changes:
        title: Черновик совпадает с действующей версией — публиковать нечего
        source: W4.05; dc:799 (кнопка «Опубликовано» неактивна без изменений)
      form_closed:
        title: Приём ответов закрыт — вручную, по сроку «Принимать до», по лимиту ответов или с отключением модуля формы
        ui: Приём ответов закрыт
        source: W4.05; forms.md §2.4, Q-W4.00-forms-16, Q-W4.00-forms-19, Q-W4.00-forms-25
      form_already_answered:
        title: Сотрудник уже отвечал на форму с настройкой «Один ответ от сотрудника»
        ui: Вы уже отвечали на эту форму
        source: W4.05; Q-W4.00-forms-25
      form_group_not_empty:
        title: В группе форм есть формы — удаляется только пустая группа
        source: W4.05; forms.md §1.2 «Удалить пустую группу», Q-W4.00-forms-7
      form_rule_disabled:
        title: Действие после ответа выключено — перенос прошлых ответов недоступен
        ui: Действие выключено — включите его, чтобы перенести ответы
        source: W4.05; api.js:850 (backfillKbRule)
      form_rule_deleted:
        title: Действие удалено из формы — повторить его для ответа нельзя
        ui: Действие удалено из формы — повторить нельзя
        source: W4.05; api.js:860 (retryFormAction)
      form_no_responses:
        title: У формы нет ответов, которые участник может прочитать, — выгружать нечего
        ui: Ответов пока нет
        source: W4.05; dc:798 («Выгрузить ответы в CSV» без ответов)
      insufficient_stock:
        title: На складе недостаточно материала (остаток или резерв)
        ui: Не хватает материала на складе
        source: "W5.00; склад, касса (analysis/dor/cash.md §2.4)"
      lot_expired:
        title: Партия с истёкшим сроком годности
        ui: Срок годности партии истёк
        source: "W5.00; склад, касса (analysis/dor/cash.md §2.4)"
      reservation_not_active:
        title: Резерв уже снят или израсходован
        source: "W5.00; склад, касса (analysis/dor/cash.md §2.4)"
      shift_not_open:
        title: У кассы нет открытой смены
        ui: Смена не открыта
        source: "W5.00; склад, касса (analysis/dor/cash.md §2.4)"
      transfer_decided:
        title: Перемещение уже принято или отклонено
        ui: Перемещение уже принято
        source: "W5.00; склад, касса (analysis/dor/cash.md §2.4)"
      # W6.00 (0.12.0-stage6): «Ремонт и стройка» (repair.md §2.4).
      foreman_already_assigned:
        title: У объекта уже есть прораб
        ui: "Прораб уже назначен: {имя}"
        source: "W6.00; api.js:921 (assignForeman)"
      work_log_already_reviewed:
        title: Отметка уже принята или возвращена
        ui: "Отметка уже обработана"
        source: "W6.00; api.js:913 (acceptWorkLog)"
      project_handed_over:
        title: Объект сдан — новые отметки, допработы и правки закрыты
        ui: "Объект сдан: новые отметки не принимаются"
        source: "W6.00; api.js:899–907, 935–942; Q-W4.00-repair-21"
      schedule_stage_locked:
        title: Начавшийся или выполненный этап не сдвигается
        source: "W6.00; design/docs/19 «Правила графика»"
      repair_stock_insufficient:
        title: На складе или на объекте нет нужного остатка — в минус не уходим
        source: "W6.00; design/docs/19 «Снабжение»; Q-W4.00-repair-18"
      repair_project_not_draft:
        title: Операция только для объекта-черновика (до договора)
        source: "W6.00; repair.md §2.2 (activateRepairProject)"
      repair_estimate_not_approved:
        title: Нет согласованной версии сметы — объект не активируется, график не строится
        source: "W6.00; Q-W4.00-repair-16"
      repair_act_not_signed:
        title: Акт ещё не подписан заказчиком — начисления и сдача закрыты
        ui: "Начисление откроется после подписания акта заказчиком"
        source: "W6.00; Ремонт и стройка.dc.html:560–575"
      repair_document_state:
        title: Документ не в том состоянии для операции (подпись запрашивают у черновика)
        source: "W6.00; repair.md §2.2 (requestDocumentSignature)"
      repair_supply_state:
        title: Заявка снабжения не в том состоянии для операции
        source: "W6.00; design/docs/19 «Снабжение»"
      repair_purchase_state:
        title: Закупка уже получена
        source: "W6.00; design/docs/19 «Снабжение»"
  separation_of_duties_conflict:

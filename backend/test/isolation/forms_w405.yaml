# Матрица изоляции: «Формы и опросы» контракта 0.11.0-stage4 (W4.05, контрактный PR 4 этапа 4) — до хендлеров W4.21
# (тег Forms в cmd/api — 501 целиком; pending: 501 или совпавший ответ шлюза; в строгом режиме -tags isolation_pending —
# красные до хендлера). Формы, черновики, версии, правила, ответы и группы — в области forms.* (форма — область формы:
# организация или подразделение; ответы — ещё «своё» и связь с объектом, Q-W4.00-forms-9); чужая организация — 404
# (AC-02), без сессии — 401. Строк forms.* в фикстурах нет: положительные строки — списки владельца без другого тенанта,
# по id — «нет такого объекта» (tenant:missing) — 404 и владельцу. Ключ вопроса — не UUID: в пути — литерал q-who.
# Команды с If-Match строки не передают If-Match (README, «Цель набора»): у них отказы до предусловия — без сессии 401,
# чужая организация 404. Отказы шлюза (403) — forms_w405_gate.yaml. W4.21 с фикстурами forms.* тенанта B дописывает
# строки «id формы, версии, правила, ответа, группы организации B в пути организации A → 404» и «чужой id в теле»
# (sourceFormId, groupId, versionId, nodeId и tableId правила «в БЗ», projectId и assigneeMemberId правила «задача»).
# Формат — README.md.
# После правки: go -C backend generate ./test/isolation

    x-permissions-mode: all
/api/v1/tenants/{tenantId}/forms/{formId}/draft:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
    - $ref: ../components/common/parameters.yaml#/formId
  get:
    operationId: getFormDraft

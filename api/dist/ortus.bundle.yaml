              - driver
              - practitioner
              - foreman
              - manager
          uniqueItems: true
      description: Cannot remove/suspend the last active business owner. Suspension revokes sessions/capability caches and reservations according to policy. Changing workProfiles requires delegated members.manage and validation of effective direct/group roles. The driver work profile is incompatible with any earnings grant anywhere in this tenant; driver self-service operations require that profile. A mere driving qualification does not set this profile.
    ModuleAvailability:
      type: object
      additionalProperties: false
      properties:
        moduleKey:
          type: string
        state:
          type: string
          enum:
            - uninstalled
            - active
            - draining
            - read_only
            - disabled
            - suspended
        accessMode:
          type: string
          enum:
            - none
            - read
            - write
            - finish_only
        reason:
          type: string
          enum:
            - available
            - not_installed
            - disabled
            - plan_expired
            - permission_denied
            - tenant_suspended
            - draining
      required:
        - moduleKey
        - state
        - accessMode
        - reason
    ModuleCatalog:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModuleManifest"
      required:
        - items
    ModuleDeactivationItem:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - active_process
            - form_intake
            - automation
          description: active_process — a started process that can be finished after disabling (trip, visit, work log); form_intake — a form whose new responses stop; automation — a rule that pauses.
        object:
          $ref: "#/components/schemas/ObjectRef"
        title:
          type: string
          maxLength: 200
          description: Short title from the owning module (trip number, form name and version, rule name).
        state:
          type: string
          pattern: ^[a-z][a-z_]{1,39}$
          description: Module state code of the object (in_progress, submitted, published, enabled); the client labels it from the module dictionary.
        assigneeName:
          type: string
          maxLength: 200
          description: Person responsible for an active process (driver, specialist), when the module has one.
        effect:
          type: string
          enum:
            - finish_allowed
            - paused
            - closed
      required:
        - kind
        - object
        - title
        - state
        - effect
    ModuleDeactivationPreview:
      type: object
      additionalProperties: false
      properties:
        moduleKey:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,49}$
        retainedAccess:
          type: string
          enum:
            - history_read
            - owner_export
          description: What setModuleInstallation with enabled=false keeps by default (history_read).
        activeItems:
          type: array
          items:
            $ref: "#/components/schemas/ModuleDeactivationItem"
          maxItems: 50
        hiddenCount:
          type: integer
          minimum: 0
          format: int64
          description: Items beyond the listed 50.
        generatedAt:
          $ref: "#/components/schemas/Instant"
      required:
        - moduleKey
        - retainedAccess
        - activeItems
        - hiddenCount
        - generatedAt
      description: Empty activeItems is the prototype line Активных процессов нет. The fixed consequences of the dialog (new operations close, history and grants are kept, the module group leaves the menu — D-23 of the kit, комплект) are client texts, not part of this response.
    ModuleInstallationUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          maxLength: 500
        retainedAccess:
          type: string
          enum:
            - history_read
            - owner_export
      required:
        - enabled
      description: "Enable requires eligibility and dependencies. When enabled=false, retainedAccess defaults to history_read: first draining for active processes, then read_only historical access. Explicit owner_export requests fully disabled state after draining. Both retain data and dormant write grants; fully disabled blocks ordinary APIs/datasets but permits a separately authorized owner export. Core modules cannot be uninstalled."
    ModuleManifest:
      type: object
      additionalProperties: false
      properties:
        moduleKey:
          type: string
        version:
          type: string
        name:
          type: string
        dependencies:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        datasets:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
            - uninstalled
            - active
            - draining
            - read_only
            - disabled
            - suspended
        revision:
          type: integer
          minimum: 1
          format: int64
      required:
        - moduleKey
        - version
        - name
        - dependencies
        - permissions
        - datasets
        - state
        - revision
      description: Registry-provided trusted manifests. A tenant cannot upload arbitrary executable modules in v0.1.
    ModuleSettings:
      oneOf:
        - $ref: "#/components/schemas/LogisticsSettings"
        - $ref: "#/components/schemas/SpaSettings"
        - $ref: "#/components/schemas/FormsSettings"
        - $ref: "#/components/schemas/TasksSettings"
      discriminator:
        propertyName: moduleKey
        mapping:
          fleet: "#/components/schemas/LogisticsSettings"
          spa: "#/components/schemas/SpaSettings"
          forms: "#/components/schemas/FormsSettings"
          tasks: "#/components/schemas/TasksSettings"
      description: Typed settings for the first four configurable modules. Path moduleKey must match body moduleKey. Additional modules add named schema branches before release.
    Money:
      type: object
      additionalProperties: false
      properties:
        amountMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Minor currency units, within the exact JSON/JavaScript integer range. Domain totals above this bound are rejected; server calculations use checked integers/decimal.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code.
      required:
        - amountMinor
        - currency
    MoneyValue:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: money
        value:
          $ref: "#/components/schemas/Money"
      required:
        - type
        - value
    Notification:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        tenantId:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
          description: Source event type without the version suffix (fleet.trip.submitted, members.invitation.accepted).
        severity:
          type: string
          enum:
            - info
            - warning
            - critical
        title:
          type: string
          minLength: 1
          maxLength: 300
        body:
          type: string
          maxLength: 2000
        object:
          $ref: "#/components/schemas/ObjectRef"
        link:
          type: string
          maxLength: 512
          pattern: ^/(?:[^/\\\s\x00-\x1f\x7f][^\\\s\x00-\x1f\x7f]*)?$
          description: Same-origin relative application path (same rule as startLogin returnTo — single leading /, no backslash, whitespace or control characters; tenant 0003 enforces it with a CHECK); the target is authorized again when opened.
        createdAt:
          $ref: "#/components/schemas/Instant"
        readAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - tenantId
        - kind
        - severity
        - title
        - createdAt
        - readAt
      description: Payload carries no restricted fields (earnings, personal data beyond the display name).
    NotificationCounter:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: "#/components/schemas/Id"
        unreadCount:
          type: integer
          minimum: 0
          format: int64
      required:
        - tenantId
        - unreadCount
    NotificationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 2048
        unreadCount:
          type: integer
          minimum: 0
          format: int64
      required:
        - items
        - nextCursor
        - unreadCount
      description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
    NotificationReadRequest:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: "#/components/schemas/Id"
        notificationIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          minItems: 1
          maxItems: 200
          uniqueItems: true
        upTo:
          $ref: "#/components/schemas/Instant"
      required:
        - tenantId
      minProperties: 2
      maxProperties: 2
      description: Exactly one of notificationIds and upTo, enforced by the schema (tenantId is required, no other properties are allowed, and the object has exactly two properties); a violation is 422 validation_failed. Expressed without oneOf so that generated Go and TypeScript types stay a plain struct.
    NotificationSummary:
      type: object
      additionalProperties: false
      properties:
        totalUnread:
          type: integer
          minimum: 0
          format: int64
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/NotificationTenantSummary"
      required:
        - totalUnread
        - tenants
    NotificationTenantSummary:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: "#/components/schemas/Id"
        unreadCount:
          type: integer
          minimum: 0
          format: int64
        latestAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - tenantId
        - unreadCount
        - latestAt
    NullValue:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: "null"
        value:
          type: "null"
      required:
        - type
        - value
    ObjectRef:
      type: object
      additionalProperties: false
      properties:
        moduleKey:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,49}$
        entityType:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        entityId:
          $ref: "#/components/schemas/Id"
      required:
        - moduleKey
        - entityType
        - entityId
      description: Server verifies same-tenant ownership and target visibility. A reference never grants access.
    OrgUnit:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        parentId:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
            - region
            - company
            - branch
            - team
        status:
          type: string
          enum:
            - active
            - archived
        revision:
          type: integer
          minimum: 1
          format: int64
      required:
        - id
        - parentId
        - name
        - kind
        - status
        - revision
    OrgUnitCreate:
      type: object
      additionalProperties: false
      properties:
        parentId:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 150
        kind:
          type: string
          enum:
            - region
            - company
            - branch
            - team
      required:
        - parentId
        - name
        - kind
    OrgUnitMoveImpact:
      type: object
      additionalProperties: false
      properties:
        memberId:
          $ref: "#/components/schemas/Id"
        displayName:
          type: string
        change:
          type: string
          enum:
            - gains
            - loses
          description: gains — a new ancestor assignment starts covering the moved subtree; loses — an old ancestor assignment stops covering it. A person with both appears twice.
        roleId:
          $ref: "#/components/schemas/Id"
        assignmentId:
          $ref: "#/components/schemas/Id"
      required:
        - memberId
        - displayName
        - change
        - roleId
        - assignmentId
    OrgUnitMovePreview:
      type: object
      additionalProperties: false
      properties:
        orgUnitId:
          $ref: "#/components/schemas/Id"
        fromParentId:
          type:
            - string
            - "null"
          format: uuid
        toParentId:
          type:
            - string
            - "null"
          format: uuid
        descendantUnitCount:
          type: integer
          minimum: 0
          format: int64
        memberCount:
          type: integer
          minimum: 0
          format: int64
          description: Members whose home units are inside the moved subtree.
        assignmentsLosingScope:
          type: integer
          minimum: 0
          format: int64
        assignmentsGainingScope:
          type: integer
          minimum: 0
          format: int64
        affectedPeople:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnitMoveImpact"
          maxItems: 50
          description: "People the actor can see with members.read: one entry per person and assignment whose coverage changes; a person with several such assignments appears once per assignment."
        hiddenCount:
          type: integer
          minimum: 0
          format: int64
          description: Number of distinct people (memberId), not assignments, affected by the move but not shown in affectedPeople — outside the actor scope or with all their entries beyond the 50 listed. A person with several assignments outside the scope counts once.
      required:
        - orgUnitId
        - fromParentId
        - toParentId
        - descendantUnitCount
        - memberCount
        - assignmentsLosingScope
        - assignmentsGainingScope
        - affectedPeople
        - hiddenCount
      description: Assignments scoped directly to the moved unit or inside it move with it and are not counted.
    OrgUnitPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnit"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 2048
      required:
        - items
        - nextCursor
      description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
    OrgUnitPatch:
      type: object
      additionalProperties: false
      properties:
        parentId:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 150
        status:
          type: string
          enum:
            - active
            - archived
      description: Tree moves require authorization over old and new branches and must not create cycles.
    Owner:
      type: object
      additionalProperties: false
      properties:
        memberId:
          $ref: "#/components/schemas/Id"
        displayName:
          type: string
        email:
          type: string
          format: email
        since:
          $ref: "#/components/schemas/Instant"
      required:
        - memberId
        - displayName
        - email
        - since
    OwnerList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Owner"
          minItems: 1
      required:
        - items
      description: At least one active owner always exists (AUTH-08).
    OwnershipTransferCreate:
      type: object
      additionalProperties: false
      properties:
        toMemberId:
          $ref: "#/components/schemas/Id"
        keepCurrentOwner:
          type: boolean
          description: true — add a co-owner; false — the actor stops being an owner in the same transaction.
        confirmation:
          type: string
          maxLength: 254
          description: E-mail of the target member typed by the owner; compared case-insensitively.
        reason:
          type: string
          minLength: 5
          maxLength: 500
      required:
        - toMemberId
        - keepCurrentOwner
        - confirmation
        - reason
    PeopleImport:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        state:
          type: string
          enum:
            - previewed
            - committed
            - expired
        fileName:
          type: string
        defaultOrgUnitId:
          $ref: "#/components/schemas/Id"
        totals:
          $ref: "#/components/schemas/PeopleImportTotals"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PeopleImportRow"
          maxItems: 2000
        createdAt:
          $ref: "#/components/schemas/Instant"
        expiresAt:
          $ref: "#/components/schemas/Instant"
        committedAt:
          $ref: "#/components/schemas/Instant"
        rowsPurgedAt:
          $ref: "#/components/schemas/Instant"
        revision:
          type: integer
          minimum: 1
          format: int64
      required:
        - id
        - state
        - fileName
        - defaultOrgUnitId
        - totals
        - rows
        - createdAt
        - expiresAt
        - revision
      description: Preview and result of a CSV import of people (S1-10). The raw file is not stored; rows keep only parsed values and errors. Personal data is minimised (152-FZ). An uncommitted preview is deleted with its rows after expiresAt (24 hours). After commit the parsed rows are kept for 30 days for the result view, then deleted; the import keeps fileName, totals and the audit trail, rows becomes empty and rowsPurgedAt is set.
    PeopleImportCommit:
      type: object
      additionalProperties: false
      properties:
        skipInvalidRows:
          type: boolean
        sendInvitations:
          type: boolean
      required:
        - skipInvalidRows
        - sendInvitations
    PeopleImportCreate:
      type: object
      additionalProperties: false
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        csv:
          type: string
          minLength: 1
          maxLength: 1048576
          description: UTF-8 CSV text with a header row; delimiter , or ; is detected from the header.
        defaultOrgUnitId:
          $ref: "#/components/schemas/Id"
      required:
        - fileName
        - csv
        - defaultOrgUnitId
    PeopleImportRow:
      type: object
      additionalProperties: false
      properties:
        line:
          type: integer
          minimum: 2
          format: int64
          description: Line number in the file (the header is line 1).
        action:
          type: string
          enum:
            - create
            - update
            - skip
            - error
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        orgUnitId:
          $ref: "#/components/schemas/Id"
        workProfile:
          type: string
          enum:
            - driver
            - practitioner
            - foreman
            - manager
        memberId:
          $ref: "#/components/schemas/Id"
          description: Matched or created member; returned only for people within the actor scope (members.manage over their home unit). A match outside the scope is a row error that names neither the person nor the memberId.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemViolation"
      required:
        - line
        - action
        - errors
    PeopleImportTotals:
      type: object
      additionalProperties: false
      properties:
        rows:
          type: integer
          minimum: 0
          format: int64
        create:
          type: integer
          minimum: 0
          format: int64
        update:
          type: integer
          minimum: 0
          format: int64
        skip:
          type: integer
          minimum: 0
          format: int64
        error:
          type: integer
          minimum: 0
          format: int64
        invited:
          type: integer
          minimum: 0
          format: int64
      required:
        - rows
        - create
        - update
        - skip
        - error
        - invited
    Permission:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_.]+$
        moduleKey:
          type: string
        description:
          type: string
        allowedScopeKinds:
          type: array
          items:
            type: string
            enum:
              - tenant
              - org_unit
              - project
              - self
              - resource_pool
        sensitivity:
          type: string
          enum:
            - standard
            - personal
            - financial
      required:
        - key
        - moduleKey
        - description
        - allowedScopeKinds
        - sensitivity
    PlatformAuditActor:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - operator
            - owner
            - system
        accountId:
          $ref: "#/components/schemas/Id"
        displayName:
          type: string
          maxLength: 200
          description: Display name at the time of the action; absent for system actions.
      required:
        - kind
      description: Who acted. accountId is the accounts.id of an operator or owner; system rows (billing scheduler, provisioner) have neither accountId nor displayName.
    PlatformAuditEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Monotonic row id (platform_audit.id); also the order of rows with equal at.
        at:
          $ref: "#/components/schemas/Instant"
        action:
          type: string
          pattern: ^[a-z][a-z_]*(\.[a-z][a-z_]*)+$
          maxLength: 80
          examples:
            - tenant.suspended
            - tenant.resumed
            - subscription.trial_extended
            - subscription.trial_ended
            - tenant.created
            - storage.quota_changed
          description: Open set of dotted action codes; the client shows unknown codes as a generic line.
        actor:
          $ref: "#/components/schemas/PlatformAuditActor"
        target:
          $ref: "#/components/schemas/PlatformAuditTarget"
        reason:
          type: string
          maxLength: 500
        result:
          type: string
          enum:
            - ok
            - denied
            - failed
        details:
          type: object
          additionalProperties:
            type: string
            maxLength: 200
          maxProperties: 20
          description: Scalar parameters of the action as strings, numbers in decimal (days, trialEndsAt, quotaBytes, fromStatus, toStatus). Never business content of a tenant and never restricted fields.
      required:
        - id
        - at
        - action
        - actor
        - target
        - result
      description: One row of platform_audit (control DB). Rows are append-only.
    PlatformAuditPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformAuditEvent"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 2048
      required:
        - items
        - nextCursor
      description: Newest first. Opaque cursor is bound to the operator, the filter and the sort.
    PlatformAuditTarget:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - tenant
            - subscription
            - account
            - operator
            - price_book
        id:
          $ref: "#/components/schemas/Id"
        tenantId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          maxLength: 200

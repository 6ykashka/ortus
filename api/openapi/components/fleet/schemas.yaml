    - stops
    - revision
  description: "W2.00 (0.5.0-stage2, Q-45). A trip from planning to acceptance — one fleet.trips row in any TripState. The 0.1 Trip is the operational projection of the same row after startTrip: same id, same revision and ETag, so returnTrip and reviewTrip take the If-Match of either. No earnings, payroll totals or derived salary values (AC-05): earnings are read only through the Earnings tag. Absent optional fields mean not assigned yet (driver, vehicle, reservation, inspections, defect, review)."
TripPlanCreate:
  type: object
  additionalProperties: false
  properties:
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
    title:
      type: string
      minLength: 1
      maxLength: 200
    plannedWindow:
      $ref: ../common/schemas.yaml#/TimeWindow
    distanceKm:
      $ref: ../common/schemas.yaml#/Quantity
    cargo:
      $ref: ./schemas.yaml#/TripCargo
    stops:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: ./schemas.yaml#/TripStop
    driverMemberId:
      $ref: ../common/schemas.yaml#/Id
  required:
    - orgUnitId
    - title
    - plannedWindow
    - cargo
    - stops
  description: Planned trip (S2-13). The server assigns the number, validates stop order and per-leg load (mass and volume separately, never below zero) and the driver (active member with the driver work profile in scope). The vehicle is assigned later by assignTripVehicle or the driver reservation.
TripPlanPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/TripPlan
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
TripVehicleAssignment:
  type: object
  additionalProperties: false
  properties:
    vehicleId:
      $ref: ../common/schemas.yaml#/Id
    alternativeVehicleId:
      $ref: ../common/schemas.yaml#/Id
      description: "W2.71 (0.6.3-stage2, S2-20 rule 9, Q-W2.70-6). A second vehicle offered to the driver of the trip: the server holds vehicleId (offerKind host) and alternativeVehicleId (offerKind usual) for the trip window as one offer (offerGroupId; offeredTo — the driver of the trip; chooseUntil = plannedWindow.startsAt − 30 min); the driver chooses (chooseReservation), without a choice vehicleId stays. The trip needs a driver (422 validation_failed, field alternativeVehicleId, code driver); the same vehicle as vehicleId — 422 code same; the same checks as vehicleId (409 vehicle_incompatible, reservation_overlap)."
  required:
    - vehicleId
  description: Vehicle the logist assigns to a planned trip (Назначить на рейс).
InspectionDefectReport:
  type: object
  additionalProperties: false
  properties:
    zone:
      type: string
      minLength: 1
      maxLength: 100
      description: Zone from the inspection dictionary (Кузов, Стёкла, Шины и колёса…).
    description:
      type: string
      minLength: 1
      maxLength: 2000
      description: What is wrong (Опишите дефект — required by the form).
    severity:
      type: string
      enum:
        - minor
        - major
        - blocking
      description: blocking = Критический — машина не может выехать (departure only); the prototype form sends minor or blocking.
  required:
    - zone
    - description
    - severity
InspectionDefect:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    vehicleId:
      $ref: ../common/schemas.yaml#/Id
    inspectionId:
      $ref: ../common/schemas.yaml#/Id
    tripId:
      $ref: ../common/schemas.yaml#/Id
    zone:
      type: string
    description:
      type: string
    severity:
      type: string
      enum:
        - minor
        - major
        - blocking
    state:
      type: string
      enum:
        - open
        - in_review
        - resolved
        - confirmed_out_of_service
    reportedAt:
      $ref: ../common/schemas.yaml#/Instant
    reportedByMemberId:
      $ref: ../common/schemas.yaml#/Id
    decision:
      type: string
      enum:
        - allow_departure
        - confirm_out_of_service
    decisionComment:
      type: string
      maxLength: 2000
    decidedByMemberId:
      $ref: ../common/schemas.yaml#/Id
    decidedAt:
      $ref: ../common/schemas.yaml#/Instant
    tripNumber:
      type: string
      maxLength: 32
    vehicleDisplayName:
      type: string
      maxLength: 200
    registrationNumber:
      type: string
      maxLength: 32
    driverDisplayName:
      type: string
      maxLength: 200
    revision:
      type: integer
      minimum: 1
      format: int64
    assigneeMemberId:
      $ref: ../common/schemas.yaml#/Id
      description: "W2.52 (0.6.1-stage2, D-29 комплекта, W2.46). Who handles the defect in the queue (the task assignee at step 4.1) — assignInspectionDefect; absent — not assigned (every responsible manager of the company sees it)."
    assigneeDisplayName:
      type: string
      maxLength: 200
      description: W2.52 (0.6.1-stage2). Name of the assignee for the queue card.
    dueAt:
      $ref: ../common/schemas.yaml#/Instant
      description: W2.52 (0.6.1-stage2, D-29 комплекта). Deadline of the decision (the task due date at step 4.1).
    assignedByMemberId:
      $ref: ../common/schemas.yaml#/Id
      readOnly: true
      description: W2.52 (0.6.1-stage2). Who assigned the defect last.
    assignedAt:
      $ref: ../common/schemas.yaml#/Instant
      readOnly: true
      description: W2.52 (0.6.1-stage2). When the defect was assigned last.
  required:
    - id
    - vehicleId
    - inspectionId
    - zone
    - description
    - severity
    - state
    - reportedAt
    - reportedByMemberId
    - revision
  description: "W2.00 (0.5.0-stage2, S2-17). A defect of fleet.defects. Blocking defects reported on departure wait in_review in the manager queue; resolved with decision allow_departure is shown as признан некритичным; confirmed_out_of_service keeps the vehicle unavailable. tripNumber, vehicleDisplayName, registrationNumber and driverDisplayName are display fields of the queue card, filtered by the same scope as the defect."
InspectionDefectPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/InspectionDefect
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
DefectDecision:
  type: object
  additionalProperties: false
  properties:
    decision:
      type: string
      enum:
        - allow_departure
        - confirm_out_of_service
      description: allow_departure — Дефект некритичный — разрешить выезд; confirm_out_of_service — Подтвердить неисправность.
    comment:
      type: string
      maxLength: 2000
  required:
    - decision
# W2.51 (0.6.0-stage2, S2-14, AUTH-06/07, AC-06): публикация водителя фирмой-источником и временное назначение.
DriverPoolPublicationCreate:
  type: object
  additionalProperties: false
  properties:
    driverMemberId:
      $ref: ../common/schemas.yaml#/Id
      description: Active member of the home company with the driver function.
    homeOrgUnitId:
      $ref: ../common/schemas.yaml#/Id
      description: Home (source) company of the driver; the actor releases drivers of this unit (fleet.driver_transfers.approve).
    freeWindow:
      $ref: ../common/schemas.yaml#/TimeWindow
    qualifications:
      type: array
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 100
      description: Only the qualifications relevant to a request (Кат. C, рефрижератор) — no documents or contacts (AUTH-06).
    terms:
      type: string
      maxLength: 500
      description: Terms shown to other companies (По соглашению фирм группы).
    usualVehicleId:
      $ref: ../common/schemas.yaml#/Id
      description: "W2.71 (0.6.3-stage2, S2-20 rule 1, TD-01). The usual vehicle of the driver published with him (fleet.pool_publications.usual_vehicle_id): an active vehicle of homeOrgUnitId the actor reads (fleet.vehicles.read). An unknown, invisible, archived vehicle or a vehicle of another company answer the same 422 validation_failed (field usualVehicleId, code vehicle «Нужна машина фирмы водителя») — the answer does not reveal the vehicles of other companies. Without it the option «Едет на своей обычной» of the request is unavailable."
  required:
    - driverMemberId
    - homeOrgUnitId
    - freeWindow
    - qualifications
  description: The source company publishes a free driver for a bounded window. The catalog (listAvailableDrivers) shows only the pool label, qualifications, window, terms and home company. A window overlapping another publication of the driver that is not withdrawn (active or expired — tenant 0014 pool_publications_no_overlap) or a trip of the driver is 409 resources_unavailable.
DriverPoolPublication:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    driverMemberId:
      $ref: ../common/schemas.yaml#/Id
    driverDisplayName:
      type: string
      maxLength: 200
      description: Name of the driver — returned to the source company only (the catalog never shows it).
    displayName:
      type: string
      maxLength: 200
      description: "Pseudonymous pool label assigned by the server at publication (Водитель #N, the next number after the labels of the tenant); DriverAvailability.displayName. Unique in the tenant (tenant 0014 pool_publications_display_name_uq): the server takes the next number under a tenant lock or retries the number on a unique violation — a concurrent publication never fails because of the label."
    homeOrgUnitId:
      $ref: ../common/schemas.yaml#/Id
    homeOrgUnitName:
      type: string
      maxLength: 200
    qualifications:
      type: array
      items:
        type: string
    freeWindow:
      $ref: ../common/schemas.yaml#/TimeWindow
    terms:
      type: string
      maxLength: 500
    state:
      type: string
      enum:
        - active
        - withdrawn
        - expired
      description: active — in the catalog until freeWindow.endsAt; withdrawn — removed by the source company (open requests expire); expired — the window is over.
    publishedByMemberId:
      $ref: ../common/schemas.yaml#/Id
      readOnly: true
    publishedAt:
      $ref: ../common/schemas.yaml#/Instant
    withdrawnAt:
      $ref: ../common/schemas.yaml#/Instant
    withdrawnByMemberId:
      $ref: ../common/schemas.yaml#/Id
      readOnly: true
      description: Who withdrew the publication (pool_publications.withdrawn_by).
    withdrawalComment:
      type: string
      maxLength: 2000
      description: DriverPoolWithdrawal.comment (pool_publications.withdrawal_comment); only of a withdrawn publication.
    usualVehicleId:
      $ref: ../common/schemas.yaml#/Id
      description: W2.71 (0.6.3-stage2, S2-20 rule 1). DriverPoolPublicationCreate.usualVehicleId — the usual vehicle of the driver; the catalog shows it as DriverAvailability.usualVehicle.
    revision:
      type: integer
      minimum: 1
      format: int64
  required:
    - id
    - driverMemberId
    - displayName
    - homeOrgUnitId
    - qualifications
    - freeWindow
    - state
    - publishedAt
    - revision
DriverPoolPublicationPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/DriverPoolPublication
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Publications of the companies where the actor reads pool requests, newest window first. Opaque cursor is bound to tenant, principal, effective scopes, filters and sort.
DriverPoolWithdrawal:
  type: object
  additionalProperties: false
  properties:
    comment:
      type: string
      maxLength: 2000
  description: Withdrawal removes the driver from the catalog; open requests become expired, approved transfers keep their grant until the window end or revoke.
TemporaryDriverGrant:
  type: object
  additionalProperties: false
  properties:
    assignmentId:
      $ref: ../common/schemas.yaml#/Id
      description: "access.role_assignments row (source transfer) — W2.57 (0.6.2-stage2, Q-W2.07-1): the system role «Временный водитель» (role_templates.temporary_driver) in scope self, valid for the window: the trips the driver drives, their inspections, expenses, reservations (read) and files. It is never assigned by hand."
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
      description: Target company — the area of work of the trip; the home unit and history do not move (AUTH-07).
    tripId:
      $ref: ../common/schemas.yaml#/Id
      description: "The only trip the grant opens («Доступ ограничен этим рейсом»); without tripId — the trips of the target company assigned to the driver within the window. W2.57 (0.6.2-stage2): after the window or a revocation a started trip keeps only its continuation (D09) — the return, the return inspection, the expenses and the photos of this trip; everything else of the trip answers 404."
    validFrom:
      $ref: ../common/schemas.yaml#/Instant
    validUntil:
      $ref: ../common/schemas.yaml#/Instant
      description: End of the agreed window (DriverTransfer.window.endsAt) — «до 18:00 01.10». W2.57 (0.6.2-stage2) — decideDriverTransfer extend moves it.
    state:
      type: string
      enum:
        - scheduled
        - active
        - closing
        - ended
      description: "scheduled — before validFrom; active — within the window; closing — the window is over while the trip is started and not closed (only its completion, D09), including submitted and rework, until the trip is accepted or cancelled; ended — completed or revoked, the trip answers 404 to the driver (AC-06). W2.57 (0.6.2-stage2): started — on_route, returning, submitted or rework; a revoked transfer of a started trip is closing too (continuation only, D09); the acceptance, the cancellation and taking the driver off the trip end the grant at that moment, also inside the window."
    endedAt:
      $ref: ../common/schemas.yaml#/Instant
    endReason:
      type: string
      enum:
        - completed
        - revoked
    overdue:
      type: boolean
      description: "W2.57 (0.6.2-stage2, 08-domain-scenarios §4.6 п. 7). The window is over (or the transfer revoked) and the started trip is not handed over yet (on_route, returning, rework) — the responsible managers of both companies see the overdue trip and may extend the window. Present only while state is closing."
    vehicleId:
      $ref: ../common/schemas.yaml#/Id
      description: "W2.57 (0.6.2-stage2). The vehicle reserved for the trip the grant opens: a second row of the role in scope resource gives fleet.vehicles.read on it until the end of the window (never in closing). Absent while the trip has no vehicle or the grant does not open it."
  required:
    - assignmentId
    - orgUnitId
    - validFrom
    - validUntil
    - state
  description: "Narrow temporary operational assignment created by approval (AUTH-07). Never grants earnings of either company. W2.57 (0.6.2-stage2, Q-W2.07-1 «только рейс»): the role «Временный водитель» — the trip and its objects only, no tasks, knowledge, calendar or vehicles of the target company besides the reserved one."
# W2.52 (0.6.1-stage2, D-12 комплекта, W2.41): справочник категорий расходов тенанта (посев — шесть кодов W2.40).
ExpenseCategory:
  type: object
  additionalProperties: false
  properties:
    code:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,49}$
      maxLength: 50
      description: "Stable code of the category — TripExpense.kind. Seed codes (every tenant, tenant 0015): fuel (Топливо), wash (Мойка), parking (Парковка), toll (Платная дорога), tire_service (Шиномонтаж и мелкий ремонт), other (Прочее, commentRequired). A category created by the owner gets the code from ExpenseCategoryCreate.code or the next custom_<N>."
    label:
      type: string
      minLength: 1
      maxLength: 100
      description: Label in the expense form, the shift review and the dataset «Расходы»; unique among active categories (case-insensitive).
    commentRequired:
      type: boolean
      description: The driver must add a comment (TripExpenseCreate.comment) — always true for other.
    seeded:
      type: boolean
      description: One of the six seed categories (D-12 комплекта); its code and label are fixed.
    state:
      type: string
      enum:
        - active
        - archived
      description: active — offered for new expenses; archived — kept for the expenses that already carry it, refused for new ones.
    archivedAt:
      $ref: ../common/schemas.yaml#/Instant
    archivedByMemberId:
      $ref: ../common/schemas.yaml#/Id
      readOnly: true
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    revision:
      type: integer
      minimum: 1
      format: int64
  required:
    - code
    - label
    - commentRequired
    - seeded
    - state
    - createdAt
    - revision
  description: A category of driver expenses of the tenant (fleet.expense_categories, tenant 0015). Fines are not driver expenses (D-12 комплекта) and are not a category.
ExpenseCategoryCreate:
  type: object
  additionalProperties: false
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 100
    commentRequired:
      type: boolean
    code:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,49}$
      maxLength: 50
      description: Optional stable code; without it the server assigns the next custom_<N>. A code or an active label already used — 422 validation_failed (field code or label, code duplicate).
  required:
    - label
    - commentRequired
ExpenseCategoryPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      maxItems: 200
      items:
        $ref: ./schemas.yaml#/ExpenseCategory
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Categories in the order of the catalogue (seed first, then by creation); the catalogue is small, nextCursor is null.
# W2.52 (0.6.1-stage2, модель данных п. 2, W2.42): кто владел машиной на дату.
VehicleAssignment:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    vehicleId:
      $ref: ../common/schemas.yaml#/Id
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
    orgUnitName:
      type: string
      maxLength: 200
    validFrom:
      $ref: ../common/schemas.yaml#/Instant
    validTo:
      type:
        - string
        - "null"
      format: date-time
      description: End of the period, exclusive; null — the current company of the vehicle.
    reason:
      type: string
      maxLength: 500
    assignedByMemberId:
      $ref: ../common/schemas.yaml#/Id
      readOnly: true
  required:
    - id
    - vehicleId
    - orgUnitId
    - validFrom
    - validTo
  description: A period of fleet.vehicle_assignments (tenant 0016) — the vehicle belonged to orgUnitId over [validFrom, validTo). Periods of one vehicle never overlap; the open period matches Vehicle.orgUnitId.
VehicleAssignmentPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      maxItems: 200
      items:
        $ref: ./schemas.yaml#/VehicleAssignment
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Periods newest first. Opaque cursor is bound to tenant, principal, effective scopes, filters and sort.
VehicleMove:
  type: object
  additionalProperties: false
  properties:
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
      description: Target company of the vehicle.
    reason:
      type: string
      minLength: 1
      maxLength: 500
  required:
    - orgUnitId
    - reason
  description: Moves the vehicle to another company from now on (no backdating). History, trips, inspections and expenses stay with the companies they were made in.
# W2.52 (0.6.1-stage2, D-29 комплекта, W2.46): поля задачи у дефекта в очереди.
DefectAssignment:
  type: object
  additionalProperties: false
  properties:
    assigneeMemberId:
      $ref: ../common/schemas.yaml#/Id
      description: Active member with fleet.inspections.review over the company of the vehicle.
    dueAt:
      $ref: ../common/schemas.yaml#/Instant
      description: Deadline of the decision, not in the past.
    comment:
      type: string
      maxLength: 2000
  required:
    - assigneeMemberId
    - dueAt
# W2.52 (0.6.1-stage2, D-11 комплекта, W2.50): импорт CSV машин — по образцу импорта людей (S1-10).
VehicleImportCreate:

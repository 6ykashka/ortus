                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          $ref: '#/components/responses/PlanRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Validation'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-csrf-required-for-cookie: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentPerformance'
            example:
              performedAt: '2026-10-05T09:00:00Z'
      x-permissions-mode: all
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC-issued short-lived API access token. Validate signature, issuer, audience, exp, nbf
        and tenant binding. Platform tokens have distinct audience/capability from tenant tokens.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ortus_session
      description: Secure HttpOnly SameSite=Lax host-only browser session issued after OIDC + PKCE. Mutations
        also require X-CSRF-Token and exact allowed Origin. Do not send this cookie with a bearer token.
  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    memberId:
      name: memberId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    roleId:
      name: roleId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    assignmentId:
      name: assignmentId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    orgUnitId:
      name: orgUnitId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    uploadId:
      name: uploadId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    fileId:
      name: fileId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    taskId:
      name: taskId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    pageId:
      name: pageId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    bookingId:
      name: bookingId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    formId:
      name: formId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    versionId:
      name: versionId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    responseId:
      name: responseId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    reservationId:
      name: reservationId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    tripId:
      name: tripId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    requestId:
      name: requestId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    appointmentId:
      name: appointmentId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    inspectionId:
      name: inspectionId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    expenseId:
      name: expenseId
      in: path
      required: true
      description: Opaque UUID; same-tenant and visibility checks are mandatory.
      schema:
        $ref: '#/components/schemas/Id'
    moduleKey:
      name: moduleKey
      in: path
      required: true
      description: Module key from the trusted registry.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{1,49}$
    datasetId:
      name: datasetId
      in: path
      required: true
      description: Authorized logical dataset key, not a SQL table.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_.-]{1,99}$
    publicToken:
      name: publicToken
      in: path
      required: true
      description: Unpredictable revocable public-form capability; avoid logs and referrer leakage.
      schema:
        type: string
        minLength: 32
        maxLength: 256
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the preceding response; no offset pagination.
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      description: ''
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OrgUnitFilter:
      name: orgUnitId
      in: query
      required: false
      description: Optional narrower scope, never an expansion beyond actor grants.
      schema:
        $ref: '#/components/schemas/Id'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable per intended command. Retain record at least 7 days; financial deduplication also
        retains a durable tenant+actor+operation+key digest receipt. Key is scoped to tenant+actor+operation.
        Reuse only for an identical request.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag obtained from latest GET or mutation response. * is not accepted. Missing=428;
        stale=412. Idempotent replay is checked before current revision precondition.
      schema:
        type: string
        pattern: ^"[^"\s]+"$
        examples:
        - '"rev-7"'
    Csrf:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated state changes; not required with bearer-only authentication.
        Invalid/missing token or Origin yields 403. Conditional requirement cannot be represented by OpenAPI
        required=true.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    Origin:
      name: Origin
      in: header
      required: false
      description: Required and checked against the deployment allowlist for cookie-authenticated state changes
        and browser public-form submissions/uploads. Never accept wildcard with credentialed requests.
      schema:
        type: string
        format: uri
  headers:
    ETag:
      description: Strong entity revision. Send unchanged in If-Match for updates.
      schema:
        type: string
        examples:
        - '"rev-7"'
    RequestId:
      description: Non-secret correlation identifier.
      schema:
        type: string
    RetryAfter:
      description: Number of seconds until a retry may be attempted.
      schema:
        type: integer
        minimum: 1
    IdempotencyReplayed:
      description: true if a stored command response was replayed.
      schema:
        type: boolean
  responses:
    BadRequest:
      description: Malformed JSON/header or invalid cursor binding.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Missing, expired or invalid authentication.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PlanRequired:
      description: Optional use only for missing paid entitlement; never for ordinary RBAC denial. Client must
        also use stable code plan_required.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated actor lacks action permission, tenant/module is suspended, or cookie CSRF/Origin
        validation failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or not visible; foreign tenant and nonexistent identifiers are indistinguishable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'Domain conflict: overlap, invalid lifecycle, in-flight/reused idempotency key, exhausted
        quota, insufficient stock or incompatible plan downgrade.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Public capability/nonce/upload has expired or been revoked.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match revision is stale; fetch current entity and resolve the conflict.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooLarge:
      description: Upload or request exceeds an explicit configured limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Validation:
      description: Typed or business validation failed; see field violations.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Required If-Match or idempotency precondition missing.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request, anonymous upload or query cost limit exceeded; retry after specified delay.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      format: uuid
      examples:
      - 10000000-0000-4000-8000-000000000001
    Instant:
      type: string
      format: date-time
      pattern: Z$
      examples:
      - '2026-10-05T06:00:00Z'
      description: UTC RFC3339 instant. Write requests must use the Z suffix; retain the IANA timezone separately
        for local calendars.
    TimeZone:
      type: string
      examples:
      - Europe/Moscow
      description: IANA timezone, checked against the deployed tz database.
    Decimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
      examples:
      - '12.500'
      description: Exact decimal. Never a binary floating point number.
      maxLength: 40
    Quantity:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
      examples:
      - '0.025'
      description: Nonnegative exact quantity; operations requiring a positive value additionally reject zero.
      maxLength: 40
    Money:
      type: object
      additionalProperties: false
      properties:
        amountMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Minor currency units, within the exact JSON/JavaScript integer range. Domain totals
            above this bound are rejected; server calculations use checked integers/decimal.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code.
      required:
      - amountMinor
      - currency
    TimeWindow:
      type: object
      additionalProperties: false
      properties:
        startsAt:
          $ref: '#/components/schemas/Instant'
        endsAt:
          $ref: '#/components/schemas/Instant'
        timeZone:
          $ref: '#/components/schemas/TimeZone'
      required:
      - startsAt
      - endsAt
      - timeZone
      description: Half-open interval [startsAt, endsAt); startsAt < endsAt. Client labels never replace UTC
        values.
    ObjectRef:
      type: object
      additionalProperties: false
      properties:
        moduleKey:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,49}$
        entityType:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        entityId:
          $ref: '#/components/schemas/Id'
      required:
      - moduleKey
      - entityType
      - entityId
      description: Server verifies same-tenant ownership and target visibility. A reference never grants access.
    ProblemViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required:
      - field
      - code
      - message
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 100
          format: int64
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
        violations:
          type: array
          items:
            $ref: '#/components/schemas/ProblemViolation'
      required:
      - type
      - title
      - status
      - code
      - requestId
      description: 'Problem Details. No cross-tenant IDs, SQL, token values or storage keys in errors. Retryable
        conflict codes: reservation_overlap, resources_unavailable, idempotency_in_progress; quota errors:
        quota_exceeded, downgrade_below_usage.'
    Scope:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - tenant
          - org_unit
          - project
          - self
          - resource_pool
        resourceIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          maxItems: 100
        includeDescendants:
          type: boolean
      required:
      - kind
      - resourceIds
      - includeDescendants
      description: tenant/self require empty resourceIds; other kinds require IDs. Project/pool membership
        and descendant rules are evaluated server-side. Org-unit trees never cross tenants.
    Permission:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_.]+$
        moduleKey:
          type: string
        description:
          type: string
        allowedScopeKinds:
          type: array
          items:
            type: string
            enum:
            - tenant
            - org_unit
            - project
            - self
            - resource_pool
        sensitivity:
          type: string
          enum:
          - standard
          - personal
          - financial
      required:
      - key
      - moduleKey
      - description
      - allowedScopeKinds
      - sensitivity
    ScopedCapability:
      type: object
      additionalProperties: false
      properties:
        permission:
          type: string
        scope:
          $ref: '#/components/schemas/Scope'
      required:
      - permission
      - scope
    ModuleAvailability:
      type: object
      additionalProperties: false
      properties:
        moduleKey:
          type: string
        state:
          type: string
          enum:
          - uninstalled
          - active
          - draining
          - read_only
          - disabled
          - suspended
        accessMode:
          type: string
          enum:
          - none
          - read
          - write
          - finish_only
        reason:
          type: string
          enum:
          - available
          - not_installed
          - disabled
          - plan_expired
          - permission_denied
          - tenant_suspended
          - draining
      required:
      - moduleKey
      - state
      - accessMode
      - reason
    TenantContext:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        membershipId:
          $ref: '#/components/schemas/Id'
        membershipStatus:
          type: string
          enum:
          - active
          - suspended
        orgUnitIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleAvailability'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/ScopedCapability'
      required:
      - tenantId
      - name
      - membershipId
      - membershipStatus
      - orgUnitIds
      - modules
      - capabilities
    MeContext:
      type: object
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
        platformOperator:
          type: boolean
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantContext'
        permissionVersion:
          type: string
      required:
      - userId
      - displayName
      - platformOperator
      - tenants
      - permissionVersion
      description: Returns only memberships visible to the authenticated identity. No tenant is selected implicitly
        for writes; the URL is authoritative. Capabilities help render UI; the backend always authorizes independently.
    Tenant:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        status:
          type: string
          enum:
          - provisioning
          - active
          - suspended
          - closing
        ownerUserIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/Instant'
        revision:
          type: integer
          minimum: 1
          format: int64
      required:
      - id
      - name
      - status
      - ownerUserIds
      - createdAt
      - revision
      description: ownerUserIds may be empty only during provisioning. Activation requires at least one accepted
        active owner. Closing does not itself delete data.
    TenantCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        ownerEmail:
          type: string
          format: email
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        planKey:
          type: string
      required:
      - name
      - ownerEmail
      - timeZone
      - planKey
      description: Creates the platform control-plane record and provisioning job. Owner membership is established
        only after verified invitation acceptance.
    TenantPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        status:
          type: string
          enum:
          - active
          - suspended
        reason:
          type: string
          minLength: 5
          maxLength: 500
      description: Only provided fields change. Suspending blocks writes and operational release; owner gets
        recovery/billing access. No implicit data deletion.
    TenantPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        nextCursor:
          type:
          - string
          - 'null'
          maxLength: 2048
      required:
      - items
      - nextCursor
      description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission
        changes invalidate the cursor.
    PlatformUser:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - invited
          - active
          - suspended
        lastSeenAt:
          $ref: '#/components/schemas/Instant'
        tenantCount:
          type: integer
          minimum: 0
          format: int64
      required:
      - id
      - displayName
      - email
      - status
      - tenantCount
      description: Platform support metadata only; business content is inaccessible without separately audited
        break-glass access, not specified here.
    PlatformUserPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformUser'
        nextCursor:
          type:
          - string
          - 'null'
          maxLength: 2048
      required:
      - items
      - nextCursor
      description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission
        changes invalidate the cursor.
    Entitlement:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
        sourceType:
          type: string
          enum:
          - plan
          - addon
          - trial
          - manual
        sourceRef:
          type: string
        value:
          type: integer
          minimum: 0
          format: int64
        validUntil:
          $ref: '#/components/schemas/Instant'
      required:
      - key
      - sourceType
      - sourceRef
      - value
    Subscription:
      type: object
      additionalProperties: false
      properties:
        planKey:
          type: string
        status:
          type: string
          enum:
          - trialing
          - active
          - past_due
          - grace
          - read_only
          - cancelled
        trialEndsAt:
          $ref: '#/components/schemas/Instant'
        periodEndsAt:
          $ref: '#/components/schemas/Instant'
        graceEndsAt:
          $ref: '#/components/schemas/Instant'
        cancelAtPeriodEnd:
          type: boolean
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        revision:
          type: integer
          minimum: 1
          format: int64
      required:
      - planKey
      - status
      - cancelAtPeriodEnd
      - entitlements
      - revision
    PlatformSubscriptionUpdate:
      type: object
      additionalProperties: false
      properties:
        planKey:
          type: string
        status:
          type: string
          enum:
          - trialing
          - active
          - past_due
          - grace
          - read_only
          - cancelled
        periodEndsAt:
          $ref: '#/components/schemas/Instant'
        trialEndsAt:
          $ref: '#/components/schemas/Instant'
        graceEndsAt:
          $ref: '#/components/schemas/Instant'
        cancelAtPeriodEnd:
          type: boolean
        manualEntitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        reason:
          type: string
          minLength: 5
          maxLength: 500
      required:
      - planKey
      - status
      - cancelAtPeriodEnd
      - manualEntitlements
      - reason
      description: Privileged, audited operation. Manual entitlements must have sourceType=manual, expiry and
        a ticket/reason; plan/trial entitlements are derived by the billing service.
    SubscriptionChange:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - start_trial
          - change_plan
          - cancel_at_period_end
          - resume
        planKey:
          type: string
        acceptedQuoteId:
          $ref: '#/components/schemas/Id'
      required:
      - action
      description: start_trial is eligibility-checked and cannot reset a consumed trial. Paid changes require
        a valid server quote; no arbitrary price/capability values are accepted.
    QuotaBucket:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - attachments
          - database
          - versions
          - trash

# Контракт Ортус · тег Chats: пути и операции. Пишет только стюард контракта (план v2 §3.5).
/api/v1/tenants/{tenantId}/chats:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listChats
    tags:
      - Chats
    summary: List chats visible to the member
    x-permissions:
      - chat.read
    x-scope: chat
    description: "W7.00 (chats.md §2.2). Summary of chats visible to the member: title, kind, last message (the PDn mask is applied on the server), my unread, my ack waiting count, my role, the peer of a direct chat. A chat the member is not in — not listed; a record chat whose module is off or without the right to the record is hidden. 403 module_not_installed when the module is off."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/chats/schemas.yaml#/ChatList
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Cursor
      - $ref: ../components/common/parameters.yaml#/Limit
      - name: folder
        in: query
        required: false
        description: Folder of the list (Q-W4.00-chats-15).
        schema:
          type: string
          enum:
            - all
            - direct
            - work
            - record
            - announce
      - name: q
        in: query
        required: false
        description: Search in titles and in last messages after the PDn mask.
        schema:
          type: string
          maxLength: 100
    x-permissions-mode: all
  post:
    operationId: createChat
    tags:
      - Chats
    summary: Create a group, area or announcement chat
    x-permissions:
      - chat.create
    x-scope: chat
    description: "W7.00 (chats.md §2.2) (chatCreate). Only the own area of the author; kind announce and the label «Финансы» — business owner only (Q-W4.00-chats-21). dryRun true returns 200 with applied false: who joins, who waits, who is skipped (422 chat_member_out_of_scope names the first member outside the area). Roles are Assignment with the scope chat; the creator becomes the owner. Emits chat.chat.created.v1 and chat.member.joined.v1."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/chats/schemas.yaml#/ChatCreateResult
      "201":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/chats/schemas.yaml#/ChatCreateResult
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":

# Контракт Ортус · компоненты тега auth (W0.08). Пишет только стюард контракта (план v2 §3.5).
CsrfToken:
  type: object
  additionalProperties: false
  properties:
    csrfToken:
      type: string
      minLength: 16
      maxLength: 256
      description: Synchronizer token of the current session; send unchanged as X-CSRF-Token.
    headerName:
      type: string
      const: X-CSRF-Token
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - csrfToken
    - headerName
    - expiresAt
  description: Valid until the session ends or expiresAt; never stored in localStorage or URLs.
LogoutResult:
  type: object
  additionalProperties: false
  properties:
    endSessionUrl:
      type:
        - string
        - "null"
      format: uri
      description: RP-initiated logout URL of the identity provider, or null when the provider has none.
  required:
    - endSessionUrl
InvitationToken:
  type: object
  additionalProperties: false
  properties:
    token:
      type: string
      minLength: 32
      maxLength: 256
      description: One-time invitation secret from the e-mail link fragment. The server stores only its hash.
  required:
    - token
InvitationPreview:
  type: object
  additionalProperties: false
  properties:
    tenantName:
      type: string
    invitedEmailMasked:
      type: string
      description: E-mail with the local part masked (i•••••@alta.example).
    status:
      type: string
      enum:
        - pending
        - accepted
        - expired
        - revoked
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - tenantName
    - invitedEmailMasked
    - status
    - expiresAt
  description: Only pending invitations can be accepted; other statuses explain why the link no longer works.
InvitationAcceptance:
  type: object
  additionalProperties: false
  properties:
    tenantId:
      $ref: ../common/schemas.yaml#/Id
    membershipId:
      $ref: ../common/schemas.yaml#/Id
    tenantName:
      type: string
    membershipStatus:
      type: string
      const: active
  required:
    - tenantId
    - membershipId
    - tenantName
    - membershipStatus
  description: The business is stored as MeContext.lastTenantId; the client reloads getMyContext for capabilities.

# W1.00 (0.4.0-stage1): канал реального времени (ADR-0015, PD-58).
RealtimeTicket:
  type: object
  additionalProperties: false
  properties:
    ticket:
      type: string
      minLength: 32
      maxLength: 256
      description: Opaque single-use secret; send it only in the first frame. Never log it, never put it in a URL.
    path:
      type: string
      const: /api/v1/realtime
    protocol:
      type: string
      const: ortus.realtime.v1
      description: Value of Sec-WebSocket-Protocol.
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
    heartbeatSeconds:
      type: integer
      minimum: 5
      maximum: 120
  required:
    - ticket
    - path
    - protocol
    - expiresAt
    - heartbeatSeconds
RealtimeClientMessage:
  type: object
  additionalProperties: false
  properties:
    type:
      type: string
      enum:
        - auth
        - pong
    ticket:
      type: string
      minLength: 32
      maxLength: 256
      description: Only in the auth frame.
  required:
    - type
  description: Frames the browser sends. The first frame must be auth with a ticket from createRealtimeTicket within 10 seconds of the upgrade, otherwise the gateway closes with 4401. pong answers ping.
RealtimeServerMessage:
  type: object
  additionalProperties: false
  properties:
    type:
      type: string
      enum:
        - context.changed
        - notifications.changed
        - session.ended
        - ping
      description: context.changed — re-read getMyContext (roles, assignments, modules, tenant state or policy version changed; S1-15 revocation within 5 s); notifications.changed — re-read getMyNotificationSummary and the open inbox list (S1-26); session.ended — the session is over, the socket closes next; ping — answer with pong.
    tenantId:
      $ref: ../common/schemas.yaml#/Id
    permissionVersion:
      type: string
      maxLength: 100
      description: New MeContext.permissionVersion for context.changed; the client may skip the re-read when it already has this version.
    reason:
      type: string
      enum:
        - logout
        - expired
        - revoked
        - membership_ended
      description: Only for session.ended.
    seq:
      type: integer
      minimum: 1
      format: int64
      description: Per-connection sequence; a gap means missed hints — re-read everything.
    at:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - type
    - seq
    - at
  description: Hints only (ADR-0015). No titles, bodies, amounts or personal data travel over the socket; the audience is checked when the hint is queued and again when it is delivered.

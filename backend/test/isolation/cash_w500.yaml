# Матрица изоляции: касса контракта 0.12.0-stage5 (W5.00, контрактный PR этапа 5); хендлеры — W5.31.
# Строки пишутся до хендлера (pending): без сессии 401, чужая организация 404 (AC-02). Положительные строки и строки
# «нет такого объекта» владельцу (404, список только своих, absent: tenant:b) требуют фикстур модуля (кассы, склады,
# услуги) — их добавляет W5.31 вместе с хендлерами и снимает pending. Отказы шлюза (403 forbidden_action,
# module_not_installed) — отдельный файл без pending. Деньги: ответы по кассам вне области актора — 404, как несуществующие.
# Формат — README.md.
# После правки: go -C backend generate ./test/isolation

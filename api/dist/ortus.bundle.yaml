    StorageUsage:
      type: object
      additionalProperties: false
      properties:
        quotaBytes:
          type: integer
          minimum: 0
          format: int64
        committedBytes:
          type: integer
          minimum: 0
          format: int64
        reservedBytes:
          type: integer
          minimum: 0
          format: int64

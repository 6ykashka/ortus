        '200':
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: Never cache authenticated, confidential or capability-bearing API responses in shared
                caches.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:

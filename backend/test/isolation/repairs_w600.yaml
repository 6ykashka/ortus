# Матрица изоляции: «Ремонт и стройка» контракта 0.12.0-stage6 (W6.00, контракт этапа 6; хендлеры — W6.11–W6.16).
# Объект ремонта — repair_project (RS-08): роли области repairs.*; чужая организация — 404 (AC-02), без сессии — 401;
# объекта нет в организации — 404 и владельцу. Фикстур объектов ремонта у набора пока нет (строку объекта и назначения
# прораба добавит W6.11 вместе с хендлером): позитивные строки и строки «прораб чужого объекта», «прораб без цен»,
# «подрядчик после срока» пишет W6.11–W6.16 из этого файла (снять pending). Команды с If-Match строки не передают
# If-Match (README, «Цель набора»): без него строгий сервер отвечает 428 раньше хендлера, поэтому у них только отказы
# шлюза — без сессии 401, чужая организация 404. Публичные операции кабинета заказчика: неизвестная ссылка — 404.
# Отказы шлюза (403 module_not_installed — модуль у фикстур не подключён) — repairs_w600_gate.yaml. Формат — README.md.
# Хендлеры есть у всех операций тега (W6.11–W6.15), pending не осталось. W6.15: строки финансов, начислений, подрядчиков и ссылки кабинета для владельца и прораба;
# путь «акт → начисление → выплата», выпуск ссылки и кабинет по токену, согласование сметы гостем (параметр version — число, строка со ссылкой его не выразит) — isolation_w615_test.go.
# После правки: go -C backend generate ./test/isolation

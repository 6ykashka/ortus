# Контракт Ортус · компоненты тега cash. Пишет только стюард контракта (план v2 §3.5).
CashAccount:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
    currency:
      type: string
      pattern: ^[A-Z]{3}$
    kind:
      type: string
      enum:
        - cash
        - internal_virtual
    balance:
      $ref: ./schemas.yaml#/SignedMoney
    revision:
      type: integer
      minimum: 1
      format: int64
  required:
    - id
    - orgUnitId
    - name
    - currency
    - kind
    - balance
    - revision
CashAccountCreate:
  type: object
  additionalProperties: false
  properties:
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
      minLength: 1
      maxLength: 150
    currency:
      type: string
      pattern: ^[A-Z]{3}$
    kind:
      type: string
      enum:
        - cash
        - internal_virtual
  required:
    - orgUnitId
    - name
    - currency
    - kind
  description: Creates zero balance; opening funds are an explicit ledger operation. This internal ledger is not fiscalization, bank acquiring or tax accounting.
CashAccountPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/CashAccount
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
CashOperationCreate:
  type: object
  additionalProperties: false
  properties:
    accountId:
      $ref: ../common/schemas.yaml#/Id
    direction:
      type: string
      enum:
        - in
        - out
    amount:
      $ref: ../common/schemas.yaml#/Money
    category:
      type: string
      enum:
        - service_payment
        - expense
        - opening_balance
        - refund
        - adjustment
    occurredAt:
      $ref: ../common/schemas.yaml#/Instant
    relatedObject:
      $ref: ../common/schemas.yaml#/ObjectRef
    reversesOperationId:
      $ref: ../common/schemas.yaml#/Id
    note:
      type: string
      maxLength: 2000
  required:
    - accountId
    - direction
    - amount
    - category
    - occurredAt
  description: Currency must match account and amount > 0. Immutable append-only posting. Refund/correction references original operation; cumulative refunds cannot exceed its amount. No payment success is inferred from an appointment state. Negative internal_virtual balances require explicit account policy; physical cash accounts cannot go below zero.
CashOperation:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    accountId:
      $ref: ../common/schemas.yaml#/Id
    direction:
      type: string
      enum:
        - in
        - out
    amount:
      $ref: ../common/schemas.yaml#/Money
    category:
      type: string
      enum:
        - service_payment
        - expense
        - opening_balance
        - refund
        - adjustment
    occurredAt:
      $ref: ../common/schemas.yaml#/Instant
    postedAt:
      $ref: ../common/schemas.yaml#/Instant
    createdByMemberId:
      $ref: ../common/schemas.yaml#/Id
    relatedObject:
      $ref: ../common/schemas.yaml#/ObjectRef
    reversesOperationId:
      $ref: ../common/schemas.yaml#/Id
  required:
    - id
    - accountId
    - direction
    - amount
    - category
    - occurredAt
    - postedAt
    - createdByMemberId
CashOperationPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/CashOperation
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
SignedMoney:
  type: object
  additionalProperties: false
  properties:
    amountMinor:
      type: integer
      minimum: -9007199254740991
      maximum: 9007199254740991
    currency:
      type: string
      pattern: ^[A-Z]{3}$
  required:
    - amountMinor
    - currency

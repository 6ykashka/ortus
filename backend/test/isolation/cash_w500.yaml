# Матрица изоляции: касса контракта 0.12.0-stage5 (W5.00); хендлеры — W5.31 (backend/internal/modules/cash), pending снят.
# Строки шлюза: без сессии 401, чужая организация 404 (AC-02) — они держатся и с хендлером. Положительные строки и строки
# «нет такого объекта» владельцу (404, список только своих, absent: tenant:b) требуют установленного модуля cash в фикстурах
# изоляции (сейчас в тенанте установлен только logistics, у владельца ответ шлюза — 403 module_not_installed): они проверены
# на уровне сервиса (TestTenantIsolation, internal/modules/cash, testcontainers) — Q-W5.31-9. Деньги: ответы по кассам вне
# области актора — 404, как несуществующие.
# Формат — README.md.
# После правки: go -C backend generate ./test/isolation

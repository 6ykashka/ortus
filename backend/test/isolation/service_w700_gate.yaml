  - op: updateServiceDirectionDraft
    method: PUT
    path: /api/v1/tenants/{tenantId}/service/directions/{directionId}/draft
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a, directionId: tenant:missing }

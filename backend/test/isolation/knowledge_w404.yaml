# Матрица изоляции: «База знаний» контракта 0.9.0-stage4 (W4.04, контрактный PR 3 этапа 4) — до хендлеров W4.31
# (pending: 501 или совпавший ответ шлюза; в строгом режиме -tags isolation_pending — красные до хендлера).
# Пространства, узлы, запросы доступа и правила — данные организации (схема kb, tenant 0024): чужая организация — 404,
# как несуществующая (AC-01, AC-02), без сессии — 401. Пространств и узлов в фикстурах нет (W4.31 добавит строки
# содержимого: пространство «Регламенты» space:a.rules и страница page:a.rules-intro получат строки kb.*) —
# положительные строки списков проверяют только отсутствие другого тенанта, id в пути — tenant:missing (такого объекта
# нет ни в одной базе): владельцу своей организации — 404. Скрытое пространство или узел своей организации — тоже 404
# (раздел 2.2 разбора knowledge.md, «скрытое не видно нигде») — integration-тесты W4.31 на сиде W4.30. Команды с
# If-Match (updateKnowledgeSpace, publishKnowledgeNodeVersion, setKnowledgeNodeAccess) строки не передают (README,
# «Цель набора») — у них только отказы до хендлера (без сессии — 401, чужая организация — 404 раньше предусловия).
# Изменяющие строки владельца своей организации не пишутся: набор не сеет данные БЗ. Отказы шлюза по правам —
# knowledge_w404_gate.yaml. Передаётся W4.31 (возврат 1, ревью): с фикстурами kb.* (пространство и узел тенанта B)
# добавить строки «чужой объект в своём тенанте» — id пространства, узла, запроса и правила организации B в пути
# организации A — 404 для каждого эндпоинта с {spaceId}, {nodeId}, {requestId}, {ruleId}, и снять pending. Формат — README.md. После правки: go -C backend generate ./test/isolation
module: knowledge_w404
endpoints:
  # Пространства
  - op: listKnowledgeSpaces
    method: GET
    path: /api/v1/tenants/{tenantId}/knowledge/spaces
    pending: W4.31
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
        note: пространства своей организации; пространств тенанта B нет
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        note: чужая организация — как несуществующая
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
  - op: createKnowledgeSpace
    method: POST
    path: /api/v1/tenants/{tenantId}/knowledge/spaces
    pending: W4.31
    rows:
      - actor: b.owner

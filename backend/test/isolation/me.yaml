# Матрица изоляции: контекст пользователя GET /api/v1/me/context (шаг 0.7, W0.09) и выбор бизнеса PUT /api/v1/me/selected-tenant (шаг 1.3, W1.03).
# Формат — README.md. После правки: go -C backend generate ./test/isolation
module: me
endpoints:
  - op: getMyContext
    method: GET
    path: /api/v1/me/context
    rows:
      - actor: anonymous
        status: 401
        note: без сессии контекста нет
      - actor: a.owner
        status: 200
        present: [tenant:a, membership:a.owner@a]
        absent: [tenant:b]
      - actor: a.driver-msk1
        status: 200
        present: [tenant:a, membership:a.driver-msk1@a]
        absent: [tenant:b, membership:a.owner@a]
        note: чужие членства своего тенанта тоже не видны
      - actor: b.owner
        status: 200
        present: [tenant:b, membership:b.owner@b]
        absent: [tenant:a, unit:a.msk, unit:a.msk1]
      - actor: b.manager-msk1
        status: 200
        present: [tenant:b]
        absent: [tenant:a, unit:a.msk1]
        note: фирма-тёзка Москва-1 тенанта A не видна
      - actor: ab.member
        status: 200
        present: [tenant:a, tenant:b, membership:ab.member@a, membership:ab.member@b]
        absent: [membership:a.owner@a, membership:b.owner@b]
        note: аккаунт в двух организациях видит оба контекста и только свои членства (BR-T2)
  - op: selectTenant
    method: PUT
    path: /api/v1/me/selected-tenant
    rows:
      - actor: anonymous
        status: 401
        body: '{"tenantId": "{{tenant:a}}"}'
        note: без сессии выбора нет
      - actor: a.owner
        status: 404
        body: '{"tenantId": "{{tenant:b}}"}'
        absent: [tenant:b]
        note: чужая организация выбирается так же, как несуществующая (S1-07, AC-01)
      - actor: b.owner
        status: 404
        body: '{"tenantId": "{{tenant:a}}"}'
        absent: [tenant:a]
      - actor: a.driver-msk1
        status: 404
        body: '{"tenantId": "{{tenant:b}}"}'
        absent: [tenant:b, unit:b.msk1]
        note: не-владелец тоже не выбирает чужую организацию (T-08 брифа W1.03)
      - actor: b.manager-msk1
        status: 200
        body: '{"tenantId": "{{tenant:b}}"}'
        present: [tenant:b, membership:b.manager-msk1@b]
        absent: [tenant:a, unit:a.msk1, membership:b.owner@b]
        note: свой бизнес выбирается и не-владельцем, ответ — свежий контекст только своего аккаунта
      - actor: ab.member
        status: 200
        body: '{"tenantId": "{{tenant:b}}"}'
        present: [tenant:a, tenant:b, membership:ab.member@b]
        absent: [membership:a.owner@a, membership:b.owner@b]
        note: аккаунт в двух организациях выбирает любую из своих (BR-T2)
  # Входящие (S1-26, W1.10): лента одной организации по tenantId из строки запроса (AC-02 — tenantId не из пути).
  - op: listMyNotifications
    method: GET
    path: /api/v1/me/notifications?tenantId={tenantId}
    rows:
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
        note: без сессии ленты нет
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
      - actor: a.owner
        params: { tenantId: tenant:b }
        status: 404
        code: not_found
        note: чужая организация отвечает как несуществующая (AC-01, AC-02)
      - actor: b.manager-msk1
        params: { tenantId: tenant:a }
        status: 404
        code: not_found
        note: менеджер фирмы-тёзки Москва-1 тенанта B не читает ленту A
      - actor: a.driver-msk1
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
      - actor: ab.member
        params: { tenantId: tenant:b }
        status: 200
        absent: [tenant:a]
        note: лента одной организации даже у аккаунта в двух (BR-T2)
      - actor: p.operator
        params: { tenantId: tenant:a }
        status: 404
        code: not_found
        note: оператор платформы — не участник организации
  - op: getMyNotificationSummary
    method: GET
    path: /api/v1/me/notifications/summary
    rows:
      - actor: anonymous
        status: 401
      - actor: a.owner
        status: 200
        present: [tenant:a]
        absent: [tenant:b]
      - actor: b.owner
        status: 200
        present: [tenant:b]
        absent: [tenant:a]
      - actor: ab.member
        status: 200
        present: [tenant:a, tenant:b]
        note: счётчики по всем членствам (Q-W0.08-4), без заголовков уведомлений
      - actor: p.operator
        status: 200
        absent: [tenant:a, tenant:b]
        note: у оператора платформы членств нет
  # POST без Idempotency-Key (формат строки, Q-W1.04-14) дальше шлюза не проходит: здесь только аноним; чужая
  # организация в теле — unit- и integration-тесты W1.10.
  - op: markMyNotificationsRead
    method: POST
    path: /api/v1/me/notifications/read
    rows:
      - actor: anonymous
        status: 401
        body: '{"tenantId": "{{tenant:a}}", "upTo": "2026-10-01T07:30:00Z"}'

  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  post:
    operationId: createPeopleImport
    tags:
      - Access
    summary: Upload a CSV of people and get a row-by-row preview
    x-permissions:
      - members.manage
    x-scope: tenant-or-org-unit
    description: "Parses the CSV (UTF-8, header row, up to 1 MiB and 2000 data rows; 413 payload_too_large above) and validates every row without changing data (S1-10). Columns: full_name (required), email, phone, org_unit (name or id; defaults to defaultOrgUnitId), work_profile (driver, practitioner, foreman, manager), valid_from (date). The actor needs members.manage over defaultOrgUnitId. Every row is checked against the members.manage scope of the actor: a row whose org_unit is outside that scope is a row error. A row matching an existing person by e-mail or phone becomes an update only when that person is within the scope (members.manage over the current home unit); a match outside the members.manage scope of the actor (another unit, an owner, a member hidden from the actor) is a row error with the same text as an invalid row, and the preview never reveals the match, the memberId or the existing values. An update never moves the person to another home unit unless the actor has members.manage over the old and the new unit (as updateGroup). Unknown or missing header columns return 422 validation_failed. The preview expires after 24 hours."
    responses:

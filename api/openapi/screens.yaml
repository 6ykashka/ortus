      [getMyDecisionQueue, listTripPlans, getMyContext, chooseReservation, assignTripVehicle]
    note: >-
      Источники «Требует решения» этапа 2 — логистика (дефект, приёмка, рейс без водителя) и организация (пробный
      период, место, сотрудники без роли); источники этапов 4–7 (задачи, SPA, ремонт, обращения, документы, чаты,
      касса) — allowlist out-of-stage. Тексты карточек собирает клиент из словаря по kind и params. W2.71 (S2-20,
      D-35 комплекта): «водитель ещё не выбрал машину» (fleet.vehicle_choice_pending, «Оставить …» = chooseReservation) и «нет

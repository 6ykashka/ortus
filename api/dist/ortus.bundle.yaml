        path: /api/v1/realtime
        protocol: ortus.realtime.v1
        auth: first-frame
        messages:
          client:
            $ref: "#/components/schemas/RealtimeClientMessage"
          server:
            $ref: "#/components/schemas/RealtimeServerMessage"
      responses:
        "201":
          description: Ticket issued.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:

# Матрица изоляции: тег Chats («Чаты») контрактного PR этапа 7 (W7.00, 0.12.0-stage7) — хендлер W7.11 влит, строки без pending.
# Данные «Чаты» — данные организации (tenant 0060): чужая организация — 404, как несуществующая (AC-01, AC-02), без сессии — 401.
# Объектные id в пути — tenant:missing (такого объекта нет ни в одной базе) и чат фикстур chat:<тенант>.trip (W7.11,
# fixtures/content_chats.go: рабочий чат без состава — его видит владелец бизнеса). Отказы шлюза по правам — chats_w700_gate.yaml. Публичные операции без тенанта (нет)
# в матрицу не входят: у них нет организации в пути, строки добавит владелец публичного контура (W7.23b, W7.31b).
# Формат — README.md. После правки: go -C backend generate ./test/isolation
module: chats_w700
endpoints:
  - op: listChats
    method: GET
    path: /api/v1/tenants/{tenantId}/chats
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        present: [chat:a.trip]
        absent: [chat:b.trip]
        note: владелец бизнеса видит чаты своей организации и только их
      - actor: b.owner
        params: { tenantId: tenant:b }
        status: 200
        present: [chat:b.trip]
        absent: [chat:a.trip]
        note: чаты организации B — только свои

# Матрица изоляции: отказы шлюза календаря ресурсов (W4.06, контракт 0.7.0-stage4) — без pending. Шлюз cmd/api допускает
# операцию, только если у актора есть грант с calendar.bookings.read в области tenant, unit или self (x-scope
# tenant-org-unit-self). У шаблонов фикстур «Менеджер логистики» и «Водитель» его нет (у водителя — только
# calendar.availability.read) — 403 до хендлера, верно и после него (README.md, «Как WS добавляет строки»). Перенос —
# calendar.bookings.manage (нет ни у кого из шаблонов, кроме владельца), слоты — calendar.availability.read (у
# «Менеджера логистики» нет). Команда с If-Match получает 403 шлюза раньше предусловия; id брони — tenant:missing.
# Формат — README.md. После правки: go -C backend generate ./test/isolation
module: calendar_w406_gate
endpoints:
  - op: listCalendarResources
    method: GET
    path: /api/v1/tenants/{tenantId}/calendar/resources
    rows:
      - actor: a.driver-msk1
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        note: водителю календарь ресурсов закрыт (пример listCalendarResources/forbidden_action)
      - actor: a.manager-msk1
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        note: у шаблона «Менеджер логистики» фикстур нет calendar.bookings.read
  - op: listCalendarBookings
    method: GET
    path: /api/v1/tenants/{tenantId}/calendar/bookings
    rows:
      - actor: a.region-msk
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        note: менеджер региона без calendar.bookings.read
  - op: getCalendarBooking
    method: GET
    path: /api/v1/tenants/{tenantId}/calendar/bookings/{bookingId}
    rows:
      - actor: a.driver-msk1
        params: { tenantId: tenant:a, bookingId: tenant:missing }
        status: 403
        code: forbidden_action
        note: у водителя только calendar.availability.read — бронь по id не читает
  - op: updateCalendarBooking
    method: PATCH
    path: /api/v1/tenants/{tenantId}/calendar/bookings/{bookingId}
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, bookingId: tenant:missing }
        status: 403
        code: forbidden_action
        body: '{"action": "cancel"}'
        note: без calendar.bookings.manage — 403 шлюза раньше If-Match (lock permission)
      - actor: a.driver-msk1
        params: { tenantId: tenant:a, bookingId: tenant:missing }
        status: 403
        code: forbidden_action
        body: '{"action": "cancel"}'
  - op: findCalendarAvailability
    method: POST
    path: /api/v1/tenants/{tenantId}/calendar/availability
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        body: '{"orgUnitId": "{{unit:a.msk1}}", "window": {"startsAt": "2026-10-01T05:00:00Z", "endsAt": "2026-10-01T17:00:00Z", "timeZone": "Europe/Moscow"}, "durationMinutes": 60, "stepMinutes": 15, "requirements": [{"kind": "vehicle", "resourceIds": ["{{vehicle:a.msk1}}"], "requiredCount": 1}]}'
        note: у шаблона «Менеджер логистики» фикстур нет calendar.availability.read

x-contract-status: design-proposal-not-implemented
x-authorization-order:
  - authenticate
  - tenant-membership-and-binding
  - tenant-state
  - module-installation
  - plan-entitlement
  - separation-of-duties
  - permission
  - resource-scope
  - relationship
  - field-policy
x-separation-of-duties:
  rule: active_driver_work_profile_incompatible_with_earnings
  evaluate:
    - active professional assignments / member workProfiles
    - direct roles
    - group memberships
    - role changes
    - scope inheritance
    - temporary grants
    - owner binding
  onConflict: 409 separation_of_duties_conflict
  runtime: deny earnings for an active driver work profile even when a conflicting grant or owner binding exists; a driving qualification alone does not activate the work profile

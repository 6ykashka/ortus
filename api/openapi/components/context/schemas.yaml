# Контракт Ортус · компоненты тега context. Пишет только стюард контракта (план v2 §3.5).
ScopedCapability:
  type: object
  additionalProperties: false
  properties:
    permission:
      type: string
    scope:
      $ref: ../common/schemas.yaml#/Scope
  required:
    - permission
    - scope
ModuleAvailability:
  type: object
  additionalProperties: false
  properties:
    moduleKey:
      type: string
    state:
      type: string
      enum:
        - uninstalled
        - active
        - draining
        - read_only
        - disabled
        - suspended
    accessMode:
      type: string
      enum:
        - none
        - read
        - write
        - finish_only
    reason:
      type: string
      enum:
        - available
        - not_installed
        - disabled
        - plan_expired
        - permission_denied
        - tenant_suspended
        - draining
  required:
    - moduleKey
    - state
    - accessMode
    - reason
TenantContext:
  type: object
  additionalProperties: false
  properties:
    tenantId:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
    membershipId:
      $ref: ../common/schemas.yaml#/Id
    membershipStatus:
      type: string
      enum:
        - active
        - suspended
    orgUnitIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
    modules:
      type: array
      items:
        $ref: ./schemas.yaml#/ModuleAvailability
    capabilities:
      type: array
      items:
        $ref: ./schemas.yaml#/ScopedCapability
    tenantState:
      $ref: ./schemas.yaml#/TenantState
    # W4.07 (stage 4.6): оформление организации для темы оболочки (18-branding «Заметки по реализации»).
    branding:
      $ref: ../common/schemas.yaml#/BrandingTheme
      description: Theme of the branding in force of this organization (without the author of the version, which only the owner sees in getTenantBranding), the same for every member (the theme provider of the shell applies accentVariants as --ox-accent… and the terms and menu overrides). Changes arrive as context.changed (ADR-0015). Absent while the server does not deliver it.
  required:
    - tenantId
    - name
    - membershipId
    - membershipStatus
    - orgUnitIds
    - modules
    - capabilities
MeContext:
  type: object
  additionalProperties: false
  properties:
    userId:
      $ref: ../common/schemas.yaml#/Id
    displayName:
      type: string
    platformOperator:
      type: boolean
    tenants:
      type: array
      items:
        $ref: ./schemas.yaml#/TenantContext
    permissionVersion:
      type: string
    lastTenantId:
      type:
        - string
        - "null"
      format: uuid
  required:
    - userId
    - displayName
    - platformOperator
    - tenants
    - permissionVersion
  description: Returns only memberships visible to the authenticated identity. No tenant is selected implicitly for writes; the URL is authoritative. Capabilities help render UI; the backend always authorizes independently.
TenantSelection:
  type: object
  additionalProperties: false
  properties:
    tenantId:
      $ref: ../common/schemas.yaml#/Id
  required:
    - tenantId
Notification:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    tenantId:
      $ref: ../common/schemas.yaml#/Id
    kind:
      type: string
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
      description: Source event type without the version suffix (fleet.trip.submitted, members.invitation.accepted).
    severity:
      type: string
      enum:
        - info
        - warning
        - critical
    title:
      type: string
      minLength: 1
      maxLength: 300
    body:
      type: string
      maxLength: 2000
    object:
      $ref: ../common/schemas.yaml#/ObjectRef
    link:
      type: string
      maxLength: 512
      pattern: ^/(?:[^/\\\s\x00-\x1f\x7f][^\\\s\x00-\x1f\x7f]*)?$
      description: Same-origin relative application path (same rule as startLogin returnTo — single leading /, no backslash, whitespace or control characters; tenant 0003 enforces it with a CHECK); the target is authorized again when opened.
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    readAt:
      type:
        - string
        - "null"
      format: date-time
  required:
    - id
    - tenantId
    - kind
    - severity
    - title
    - createdAt
    - readAt
  description: Payload carries no restricted fields (earnings, personal data beyond the display name).
NotificationPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/Notification
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
    unreadCount:
      type: integer
      minimum: 0
      format: int64
  required:
    - items
    - nextCursor
    - unreadCount
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
NotificationTenantSummary:
  type: object
  additionalProperties: false
  properties:
    tenantId:
      $ref: ../common/schemas.yaml#/Id
    unreadCount:
      type: integer
      minimum: 0
      format: int64
    latestAt:
      type:
        - string
        - "null"
      format: date-time
  required:
    - tenantId
    - unreadCount
    - latestAt
NotificationSummary:
  type: object
  additionalProperties: false
  properties:
    totalUnread:
      type: integer
      minimum: 0
      format: int64
    tenants:
      type: array
      items:
        $ref: ./schemas.yaml#/NotificationTenantSummary
  required:
    - totalUnread
    - tenants
NotificationReadRequest:
  type: object
  additionalProperties: false
  properties:
    tenantId:
      $ref: ../common/schemas.yaml#/Id
    notificationIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
      minItems: 1
      maxItems: 200
      uniqueItems: true
    upTo:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - tenantId
  minProperties: 2
  maxProperties: 2
  description: Exactly one of notificationIds and upTo, enforced by the schema (tenantId is required, no other properties are allowed, and the object has exactly two properties); a violation is 422 validation_failed. Expressed without oneOf so that generated Go and TypeScript types stay a plain struct.
NotificationCounter:
  type: object
  additionalProperties: false
  properties:
    tenantId:
      $ref: ../common/schemas.yaml#/Id
    unreadCount:
      type: integer
      minimum: 0
      format: int64
  required:
    - tenantId
    - unreadCount

# W1.00 (0.4.0-stage1): состояние организации в /me/context (S1-19, баннеры оболочки).
TenantState:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - provisioning
        - trial
        - active
        - grace
        - read_only
        - suspended
        - closing
        - closed
      description: Tenant.status (PLAT-02).
    trialEndsAt:
      $ref: ../common/schemas.yaml#/Instant
    graceEndsAt:
      $ref: ../common/schemas.yaml#/Instant
    storageWriteStatus:
      type: string
      enum:
        - allowed
        - blocked
      description: blocked — committed and reserved bytes reached the quota; new uploads are refused (Место организации заполнено).
  required:
    - status
    - storageWriteStatus
  description: What every member needs for the shell banners (trial ended, suspended, storage full) without billing.read. Amounts, quotas and plan are not exposed here.

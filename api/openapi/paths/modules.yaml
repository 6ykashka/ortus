# Контракт Ортус · тег Modules: пути и операции. Пишет только стюард контракта (план v2 §3.5).
/api/v1/tenants/{tenantId}/modules:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listModuleCatalog
    tags:
      - Modules
    summary: Read trusted module manifests and permission catalog
    x-permissions:
      - modules.read
    x-scope: tenant
    description: Read trusted module manifests and permission catalog
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/modules/schemas.yaml#/ModuleCatalog
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "402":
        $ref: ../components/common/responses.yaml#/PlanRequired
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-permissions-mode: all
/api/v1/tenants/{tenantId}/modules/{moduleKey}:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
    - $ref: ../components/common/parameters.yaml#/moduleKey
  put:
    operationId: setModuleInstallation
    tags:
      - Modules
    summary: Install, enable or disable a module
    x-permissions:
      - modules.manage
    x-scope: tenant-owner
    description: Idempotent desired-state API; installation provisioning and migrations are server-owned. Required dependencies and plan eligibility are validated. Disabling with active operations enters draining and exposes finish_only access for safe completion/evidence operations. Once drained, data and grants remain dormant. Re-enabling activates only unexpired grants after policy validation; it is audited. enabled=false defaults to retainedAccess=history_read and ends in read_only after draining. owner_export ends in disabled. Access-mode checks distinguish historical reads, finish-only commands and new work.
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/modules/schemas.yaml#/ModuleManifest
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "402":
        $ref: ../components/common/responses.yaml#/PlanRequired
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "412":
        $ref: ../components/common/responses.yaml#/PreconditionFailed
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
      - $ref: ../components/common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/modules/schemas.yaml#/ModuleInstallationUpdate
    x-permissions-mode: all
  get:
    operationId: getModuleInstallation
    tags:
      - Modules
    summary: Read installation state and revision
    x-permissions:
      - modules.read
    x-scope: tenant
    description: Read installation state and revision
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/modules/schemas.yaml#/ModuleManifest
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "402":
        $ref: ../components/common/responses.yaml#/PlanRequired
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-permissions-mode: all

/api/v1/tenants/{tenantId}/chats/{chatId}/messages:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
    - $ref: ../components/common/parameters.yaml#/chatId
  get:
    operationId: listChatMessages
    tags:
      - Chats
    summary: Read messages of a chat
    x-permissions:
      - chat.read
    x-scope: chat
    description: W7.00 (chats.md §2.2). Messages with the PDn mask, a deleted message folded to a label (never the old text, files, poll or edit log — PD-60), results of reads, polls and important. «Видно только вам» messages only for their addressee.
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/chats/schemas.yaml#/ChatMessageList
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Limit
      - name: topic
        in: query
        required: false
        description: Only the messages of the topic.
        schema:
          type: string
          maxLength: 60
      - name: beforeSeq
        in: query
        required: false
        description: Page back from this seq.
        schema:
          type: integer
          minimum: 1
          format: int64
      - name: afterSeq
        in: query
        required: false
        description: Messages after this seq (after the hint chat.changed).
        schema:
          type: integer
          minimum: 0
          format: int64
    x-permissions-mode: all
  post:
    operationId: postChatMessage
    tags:
      - Chats
    summary: Post a message
    x-permissions:
      - chat.write
    x-scope: chat
    description: W7.00 (chats.md §2.2) (chatSend). Role not lower than member (announce — moderator), archived chat is closed (409 invalid_transition). 422 validation_failed — empty message, text over 4000, 2–10 poll options; 403 chat_content_forbidden; 403 chat_ephemeral_disabled; 413 chat_file_too_large; 409 chat_quota_full (the text still goes, the file does not) and quota_exceeded (organization storage). @all and @role — chat.announce at any size (Q-W4.00-chats-13). Emits chat.message.posted.v1 (no text in the payload) and the hint chat.changed.
    responses:
      "201":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/chats/schemas.yaml#/ChatMessage
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "413":
        $ref: ../components/common/responses.yaml#/TooLarge
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/chats/schemas.yaml#/ChatMessageCreate
    x-permissions-mode: all

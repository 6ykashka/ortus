    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/data/schemas.yaml#/DatasetView
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "412":
        $ref: ../components/common/responses.yaml#/PreconditionFailed
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
      - $ref: ../components/common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/data/schemas.yaml#/DatasetViewPatch
    x-permissions-mode: all
  delete:
    operationId: deleteDatasetView
    tags:
      - Data
    summary: Delete a saved view
    x-permissions:
      - data.query
    x-scope: effective-module-and-field-scopes
    description: "W4.06 (0.7.0-stage4, DATA-03). Requires data.query AND the dataset own permission; the author of a personal view (another member — 404); a shared view — its author with data.export or the owner of the organization. If-Match is the revision of the view. Export jobs started from the view keep their spec (DatasetExportJob.viewId stays, the view is gone)."
    responses:
      "204":
        description: Completed with no response body.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "412":
        $ref: ../components/common/responses.yaml#/PreconditionFailed
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
      - $ref: ../components/common/parameters.yaml#/IfMatch
    x-permissions-mode: all
# W4.06 (0.7.0-stage4, W4.50): выгрузка заданием с журналом (07-ux-and-data §3; 03-api-guide «Данные — export jobs, получение/отзыв результата»).
/api/v1/tenants/{tenantId}/datasets/{datasetId}/export-jobs:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
    - $ref: ../components/common/parameters.yaml#/datasetId
  post:
    operationId: createDatasetExportJob
    tags:
      - Data
    summary: Start an export of a dataset as a job
    x-permissions:
      - data.export
    x-scope: effective-module-and-field-scopes
    description: "W4.06 (0.7.0-stage4, 07-ux-and-data §3, prototype onExport «Выгрузка «{label}»: {N} строк, фильтр и права зафиксированы.»). Requires data.export AND the dataset own permission (Dataset.permissionKey) in the scope of the rows; the same validation of select, filters, search and sort as exportDataset (a hidden or unknown field — 422 validation_failed, code unknown_field; a dataset without export — 403 forbidden_action; unknown or of a disabled module — 404). The job fixes the spec, the column labels, the schema and permission versions of the dataset, the time zone of the organization and the author; the worker takes the snapshot (snapshotAt) when it starts, rechecks the rights of the author at that moment (narrowed — the job ends revoked, revokeReason permissions_changed) and writes the CSV of exportDataset (the same cells, delimiter, quoting and formula protection) of up to 100 000 rows (rowLimit; more — the first rows by sort and truncated). viewId — the saved view the export started from (journal only; the spec is in the body; a view the member may not see — 404). At most 3 queued or running jobs of a member — 429 rate_limited «Дождитесь завершения начатых выгрузок.». Writes the audit data.export.requested (dataset, filters, never rows); the ready file is kept 24 h (expiresAt). Answers 202 with the job in state queued."
    responses:
      "202":
        description: Accepted — the job is queued.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/data/schemas.yaml#/DatasetExportJob
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/data/schemas.yaml#/DatasetExportJobCreate
    x-permissions-mode: all
/api/v1/tenants/{tenantId}/data/export-jobs:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listDatasetExportJobs
    tags:
      - Data
    summary: Read the journal of export jobs
    x-permissions:
      - data.export
    x-scope: effective-module-and-field-scopes
    description: "W4.06 (0.7.0-stage4, 07-ux-and-data §3 «его создание журналируется»). The journal of export jobs: the jobs of the member; the owner of the organization — the jobs of all members (who, when, dataset, spec, row count, state — never the file or rows of another member). Filters datasetId and state; newest first (createdAt, then id). A job past expiresAt is reported expired."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/data/schemas.yaml#/DatasetExportJobPage
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Cursor
      - $ref: ../components/common/parameters.yaml#/Limit
      - name: datasetId
        in: query
        required: false
        description: Only the jobs of this dataset.
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{1,99}$
      - name: state
        in: query
        required: false
        description: Only the jobs in these states (repeat the parameter); without it — all.
        style: form
        explode: true
        schema:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum:
              - queued
              - running
              - ready
              - failed
              - expired
              - revoked
    x-permissions-mode: all
/api/v1/tenants/{tenantId}/data/export-jobs/{exportJobId}:

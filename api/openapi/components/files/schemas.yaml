# Контракт Ортус · компоненты тега files. Пишет только стюард контракта (план v2 §3.5).
UploadCreate:
  type: object
  additionalProperties: false
  properties:
    fileName:
      type: string
      minLength: 1
      maxLength: 255
    contentType:
      type: string
    sizeBytes:
      type: integer
      minimum: 1
      format: int64
    sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    purpose:
      type: string
      enum:
        - inspection
        - expense_receipt
        - knowledge_attachment
        - form_attachment
        - repair_evidence
    owner:
      $ref: ../common/schemas.yaml#/ObjectRef
  required:
    - fileName
    - contentType
    - sizeBytes
    - sha256
    - purpose
    - owner
  description: Reject oversized or unsupported MIME; reserve bytes before issuing a URL. Owner belongs to same tenant and the actor can attach files to it. Before inspection creation, departure photos attach to the reservation and return photos to the trip; submitInspection binds them atomically to its evidence. Expense receipts likewise attach to the trip before expense creation. A repair report may attach photos to its project before the work log exists. These are explicit allowed owner transitions, never arbitrary reparenting. File display name is not an object storage path.
UploadComplete:
  type: object
  additionalProperties: false
  properties:
    sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
  required:
    - sha256
DownloadTicket:
  type: object
  additionalProperties: false
  properties:
    fileId:
      $ref: ../common/schemas.yaml#/Id
    downloadUrl:
      type: string
      format: uri
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - fileId
    - downloadUrl
    - expiresAt
  description: Short-lived URL only after current object+field permission and ready state checks. Private-by-default storage; direct object keys never form part of this API.
UploadSession:
  type: object
  additionalProperties: false
  properties:
    uploadId:
      $ref: ../common/schemas.yaml#/Id
    fileId:
      $ref: ../common/schemas.yaml#/Id
    state:
      type: string
      enum:
        - issued
        - uploaded
        - completed
        - expired
        - aborted
      description: issued — ticket handed out; uploaded — object seen in quarantine; completed — completeUpload accepted (scan follows); expired/aborted — reservation released.
    purpose:
      type: string
      enum:
        - inspection
        - expense_receipt
        - knowledge_attachment
        - form_attachment
        - repair_evidence
      description: Same values as UploadCreate.purpose of initiateUpload (0.1). The value is stored verbatim in files.objects.purpose (tenant 0001), one to one, without dotted refinements; the dotted examples in the 0001 column comment (inspection.front, expense.receipt) predate the contract and are not used. The slot inside the owner (front, rear, receipt…) belongs to the owning object, not to purpose.
    owner:
      $ref: ../common/schemas.yaml#/ObjectRef
    sizeBytes:
      type: integer
      minimum: 1
      format: int64
    reservedBytes:
      type: integer
      minimum: 0
      format: int64
    ticketExpiresAt:
      $ref: ../common/schemas.yaml#/Instant
    sessionExpiresAt:
      $ref: ../common/schemas.yaml#/Instant
    fileStatus:
      type: string
      enum:
        - pending_upload
        - quarantined
        - ready
        - rejected
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - uploadId
    - fileId
    - state
    - purpose
    - owner
    - sizeBytes
    - reservedBytes
    - ticketExpiresAt
    - sessionExpiresAt
    - fileStatus
    - createdAt
  description: Upload session (S1-20) — quota reservation, private PUT ticket, completion and scan. A session never grants list, read or delete rights on other files.

# W1.00 (0.4.0-stage1): список файлов (S1-21).
FileListItem:
  type: object
  additionalProperties: false
  properties:
    file:
      $ref: ../common/schemas.yaml#/File
    purpose:
      type: string
      enum:
        - inspection
        - expense_receipt
        - knowledge_attachment
        - form_attachment
        - repair_evidence
      description: Same values as UploadCreate.purpose; stored in files.objects.purpose.
    owner:
      $ref: ../common/schemas.yaml#/ObjectRef
    ownerTitle:
      type: string
      maxLength: 200
      description: Short title of the parent object provided by its module (trip number, task key, vehicle plate); absent when the module gives none. Never shown for a parent the actor cannot read — such files are not listed at all.
  required:
    - file
    - purpose
    - owner
  description: A file with the parent object it is bound to (Фото и вложения всегда привязаны к исходному объекту).
FilePage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/FileListItem
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.

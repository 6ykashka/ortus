# Исходник: api/openapi/ortus.yaml, paths/<tag>.yaml, components/<группа>/<вид>.yaml.
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ORTUS CRM Constructor — Design API
  version: 0.5.1-stage2
  summary: Reviewable starting contract for a tenant-isolated modular CRM on Go; not an implemented or exhaustive API.
  description: |-
    Design snapshot, 2026-10-01. A tenant is one business holding; regions/companies/branches are scoped organization units within it. Platform administration is a separate control plane and never implies business-data access.

    Server is a documentation-only .invalid host. Authentication: Go BFF uses OIDC Authorization Code + PKCE and an HttpOnly, Secure, SameSite=Lax session cookie; browser JavaScript never stores refresh/access tokens. Integrations use OIDC-issued short-lived bearer tokens with a tenant audience/binding. Cookie-authenticated mutations require validated Origin and X-CSRF-Token. Bearer requests must not use cookies simultaneously. Public form endpoints have separate narrowly scoped capabilities and anti-abuse rules, not tenant bearer access.

    Every tenant operation verifies active membership, token tenant binding, module installation, plan entitlement, action permission, resource scope, relationship and field grants. URL tenantId never establishes authorization. Foreign and invisible object IDs return the same 404. Lists are filtered before pagination/aggregation. Error bodies do not confirm existence. Disabled modules retain dormant grants/data but their operational endpoints and datasets are inaccessible; expiration may permit entitled read-only access. Drivers cannot read earnings, including their own, from any channel. An active driver work profile and earnings permissions are mutually exclusive across direct/group roles, temporary grants and owner binding. The work profile is the v0.1 projection of an active professional driver assignment. Assignment, role edit, group edit and inheritance changes validate this closure and reject 409 separation_of_duties_conflict. Authorization denies earnings fail-closed if a legacy conflicting configuration is found. A driving qualification alone does not activate the driver work profile.

    All write bodies reject unknown properties. Read-modify-write requires strong If-Match ETag; absent required header yields 428 and stale ETag yields 412. Financial/booking/trip and other state changes require Idempotency-Key. Durable financial command receipts prevent re-execution after response-cache expiry. The server stores payload hash + outcome in the same transaction as the domain effect/outbox. After fresh authentication and authorization, same key+scope+payload replays original status/body, changed payload returns 409. The same key from another tenant or actor is a different namespace. In-flight duplicate returns 409 with Retry-After.

    Times are UTC RFC3339 instants plus IANA timezone. Intervals are half-open. Money uses bounded, exactly representable integer minor units plus ISO currency; quantities use decimal strings. Cursor values are opaque and bound to tenant, principal, scope version and query. Offline mobile mode stores drafts only: booking, vehicle release, return, quota and cash effects are confirmed exclusively by a successful online server transaction.

    See 03-api-guide.md for transaction boundaries, public-upload controls, the covered/deferred route matrix and example flows.
  license:
    name: Project design artifact; licensing to be selected by the project owner
servers:
  - url: https://api.example.invalid
    description: Placeholder only; no live server is implied.
security:
  - bearerAuth: []
  - sessionCookie: []

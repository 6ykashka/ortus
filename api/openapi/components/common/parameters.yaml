# Контракт Ортус · общие компоненты (используются несколькими тегами). Пишет только стюард контракта (план v2 §3.5).
# W2.52 (0.6.1-stage2): история машины (W2.42) и справочник категорий расходов (W2.41).
# W4.06 (0.7.0-stage4): сохранённый вид набора и задание выгрузки «Данных» (W4.50).
# W4.07 (stage 4.6): заявки на тариф, тарифная сетка, аккаунты и операторы платформы.
# W4.04: «База знаний» — пространство, узел дерева, номер версии узла, правило автоматизации.
# W4.03 (0.10.0-stage4): проект задач, правило автоматизации, пункт чек-листа, переход процесса («Задачи и проекты»).
# W4.05 (0.11.0-stage4): правило формы, вопрос формы, группа форм («Формы и опросы»).

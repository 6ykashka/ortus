# Контракт Ортус · тег PublicService: пути и операции. Пишет только стюард контракта (план v2 §3.5).
/api/v1/public/service/{slug}:
  parameters:
    - $ref: ../components/common/parameters.yaml#/servicePortalSlug
  get:
    operationId: getPublicServicePage
    tags:
      - PublicService
    summary: Read the public page of a direction
    x-permissions: []
    x-scope: public-service-capability
    description: "W7.00 (service.md §2.3) (1a). Public page: types, working hours, no client data; rate limits of a guest (FORM-07). The tenant is found by the slug in the global control registry public_service_slugs (control 0011); the direction is service.directions.public_slug of that tenant; an unknown slug is 404."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/service/schemas.yaml#/PublicServicePage
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "410":
        $ref: ../components/common/responses.yaml#/Gone
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    security: []
    x-public-capability: slug of a published direction
    x-permissions-mode: all
/api/v1/public/service/{slug}/requests:
  parameters:
    - $ref: ../components/common/parameters.yaml#/servicePortalSlug
  post:
    operationId: submitPublicServiceRequest
    tags:
      - PublicService
    summary: Send a request from the client page
    x-permissions: []
    x-scope: public-service-capability
    description: W7.00 (service.md §2.3). Creates a request of the channel cabinet or widget; the personal link is returned once. 422 validation_failed (consent, text); the request is the task of the service project. The tenant is found by the slug in the control registry public_service_slugs (control 0011). Emits service.request.created.v1.
    responses:
      "201":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/service/schemas.yaml#/PublicServiceReceipt
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "410":
        $ref: ../components/common/responses.yaml#/Gone
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/service/schemas.yaml#/PublicServiceSubmit
    security: []
    x-public-capability: slug of a published direction; work token when known
    x-permissions-mode: all

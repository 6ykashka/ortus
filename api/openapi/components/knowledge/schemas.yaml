# Контракт Ортус · компоненты тега knowledge. Пишет только стюард контракта (план v2 §3.5).
KnowledgePage:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    title:
      type: string
    bodyMarkdown:
      type: string
    parentPageId:
      $ref: ../common/schemas.yaml#/Id
    scope:
      $ref: ../common/schemas.yaml#/Scope
    status:
      type: string
      enum:
        - draft
        - published
        - archived
    revision:
      type: integer
      minimum: 1
      format: int64
    updatedAt:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - id
    - title
    - bodyMarkdown
    - scope
    - status
    - revision
    - updatedAt
KnowledgePageCreate:
  type: object
  additionalProperties: false
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
    bodyMarkdown:
      type: string
      maxLength: 200000
    parentPageId:
      $ref: ../common/schemas.yaml#/Id
    scope:
      $ref: ../common/schemas.yaml#/Scope
  required:
    - title
    - bodyMarkdown
    - scope
KnowledgePagePatch:
  type: object
  additionalProperties: false
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
    bodyMarkdown:
      type: string
      maxLength: 200000
    status:
      type: string
      enum:
        - draft
        - published
        - archived
KnowledgePageList:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgePage
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
KnowledgeSpaceMy:
  type: object
  additionalProperties: false
  properties:
    owner:
      type: boolean
      description: "The member is an owner of the business: sees and edits everything."
    lead:
      type: boolean
      description: The lead of the space (kb_space_lead) or the owner of the business.
    view:
      type: boolean
      description: Reads the space by a role (its area or the space).
    create:
      type: boolean
      description: Creates pages at the top level («+», «Новая подстраница»).
    edit:
      type: boolean
      description: Edits any page of the space by a role.
    role:
      type: string
      maxLength: 120
      description: "Label of the role of the member on the card: «Владелец бизнеса», the name of the role of the space, «Читатель по уровню «{уровень}»» or empty («Вы: по ссылке на страницу» — a page assignment only)."
  required:
    - owner
    - lead
    - view
    - create
    - edit
    - role
  description: W4.04. The rights of the member in a space (prototype kbSpaceMy).
KnowledgeLastUpdate:
  type: object
  additionalProperties: false
  properties:
    nodeId:
      $ref: ../common/schemas.yaml#/Id
    title:
      type: string
      maxLength: 120
    at:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - nodeId
    - title
    - at
  description: "W4.04. The last published visible page of a space — «Обновлено: «{страница}», {дата}»."
KnowledgeSpace:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
      maxLength: 120
    icon:
      type: string
      pattern: ^[a-z_]{2,40}$
    color:
      type: string
      pattern: ^#[0-9A-Fa-f]{6}$
    orgUnitId:
      type:
        - string
        - "null"
      format: uuid
      description: "Area of the space — whose roles act in it: a region or a company; null — the whole organization."
    areaLabel:
      type: string
      maxLength: 200
      description: «Вся организация», «Регион «{name}»» or «Фирма «{name}»».
    access:
      type: string
      enum:
        - open
        - limited
        - closed
      description: "Level of the space: open — roles of the area act fully («Открытое»); limited — everyone in the area reads, members write («Ограниченное»); closed — members and the owner of the business only («Закрытое»)."
    templateKey:
      type:
        - string
        - "null"
      maxLength: 40
      description: Template the space was created from.
    homeNodeId:
      type:
        - string
        - "null"
      format: uuid
      description: The home page «Обзор» — the root node of the space that is never moved or archived.
    my:
      $ref: ./schemas.yaml#/KnowledgeSpaceMy
    leadNames:
      type: array
      items:
        type: string
        maxLength: 200
      maxItems: 50
      description: "Leads of the space; empty — «Руководитель: владелец бизнеса»."
    pageCount:
      type: integer
      minimum: 0
      description: Visible pages of the space without folders.
    lastUpdate:
      $ref: ./schemas.yaml#/KnowledgeLastUpdate
    openRequestCount:
      type: integer
      minimum: 0
      description: "Open access requests («Запросы доступа: N») — to the lead of the space only."
    revision:
      type: integer
      minimum: 1
      format: int64
  required:
    - id
    - name
    - icon
    - color
    - orgUnitId
    - areaLabel
    - access
    - templateKey
    - homeNodeId
    - my
    - leadNames
    - pageCount
    - revision
  description: W4.04 (knowledge.md §2.1). A space of the knowledge base — an access area (docs/23).
KnowledgeSpaceList:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeSpace
      maxItems: 200
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
KnowledgeSpaceCreate:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
      description: Name — 2–120 characters, unique in the organization.
    access:
      type: string
      enum:
        - open
        - limited
        - closed
    icon:
      type: string
      pattern: ^[a-z_]{2,40}$
    color:
      type: string
      pattern: ^#[0-9A-Fa-f]{6}$
    orgUnitId:
      type:
        - string
        - "null"
      format: uuid
      description: Area; null or absent — the whole organization.
    templateKey:
      type: string
      enum:
        - regs
        - staff
        - objects
        - blank
      default: blank
      description: Starting template (listKnowledgeSpaceTemplates).
    templateNodes:
      type: array
      items:
        type: integer
        minimum: 0
      maxItems: 50
      uniqueItems: true
      description: Indexes of the template nodes to create; absent — all.
  required:
    - name
    - access
KnowledgeSpacePatch:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 2
      maxLength: 120
    icon:
      type: string
      pattern: ^[a-z_]{2,40}$
    color:
      type: string
      pattern: ^#[0-9A-Fa-f]{6}$
    orgUnitId:
      type:
        - string
        - "null"
      format: uuid
    access:
      type: string
      enum:
        - open
        - limited
        - closed
    dryRun:
      type: boolean
      description: Return the impact without changing anything.
  minProperties: 1
KnowledgeImpactPerson:
  type: object
  additionalProperties: false
  properties:
    memberId:
      $ref: ../common/schemas.yaml#/Id
    displayName:
      type: string
      maxLength: 200
    pages:
      type: integer
      minimum: 1
      description: How many pages of the branch change for the employee.
  required:
    - memberId
    - displayName
    - pages
KnowledgeImpactSummary:
  type: object
  additionalProperties: false
  properties:
    pages:
      type: integer
      minimum: 0
    gainView:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeImpactPerson
      maxItems: 1000
    loseView:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeImpactPerson
      maxItems: 1000
    gainEdit:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeImpactPerson
      maxItems: 1000
    loseEdit:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeImpactPerson
      maxItems: 1000
  required:
    - pages
    - gainView
    - loseView
    - gainEdit
    - loseEdit
KnowledgeSpaceChange:
  type: object
  additionalProperties: false
  properties:
    applied:
      type: boolean
      description: "false — dryRun: nothing changed."
    space:
      $ref: ./schemas.yaml#/KnowledgeSpace
    impact:
      $ref: ./schemas.yaml#/KnowledgeImpactSummary
  required:
    - applied
    - space
    - impact
KnowledgeTemplateNode:
  type: object
  additionalProperties: false
  properties:
    index:
      type: integer
      minimum: 0
    kind:
      type: string
      enum:
        - page
        - folder
        - table
        - diagram
        - file
        - link
    title:
      type: string
      maxLength: 120
    parentIndex:
      type:
        - integer
        - "null"
      minimum: 0
    readerRoleLabel:
      type:
        - string
        - "null"
      maxLength: 120
      description: "A folder of a function: the role that reads it («Читают: роль «…»»)."
    requestAck:
      type: boolean
      description: "«Ознакомиться: все»."
  required:
    - index
    - kind
    - title
    - parentIndex
    - readerRoleLabel
    - requestAck
KnowledgeSpaceTemplate:
  type: object
  additionalProperties: false
  properties:
    key:
      type: string
      enum:
        - regs
        - staff
        - objects
        - blank
    name:
      type: string
      maxLength: 120
    icon:
      type: string
      pattern: ^[a-z_]{2,40}$
    hint:
      type: string
      maxLength: 300
    nodes:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeTemplateNode
      maxItems: 50
  required:
    - key
    - name
    - icon
    - hint
    - nodes
KnowledgeSpaceTemplateList:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeSpaceTemplate
      maxItems: 20
  required:
    - items
KnowledgeNodeMy:
  type: object
  additionalProperties: false
  properties:
    edit:
      type: boolean
      description: Edits the node («Править», «Переместить…»).
    lead:
      type: boolean
      description: The lead of the space or the owner of the business.
    create:
      type: boolean
      description: Creates subpages («Новая подстраница», «+»).
  required:
    - edit
    - lead
    - create
KnowledgeNodeSummary:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    spaceId:
      $ref: ../common/schemas.yaml#/Id
    parentId:
      type:
        - string
        - "null"
      format: uuid
      description: Parent node; null — the top level of the space.
    position:
      type: integer
      minimum: 0
    kind:
      type: string
      enum:
        - page
        - folder
        - table
        - diagram
        - file
        - link
    title:
      type: string
      maxLength: 120
    status:
      type: string
      enum:
        - draft
        - review
        - active
        - outdated
      description: draft «Черновик», review «На проверке», active «Действует», outdated «Пора пересмотреть» (Q-W4.00-knowledge-2).
    accessMode:
      type: string
      enum:
        - inherit
        - edit_listed
        - listed
      description: "Own access of the node: inherit «Как у родителя», edit_listed «Читают все, правят выбранные», listed «Только выбранные» (prototype key edit — edit_listed)."
    sensitivity:
      type: string
      enum:
        - normal
        - finance
      description: "finance — a finance page: closed for the function driver with any roles (AUTH-03)."
    archived:
      type: boolean
    version:
      type: integer
      minimum: 1
      description: Number of the current version.
    my:
      $ref: ./schemas.yaml#/KnowledgeNodeMy
  required:
    - id
    - spaceId
    - parentId
    - position
    - kind
    - title
    - status
    - accessMode
    - sensitivity
    - archived
    - version
    - my
  description: W4.04. A visible node of the tree (prototype kbView).
KnowledgeTree:
  type: object
  additionalProperties: false
  properties:
    space:
      $ref: ./schemas.yaml#/KnowledgeSpace
    nodes:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeNodeSummary
      maxItems: 5000
      description: Visible not archived nodes depth-first in the order of positions.
  required:
    - space
    - nodes
KnowledgeNodeRef:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    title:
      type: string
      maxLength: 120
  required:
    - id
    - title
KnowledgeVersion:
  type: object
  additionalProperties: false
  properties:
    version:
      type: integer
      minimum: 1
    publishedAt:
      $ref: ../common/schemas.yaml#/Instant
    authorDisplayName:
      type: string
      maxLength: 200
    body:
      type: string
      maxLength: 20000
      description: Text with paragraphs separated by an empty line, without Markdown (Q-W4.00-knowledge-16).
  required:
    - version
    - publishedAt
    - authorDisplayName
    - body
KnowledgeVersionSummary:
  type: object
  additionalProperties: false
  properties:
    version:
      type: integer
      minimum: 1
    publishedAt:
      $ref: ../common/schemas.yaml#/Instant
    authorDisplayName:
      type: string
      maxLength: 200
  required:
    - version
    - publishedAt
    - authorDisplayName
KnowledgeAckLogEntry:
  type: object
  additionalProperties: false
  properties:
    memberId:
      $ref: ../common/schemas.yaml#/Id
    displayName:
      type: string
      maxLength: 200
    version:
      type: integer
      minimum: 1
    at:
      $ref: ../common/schemas.yaml#/Instant
  required:
    - memberId
    - displayName
    - version
    - at
KnowledgeAck:
  type: object
  additionalProperties: false
  properties:
    version:
      type: integer
      minimum: 1
      description: The version the acknowledgement is requested for.
    audienceLabel:
      type: string
      maxLength: 200
      description: «все, кто видит страницу» or «роль «{роль}»».
    mine:
      type: object
      additionalProperties: false
      properties:
        required:
          type: boolean
          description: The member is in the audience («Подтвердите, что прочитали эту версию.»).
        done:
          type: boolean
          description: «Вы подтвердили, что ознакомились с этой версией».
      required:
        - required
        - done
    total:
      type: integer
      minimum: 0
      description: Audience — to the editors of the node and the lead.
    doneCount:
      type: integer
      minimum: 0
      description: «X из Y ознакомились» — to the editors of the node and the lead.
    pendingNames:
      type: array
      items:
        type: string
        maxLength: 200
      maxItems: 1000
      description: "«Ждём: …» — to the editors of the node and the lead."
    log:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeAckLogEntry
      maxItems: 5000
      description: Confirmations of all versions (KB-03) — to the lead of the space and the owner of the business only.
  required:
    - version
    - audienceLabel
    - mine
KnowledgeDiagram:
  type: object
  additionalProperties: false
  properties:
    steps:
      type: array
      items:
        type: string
        maxLength: 120
      maxItems: 8
    outcomes:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          text:
            type: string
            maxLength: 200
          tone:
            type: string
            enum:
              - ok
              - warn
        required:
          - text
          - tone
      maxItems: 2
  required:
    - steps
    - outcomes
KnowledgeFile:
  type: object
  additionalProperties: false
  properties:
    sizeLabel:
      type: string
      maxLength: 40
      description: «1,2 МБ».
    pages:
      type: integer
      minimum: 0
  required:
    - sizeLabel
    - pages
  description: "A file node: «PDF · {размер} · N страниц»; the preview is a placeholder (Q-W4.00-knowledge-18), files of the knowledge base — files with purpose knowledge_attachment."
KnowledgeLink:
  type: object
  additionalProperties: false
  properties:
    label:
      type: string
      maxLength: 200
    moduleKey:
      type: string
      pattern: ^[a-z][a-z0-9_-]{1,49}$
    icon:
      type: string
      pattern: ^[a-z_]{2,40}$
  required:
    - label
    - moduleKey
    - icon
  description: "A CRM record: «Запись CRM: открывается, если у вас есть доступ к ней» — the module of the record checks the access (Q-W4.00-knowledge-18)."
KnowledgeEntrySource:
  type: object
  additionalProperties: false
  properties:
    formId:
      $ref: ../common/schemas.yaml#/Id
    responseNumber:
      type: string
      maxLength: 40
      description: Number of the form response («R-1012»).
    formVersion:
      type: integer
      minimum: 1
  required:
    - formId
    - responseNumber
    - formVersion
KnowledgeTableColumn:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    name:
      type: string
      maxLength: 120
    type:
      type: string
      maxLength: 20
  required:
    - id
    - name
    - type
KnowledgeTableRow:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    addedAt:
      $ref: ../common/schemas.yaml#/Instant
    source:
      $ref: ./schemas.yaml#/KnowledgeEntrySource
    cells:
      type: object
      additionalProperties:
        type: string
        maxLength: 2000
      description: Column id → value.
  required:
    - id
    - addedAt
    - cells
KnowledgeTable:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    nodeId:
      $ref: ../common/schemas.yaml#/Id
    title:
      type: string
      maxLength: 120
    columns:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeTableColumn
      maxItems: 30
    rows:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeTableRow
      maxItems: 5000
  required:
    - id
    - nodeId
    - title
    - columns
    - rows
  description: W4.04. A table of a page — read-only; rows are added by forms («Строки добавляет форма после принятия ответа; исправления — через ответ формы.»).
KnowledgeEntry:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    nodeId:
      $ref: ../common/schemas.yaml#/Id
    addedAt:
      $ref: ../common/schemas.yaml#/Instant
    head:
      type: string
      maxLength: 200
    lines:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name:
            type: string
            maxLength: 120
          value:
            type: string
            maxLength: 2000
        required:
          - name
          - value
      maxItems: 100
    source:
      $ref: ./schemas.yaml#/KnowledgeEntrySource
  required:
    - id
    - nodeId
    - addedAt
    - head
    - lines
    - source
  description: W4.04. A form entry of a page (D-26 комплекта, the block under the text — no-reference, Q-W4.00-knowledge-14).
KnowledgeNode:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    spaceId:
      $ref: ../common/schemas.yaml#/Id
    parentId:
      type:
        - string
        - "null"
      format: uuid
      description: Parent node; null — the top level of the space.
    position:
      type: integer
      minimum: 0
    kind:
      type: string
      enum:
        - page
        - folder
        - table
        - diagram
        - file
        - link
    title:
      type: string
      maxLength: 120
    status:
      type: string
      enum:
        - draft
        - review
        - active
        - outdated
      description: draft «Черновик», review «На проверке», active «Действует», outdated «Пора пересмотреть» (Q-W4.00-knowledge-2).
    accessMode:
      type: string
      enum:
        - inherit
        - edit_listed
        - listed
      description: "Own access of the node: inherit «Как у родителя», edit_listed «Читают все, правят выбранные», listed «Только выбранные» (prototype key edit — edit_listed)."
    sensitivity:
      type: string
      enum:
        - normal
        - finance
      description: "finance — a finance page: closed for the function driver with any roles (AUTH-03)."
    archived:
      type: boolean
    version:
      type: integer
      minimum: 1
      description: Number of the current version.
    my:
      $ref: ./schemas.yaml#/KnowledgeNodeMy
    spaceName:
      type: string
      maxLength: 120
    path:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeNodeRef
      maxItems: 6
      description: "Ancestors from the top level: «Пространство › … › страница»."
    owner:
      type: object
      additionalProperties: false
      properties:
        memberId:
          type:
            - string
            - "null"
          format: uuid
        displayName:
          type: string
          maxLength: 200
      required:
        - memberId
        - displayName
    reviewBy:
      type:
        - string
        - "null"
      format: date
      description: «пересмотреть до {дата}».
    current:
      $ref: ./schemas.yaml#/KnowledgeVersion
    versions:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeVersionSummary
      maxItems: 1000
      description: Versions, newest first («Версии»).
    ack:
      $ref: ./schemas.yaml#/KnowledgeAck
    diagram:
      $ref: ./schemas.yaml#/KnowledgeDiagram
    file:
      $ref: ./schemas.yaml#/KnowledgeFile
    link:
      $ref: ./schemas.yaml#/KnowledgeLink
    tables:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeTable
      maxItems: 20
    entries:
      type: array
      items:
        $ref: ./schemas.yaml#/KnowledgeEntry
      maxItems: 500
    revision:
      type: integer
      minimum: 1
      format: int64
      description: Number of the current version — the ETag and If-Match of publishKnowledgeNodeVersion.
  required:
    - id
    - spaceId
    - parentId
    - position
    - kind
    - title
    - status
    - accessMode
    - sensitivity
    - archived
    - version
    - my
    - spaceName
    - path
    - owner
    - reviewBy
    - current
    - versions
    - tables
    - entries
    - revision
  description: "W4.04 (knowledge.md §2.1). A node of the tree: page, folder, table, diagram, file or CRM record."
KnowledgeNodeCreate:
  type: object
  additionalProperties: false
  properties:
    parentId:
      type:
        - string
        - "null"
      format: uuid
      description: Parent node; null or absent — the top level.
    kind:
      type: string
      enum:
        - page
        - folder
        - diagram
    title:
      type: string
      minLength: 2
      maxLength: 120
  required:
    - kind
    - title
KnowledgePublish:
  type: object
  additionalProperties: false
  properties:
    title:
      type: string
      minLength: 2
      maxLength: 120
    body:
      type: string
      maxLength: 20000

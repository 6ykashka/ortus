/api/v1/public/forms/{publicToken}/uploads/{uploadId}/status:
  parameters:
    - $ref: ../components/common/parameters.yaml#/publicToken
    - $ref: ../components/common/parameters.yaml#/uploadId
  post:
    operationId: getPublicUploadStatus
    tags:
      - PublicForms
    summary: Read only the nonce-owned upload scan state
    x-permissions: []
    x-scope: form-version-field-and-nonce
    description: Read-only POST keeps nonce out of URL logs. Check capability, nonce and upload ownership; no response enumeration or download URL. Rate-limited polling.
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:

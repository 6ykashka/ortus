        status: 404
        absent: [tenant:a]
        body: '{"name": "Охрана труда", "access": "open", "templateKey": "blank"}'
        note: пространство в чужой организации — 404 до тела
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
        body: '{"name": "Охрана труда", "access": "open", "templateKey": "blank"}'

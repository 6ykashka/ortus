# Контракт Ортус · тег Repairs: пути и операции. Пишет только стюард контракта (план v2 §3.5).
/api/v1/tenants/{tenantId}/repairs/projects:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listRepairProjects
    tags:
      - Repairs
    summary: List visible repair objects with the summary of the list
    x-permissions:
      - repairs.projects.read
    x-scope: tenant-org-unit-repair-project
    description: "W6.00 (0.12.0-stage6, Q-W4.00-repair-1). List visible repair objects with the summary of the list: stage, readiness (accepted + pending), due date and forecast, foreman, the most urgent item of «Требует решения» and the count («ещё N вопросов»). The foreman gets only the objects where he is assigned (the server filters); amounts and the client phone are omitted without repairs.finance.read. Filter: active («Активные»), todo («Требуют решения»), draft («До договора»), done («Сданы»); q searches address, client and foreman. Order: first objects with questions (the most urgent), then by due date."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/repairs/schemas.yaml#/RepairProjectPage
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Cursor
      - $ref: ../components/common/parameters.yaml#/Limit
      - $ref: ../components/common/parameters.yaml#/RepairFilter
      - $ref: ../components/common/parameters.yaml#/RepairQuery
    x-permissions-mode: all
  post:
    operationId: createRepairProject
    tags:
      - Repairs
    summary: Create a repair object (a draft from a lead or an active one)
    x-permissions:
      - repairs.projects.manage
    x-scope: tenant-org-unit
    description: "W6.00 (Q-W4.00-repair-16). Create a draft object at the lead stage «Замер» (status draft: only the measurement and the estimate, the foreman does not see it) or an active object. The foreman and the budget are optional: an object without a foreman is a regular scenario («Не назначен прораб»). Creates local non-login workers and an empty measurement (version 1) in one transaction. Event repairs.object.draft_created.v1."
    responses:
      "201":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/repairs/schemas.yaml#/RepairProject
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "402":
        $ref: ../components/common/responses.yaml#/PlanRequired
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/repairs/schemas.yaml#/RepairProjectCreate
    x-permissions-mode: all

        code: forbidden_action
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
  - op: saveTaskWorkflowDraft
    method: PUT
    path: /api/v1/tenants/{tenantId}/projects/{projectId}/workflow/draft
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing }
        status: 403
        code: forbidden_action
        body: '{"statuses":[{"id":"s1","name":"Новая","category":"todo"}],"transitions":[]}'
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
  - op: discardTaskWorkflowDraft
    method: DELETE
    path: /api/v1/tenants/{tenantId}/projects/{projectId}/workflow/draft
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing }
        status: 403
        code: forbidden_action
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
  - op: publishTaskWorkflow
    method: POST
    path: /api/v1/tenants/{tenantId}/projects/{projectId}/workflow/draft/publish
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing }
        status: 403
        code: forbidden_action
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
  - op: listTaskProjectMembers
    method: GET
    path: /api/v1/tenants/{tenantId}/projects/{projectId}/members
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing }
        status: 403
        code: forbidden_action
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
  - op: setTaskProjectMemberRole
    method: PUT
    path: /api/v1/tenants/{tenantId}/projects/{projectId}/members/{memberId}
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing, memberId: person:a.driver-msk1@a }
        status: 403
        code: forbidden_action
        body: '{"roleId":"{{role:a.project_manager}}"}'
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
      - actor: a.project-approver
        params: { tenantId: tenant:a, projectId: project:a.fleet, memberId: person:a.driver-msk1@a }
        status: 403
        code: forbidden_action
        body: '{"roleId":"{{role:a.project_manager}}"}'
        note: без tasks.members.manage «Согласующий» (только tasks.approve) — 403 шлюза (Q-W4.03-15)
  - op: removeTaskProjectMember
    method: DELETE
    path: /api/v1/tenants/{tenantId}/projects/{projectId}/members/{memberId}
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing, memberId: person:a.driver-msk1@a }
        status: 403
        code: forbidden_action
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
  - op: checkTaskProjectAccess
    method: GET
    path: /api/v1/tenants/{tenantId}/projects/{projectId}/members/{memberId}/access?action=tasks.read
    rows:
      - actor: a.driver-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing, memberId: person:a.manager-msk1@a }
        status: 403
        code: forbidden_action
        note: нет tasks.members.manage и members.read — 403 шлюза
  - op: listTaskAutomations
    method: GET
    path: /api/v1/tenants/{tenantId}/projects/{projectId}/automations
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing }

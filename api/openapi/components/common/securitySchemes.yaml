# Контракт Ортус · общие компоненты (используются несколькими тегами). Пишет только стюард контракта (план v2 §3.5).
bearerAuth:
  type: http
  scheme: bearer
  bearerFormat: JWT
  description: OIDC-issued short-lived API access token. Validate signature, issuer, audience, exp, nbf and tenant binding. Platform tokens have distinct audience/capability from tenant tokens.
sessionCookie:
  type: apiKey
  in: cookie
  name: __Host-ortus_session
  description: Secure HttpOnly SameSite=Lax host-only browser session issued after OIDC + PKCE. Mutations also require X-CSRF-Token and exact allowed Origin. Do not send this cookie with a bearer token.

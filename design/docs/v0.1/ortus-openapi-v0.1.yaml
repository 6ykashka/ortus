          type: string
      required:
      - versionId
      - submissionNonce
      - answers
      description: Nonce is bound to public token+version+browser session; short-lived. Server can require
        antiAbuseToken at risk thresholds. Uploaded file IDs must belong to the same nonce/form field and be
        ready. A changed live version yields 409 form_version_changed rather than reinterpreting answers. Nonce
        is single-use for a committed response. Idempotency replay is checked after capability authorization
        but before the consumed-nonce rejection. Anonymous idempotency namespace is tenant+publicToken digest+nonce+operation;
        never one global anonymous actor.

        cargoWidthM:
          $ref: "#/components/schemas/Quantity"
        cargoHeightM:
          $ref: "#/components/schemas/Quantity"
      required:
        - payloadKg
        - volumeM3
        - cargoLengthM
        - cargoWidthM
        - cargoHeightM
    VehicleCreate:
      type: object
      additionalProperties: false
      properties:
        orgUnitId:
          $ref: "#/components/schemas/Id"
        registrationNumber:
          type: string
        displayName:
          type: string
        bodyType:
          type: string
          enum:
            - van
            - box
            - flatbed
            - refrigerated
            - tent
        capacity:
          $ref: "#/components/schemas/VehicleCapacity"
        temperatureMinC:
          $ref: "#/components/schemas/Decimal"
        temperatureMaxC:
          $ref: "#/components/schemas/Decimal"
        equipment:
          type: array
          items:
            type: string
            enum:
              - tail_lift
              - side_loading
              - pallet_jack
              - refrigerator
        odometerKm:
          $ref: "#/components/schemas/Quantity"
        depot:
          type: string
          maxLength: 200
          description: W2.00 (0.5.0-stage2). Home depot or yard of the vehicle.
      required:
        - orgUnitId

# Матрица изоляции: тег Service («Обращения») контрактного PR этапа 7 (W7.00, 0.12.0-stage7) — отказы шлюза без pending.
# «Администратор» фикстур не имеет ни одного действия chat.*, docs.*, service.*: шлюз cmd/api отвечает 403 forbidden_action
# до хендлера (нет гранта с действием x-permissions в виде области x-scope), и это верно после него. Формат — README.md.
# После правки: go -C backend generate ./test/isolation
module: service_w700_gate
endpoints:
  - op: listServiceDirections
    method: GET
    path: /api/v1/tenants/{tenantId}/service/directions
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        note: нет service.requests.read
  - op: createServiceDirection
    method: POST
    path: /api/v1/tenants/{tenantId}/service/directions
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        body: "{}"
        note: нет service.directions.manage
  - op: listServiceRequests
    method: GET
    path: /api/v1/tenants/{tenantId}/service/requests
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        note: нет service.requests.read
  - op: createServiceRequest
    method: POST
    path: /api/v1/tenants/{tenantId}/service/requests
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        body: "{}"
        note: нет service.requests.create
  - op: getServiceQueueCounts
    method: GET
    path: /api/v1/tenants/{tenantId}/service/queues
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        note: нет service.requests.read
  - op: getServiceRequest
    method: GET
    path: /api/v1/tenants/{tenantId}/service/requests/{requestId}
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a, requestId: tenant:missing }
        status: 403
        code: forbidden_action
        note: нет service.requests.read
  - op: updateServiceRequest
    method: PATCH
    path: /api/v1/tenants/{tenantId}/service/requests/{requestId}
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a, requestId: tenant:missing }
        status: 403
        code: forbidden_action
        body: "{}"
        note: нет service.requests.reply
  - op: postServiceMessage
    method: POST
    path: /api/v1/tenants/{tenantId}/service/requests/{requestId}/messages
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a, requestId: tenant:missing }
        status: 403
        code: forbidden_action
        body: "{}"
        note: нет service.requests.read
  - op: setServiceCompensation
    method: POST
    path: /api/v1/tenants/{tenantId}/service/requests/{requestId}/compensation
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a, requestId: tenant:missing }
        status: 403
        code: forbidden_action
        body: "{}"
        note: нет service.compensation.manage
  - op: transitionServiceRequest
    method: POST
    path: /api/v1/tenants/{tenantId}/service/requests/{requestId}/transitions
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a, requestId: tenant:missing }
        status: 403
        code: forbidden_action
        body: "{}"
        note: нет service.requests.reply или service.requests.resolve
  - op: moveServiceRequest
    method: POST
    path: /api/v1/tenants/{tenantId}/service/requests/{requestId}/move
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a, requestId: tenant:missing }
        status: 403
        code: forbidden_action
        body: "{}"
        note: нет service.requests.reply
  - op: revealServiceClientPhone
    method: POST
    path: /api/v1/tenants/{tenantId}/service/requests/{requestId}/client-phone/reveal
    rows:
      - actor: a.admin
        params: { tenantId: tenant:a, requestId: tenant:missing }
        status: 403
        code: forbidden_action
        body: "{}"
        note: нет service.clients.contacts
  - op: shareServiceConclusion
    method: POST

        present: [form:a.insp, form_group:a.checks]
        absent: [tenant:b]
        note: форма своей организации в своей группе; объектов тенанта B нет
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        note: чужая организация — как несуществующая (AC-02)
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401

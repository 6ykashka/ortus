# Матрица изоляции: отказы шлюза «Задач и проектов» (W4.03, контракт 0.10.0-stage4) — без pending. Шлюз cmd/api пускает
# операцию, только если у актора есть грант с действием x-permissions, вид области которого допускает x-scope операции.
# У шаблона «Менеджер логистики» фикстур (a.manager-msk1) нет ни одного действия core.tasks — 403 до хендлера и после
# него; «Проверить доступ» (tasks.members.manage или members.read) — водитель a.driver-msk1 (у него только tasks.read в
# области self). «Согласующий» a.project-approver (tasks.approve, tasks.read, tasks.projects.read, files.read) — 403 на операциях с
# другими правами (Q-W4.03-15). Команды с If-Match получают 403 шлюза раньше предусловия. Отказы шлюза
# listTaskProjects и createTaskProject — authz_gate.yaml (W1.04, PD-53). Формат — README.md.
# После правки: go -C backend generate ./test/isolation
module: tasks_w403_gate
endpoints:
  - op: getTaskProject
    method: GET
    path: /api/v1/tenants/{tenantId}/projects/{projectId}
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing }
        status: 403
        code: forbidden_action
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
  - op: updateTaskProject
    method: PATCH
    path: /api/v1/tenants/{tenantId}/projects/{projectId}
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing }
        status: 403
        code: forbidden_action
        body: '{"access":"open"}'
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
  - op: initTaskProjectWorkflow
    method: POST
    path: /api/v1/tenants/{tenantId}/projects/{projectId}/workflow/init
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing }
        status: 403
        code: forbidden_action
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
      - actor: a.project-approver
        params: { tenantId: tenant:a, projectId: project:a.fleet }
        status: 403
        code: forbidden_action
        note: без tasks.workflow.manage «Согласующий» (только tasks.approve) — 403 шлюза (Q-W4.03-15)
  - op: getTaskWorkflow
    method: GET
    path: /api/v1/tenants/{tenantId}/projects/{projectId}/workflow
    rows:
      - actor: a.manager-msk1

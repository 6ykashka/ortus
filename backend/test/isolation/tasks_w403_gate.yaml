    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a, projectId: tenant:missing, automationId: tenant:missing }
        status: 403
        code: forbidden_action
        body: '{"enabled":false}'
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
  - op: deleteTaskAutomation
    method: DELETE
    path: /api/v1/tenants/{tenantId}/projects/{projectId}/automations/{automationId}
    rows:
      - actor: a.manager-msk1

    reference: no-reference (B-6 №3); в эталоне имя организации в шапке без переключателя (01-shell §10.2)
    operations: [getMyContext, selectTenant]
    note: Порядок организаций — ru (Q-W0.09-10); последний выбор — MeContext.lastTenantId, control 0004 (W1.03).


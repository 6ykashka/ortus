        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
  - op: createTask
    method: POST
    path: /api/v1/tenants/{tenantId}/tasks
    rows:
      - actor: a.manager-msk1
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        body: '{"projectId":"{{project:a.fleet}}","title":"Проверить тормоза"}'
        note: у «Менеджера логистики» нет действий core.tasks — 403 шлюза
      - actor: a.project-approver
        params: { tenantId: tenant:a }
        status: 403
        code: forbidden_action
        body: '{"projectId":"{{project:a.fleet}}","title":"Проверить тормоза"}'
        note: без tasks.create «Согласующий» (только tasks.approve) — 403 шлюза (Q-W4.03-15)
  - op: getTask
    method: GET
    path: /api/v1/tenants/{tenantId}/tasks/{taskId}
    rows:
      - actor: a.manager-msk1

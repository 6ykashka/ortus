TripStart:
  type: object
  additionalProperties: false
  properties:
    reservationId:
      $ref: ../common/schemas.yaml#/Id
    departureInspectionId:
      $ref: ../common/schemas.yaml#/Id
  required:
    - reservationId
    - departureInspectionId
  description: "Single online transaction: consume unexpired reservation, validate current vehicle/driver grants and complete ready-photo checklist, confirm no blocking damage, acquire operational vehicle lock, create in_progress trip and outbox event. If manager preapproval is configured inspection must be approved. No client status override."
Trip:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    vehicleId:
      $ref: ../common/schemas.yaml#/Id
    driverMemberId:
      $ref: ../common/schemas.yaml#/Id
    orgUnitId:
      $ref: ../common/schemas.yaml#/Id
    routeId:
      $ref: ../common/schemas.yaml#/Id
    departureInspectionId:
      $ref: ../common/schemas.yaml#/Id
    returnInspectionId:
      $ref: ../common/schemas.yaml#/Id
    status:
      type: string
      enum:
        - in_progress
        - returned_pending_review
        - approved
        - rejected
    startedAt:
      $ref: ../common/schemas.yaml#/Instant
    returnedAt:
      $ref: ../common/schemas.yaml#/Instant
    revision:
      type: integer
      minimum: 1
      format: int64
  required:
    - id
    - vehicleId
    - driverMemberId
    - orgUnitId
    - departureInspectionId
    - status
    - startedAt
    - revision
  description: No earnings, payroll totals, manager remarks or other salary-derived values in this schema. Return moves vehicle to review/blocked state; release to available follows manager approval and damage policy.
TripReturn:
  type: object
  additionalProperties: false
  properties:
    action:
      type: string
      const: return
    returnInspectionId:
      $ref: ../common/schemas.yaml#/Id
  required:
    - action
    - returnInspectionId
  description: Requires latest trip ETag. Validates same vehicle/driver, non-decreasing odometer and checklist; records returnedAt server-side. Offline return remains draft until this succeeds.
TripReview:
  type: object
  additionalProperties: false
  properties:
    decision:
      type: string
      enum:
        - approve
        - reject
        - maintenance_required
        - rework
    comment:
      type: string
      maxLength: 5000
    steps:
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items:
        $ref: ./schemas.yaml#/ReworkStep
      description: "W2.00 (0.5.0-stage2, S2-10). Sections the driver must redo (Что вернуть на доработку). Decision rework returns a submitted trip to the driver by sections: the trip moves to rework, the vehicle stays occupied, the driver resubmits a return inspection (attempt + 1) and returnTrip moves the trip back to submitted. rework requires a non-blank comment and at least one step; otherwise 422 validation_failed with the prototype texts: comment — Опишите, что нужно исправить; steps — Отметьте хотя бы один раздел для доработки. steps with another decision — 422. Review is allowed only from submitted, otherwise 409 invalid_transition (Смена уже обработана)."
  required:
    - decision
  description: Only responsible manager/owner. Approve closes review and may release the vehicle if no maintenance block; rejection does not undo trip facts or delete expenses.
TripPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/Trip
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
TripExpenseCreate:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,49}$
      maxLength: 50
      examples:
        - fuel
        - wash
        - parking
        - toll
        - tire_service
        - other
      description: "W2.40 (0.5.1-stage2). Expense category — answer of the product owner of 17.10 to D-12 комплекта: fuel (Топливо), wash (Мойка), parking (Парковка), toll (Платная дорога), tire_service (Шиномонтаж и мелкий ремонт), other (Прочее, comment required). Fines are not driver expenses and have no category. A tenant-managed category catalogue seeded with these six codes comes after the stage 2 demo; the codes stay valid. W2.52 (0.6.1-stage2, W2.41): kind is the code of an active category of the tenant catalogue fleet.expense_categories (listExpenseCategories) — the enumeration is lifted, the six seed codes stay valid in every tenant. An unknown code — 422 validation_failed, field kind, code unknown_category «Категория расхода не найдена.»; an archived category — 422 validation_failed, field kind, code archived_category «Категория в архиве — выберите другую.». A category with commentRequired needs a non-blank comment (other always)."
    occurredAt:
      $ref: ../common/schemas.yaml#/Instant
    amount:
      $ref: ../common/schemas.yaml#/Money
    quantity:
      $ref: ../common/schemas.yaml#/Quantity
    receiptFileIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
      maxItems: 10
    comment:
      type: string
      maxLength: 1000
      description: "W2.40 (0.5.1-stage2). Driver comment. Required for kind other: a missing or blank comment gives 422 validation_failed with violation field comment, code required, message Для категории «Прочее» добавьте комментарий. Optional for the other kinds. W2.52 (0.6.1-stage2, W2.41): required for every category with ExpenseCategory.commentRequired — the message is Для категории «{label}» добавьте комментарий (for other it is the text above)."
  required:
    - kind
    - occurredAt
    - amount
    - receiptFileIds
  description: Driver can submit expenses only on own active/reviewable trip. Fuel quantity has unit litre; cost is never inferred by multiplying a float. Receipts must be ready and same-tenant. Actual cash accounting requires a manager-approved posting.
TripExpense:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    tripId:
      $ref: ../common/schemas.yaml#/Id
    kind:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,49}$
      maxLength: 50
      examples:
        - fuel
        - wash
        - parking
        - toll
        - tire_service
        - other
      description: "W2.52 (0.6.1-stage2, W2.41). Code of the expense category (ExpenseCategory.code), also of an archived one: the expense keeps its category. The label — listExpenseCategories with includeArchived=true."
    occurredAt:
      $ref: ../common/schemas.yaml#/Instant
    amount:
      $ref: ../common/schemas.yaml#/Money
    quantity:
      $ref: ../common/schemas.yaml#/Quantity
    receiptFileIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Id
    reviewState:
      type: string
      enum:
        - pending
        - approved
        - rejected
    revision:
      type: integer
      minimum: 1
      format: int64
    comment:
      type: string
      maxLength: 1000
      description: W2.00 (0.5.0-stage2). Driver comment of the expense (TripExpenseCreate.comment), shown in the shift review.
  required:
    - id
    - tripId
    - kind
    - occurredAt
    - amount
    - receiptFileIds
    - reviewState
    - revision
TripExpensePage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ./schemas.yaml#/TripExpense
    nextCursor:
      type:
        - string
        - "null"
      maxLength: 2048
  required:
    - items
    - nextCursor
  description: Opaque cursor is bound to tenant, principal, effective scopes, filters and sort. Permission changes invalidate the cursor.
DriverTransferCreate:
  type: object
  additionalProperties: false
  properties:
    driverMemberId:
      $ref: ../common/schemas.yaml#/Id
    sourceOrgUnitId:
      $ref: ../common/schemas.yaml#/Id
    targetOrgUnitId:
      $ref: ../common/schemas.yaml#/Id
    window:
      $ref: ../common/schemas.yaml#/TimeWindow
      description: "W2.51 (0.6.0-stage2). Agreed interval of the temporary assignment; must lie inside freeWindow of the active publication (otherwise 422 validation_failed, field window, code outside_free_window). The client sends the part of the trip window inside freeWindow."
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    tripId:
      $ref: ../common/schemas.yaml#/Id
      description: "W2.00 (0.5.0-stage2). Trip the driver is requested for (Запросить на рейс {trip}). On approval the temporary assignment is limited to this trip and window; the trip gets the driver. W2.51 (0.6.0-stage2): the trip must belong to targetOrgUnitId (a visible trip of another company — 422 validation_failed, field tripId, code org_unit; an invisible trip — 404) and still wait for a driver (a trip with a driver — 409 invalid_transition). W2.57 (0.6.2-stage2, Q-W2.07-1): the approval opens the driver only this trip of the target company (and the vehicle reserved for it) within window; the trips of his other transfers answer 404 to him outside their own grants."
    publicationId:
      $ref: ../common/schemas.yaml#/Id
      description: "W2.51 (0.6.0-stage2). DriverAvailability.publicationId of the catalog card (= DriverPoolPublication.id). When given, the server uses this publication: it must be active and belong to driverMemberId, otherwise 404 «Водитель не опубликован в пуле.». Without it — among the active publications of the driver the one whose freeWindow contains window, otherwise the one whose freeWindow overlaps window, otherwise any of them, the earliest freeWindow.startsAt first, then the smaller id; a driver with no active publication — 404 «Водитель не опубликован в пуле.». In both cases window outside freeWindow of the chosen publication is 422 validation_failed, field window, code outside_free_window."
    vehicle:
      $ref: ./schemas.yaml#/DriverTransferVehicleCreate
      description: "W2.71 (0.6.3-stage2, S2-20, 1a «Машина»). The vehicle of the trip the server reserves at the approval. Without it — as in 0.6.2: the logist assigns the vehicle after the approval (assignTripVehicle)."
  required:
    - driverMemberId
    - sourceOrgUnitId
    - targetOrgUnitId
    - window
    - reason
  description: Source free-pool directory exposes only name, availability and relevant qualifications. No salary, customers or unrelated operations. Requested actor must manage target unit; approval authority is the releasing source manager or holding owner.
DriverTransfer:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: ../common/schemas.yaml#/Id
    driverMemberId:
      $ref: ../common/schemas.yaml#/Id
      description: "W2.51 (0.6.0-stage2). Kept from 0.1 for both sides of the request. The requesting company uses it only as a reference of this request: it never resolves through the members or people API of another company (404, as a missing member), the pool label is driverDisplayName."
    sourceOrgUnitId:
      $ref: ../common/schemas.yaml#/Id
    targetOrgUnitId:
      $ref: ../common/schemas.yaml#/Id
    window:
      $ref: ../common/schemas.yaml#/TimeWindow
    status:
      type: string
      enum:
        - requested
        - approved
        - rejected
        - expired
        - revoked
        - completed
      description: "W2.51 (0.6.0-stage2). Lifecycle (S2-14, AUTH-07). requested → approved | rejected by the releasing source manager or owner; requested → expired automatically when nobody decided before window.startsAt or the publication was withdrawn. approved → revoked by the source side (the grant ends now; a trip not started loses the driver) or → completed automatically at window.endsAt. A trip of the temporary driver started and not closed at window.endsAt keeps the grant in state closing (D09: new work is refused, only finishing the route, the return inspection, expenses, the handover and its rework of that trip are allowed); the transfer completes when the trip is accepted or cancelled (a trip returned for rework after the window keeps the grant closing; completedAt — the acceptance moment). After completion or revocation the temporary driver gets 404 for the trip and its objects (AC-06). History and earnings stay with the home company. One open (requested) request per published driver (prototype api.js:544 «Запрос уже отправлен» — 409 invalid_transition). W2.57 (0.6.2-stage2, Q-W2.07-1): a trip is started from on_route (on_route, returning, submitted, rework); a trip in inspection or defect_review at window.endsAt is not started and ends with the window. The acceptance or the cancellation of the trip completes the transfer at once, also inside the window; a driver taken off the trip by the requesting company completes it at that moment. A revocation of a started trip keeps only its continuation (grant closing, D09) until the trip is accepted or cancelled; the status stays revoked. decideDriverTransfer extend moves window.endsAt of an approved transfer (also while it is closing)."
    revision:
      type: integer
      minimum: 1
      format: int64
    tripId:
      $ref: ../common/schemas.yaml#/Id
      description: W2.00 (0.5.0-stage2). Trip of the request (DriverTransferCreate.tripId).
    publicationId:
      $ref: ../common/schemas.yaml#/Id
      description: W2.51 (0.6.0-stage2). Pool publication the driver was requested from (DriverAvailability.publicationId = DriverPoolPublication.id, fleet.pool_publications.id).
    driverDisplayName:
      type: string
      maxLength: 200
      description: "W2.51 (0.6.0-stage2). Pool label of the driver (DriverAvailability.displayName, «Водитель #104»), not the name."
    sourceOrgUnitName:
      type: string
      maxLength: 200
      description: W2.51 (0.6.0-stage2). Name of the home (source) company — «Ожидает решения менеджера фирмы {name}».
    targetOrgUnitName:
      type: string
      maxLength: 200
      description: W2.51 (0.6.0-stage2). Name of the requesting (target) company.
    tripNumber:
      type: string
      maxLength: 50
      description: W2.51 (0.6.0-stage2). Number of the trip of the request (Р-211); the source side sees it without reading the trip of another company.
    reason:
      type: string
      maxLength: 2000
      description: W2.51 (0.6.0-stage2). Comment for the owning company (DriverTransferCreate.reason, «Комментарий для фирмы-владельца»).
    requestedByMemberId:
      $ref: ../common/schemas.yaml#/Id
      readOnly: true
    requestedAt:
      $ref: ../common/schemas.yaml#/Instant
    decidedByMemberId:
      $ref: ../common/schemas.yaml#/Id
      readOnly: true
    decidedAt:
      $ref: ../common/schemas.yaml#/Instant
    revokedByMemberId:
      $ref: ../common/schemas.yaml#/Id
      readOnly: true
      description: W2.51 (0.6.0-stage2). Who revoked the approved transfer (driver_transfers.revoked_by); decidedByMemberId stays the approver.
    decisionComment:
      type: string
      maxLength: 2000
      description: W2.51 (0.6.0-stage2). DriverTransferDecision.comment.
    grant:
      $ref: ./schemas.yaml#/TemporaryDriverGrant
    completedAt:
      $ref: ../common/schemas.yaml#/Instant
      description: W2.51 (0.6.0-stage2). Moment of completed or revoked.
    vehicle:
      $ref: ./schemas.yaml#/DriverTransferVehicle
      description: "W2.71 (0.6.3-stage2, S2-20, 1b, 1f). The vehicle part of a request with DriverTransferCreate.vehicle: the mode, both vehicles, the decision of the home company on the usual vehicle and, after the approval, the offer of reservations (offerGroupId, chooseUntil) and the fate of each vehicle (chosen, released, inspected). Absent on requests without vehicle."
  required:
    - id
    - driverMemberId
    - sourceOrgUnitId
    - targetOrgUnitId
    - window
    - status
    - revision
DriverTransferDecision:
  type: object
  additionalProperties: false
  properties:
    decision:
      type: string
      enum:
        - approve
        - reject
        - revoke
        - extend
        - approve_driver_only
    comment:
      type: string
      maxLength: 2000
      description: "W2.71 (0.6.3-stage2, S2-20, 1b). Comment of the decision (DriverTransfer.decisionComment). Required with reject — the reason of the refusal (docs/29 «reason»; Q-W2.70-8): reject without a non-blank comment is 422 validation_failed, field comment, code required «Укажите причину отказа»."
    endsAt:
      $ref: ../common/schemas.yaml#/Instant
      description: "W2.57 (0.6.2-stage2). New end of the window (DriverTransfer.window.endsAt) for decision extend — required with extend and not accepted with another decision (422 validation_failed, field endsAt, before the other checks). It must be later than the current end (422 «Проверьте срок.») and than now (422 «Окно уже прошло.») and lie inside freeWindow of the publication of the request (422 validation_failed, field window, code outside_free_window)."
  required:
    - decision
  description: "Approve grants narrowly scoped temporary operational assignment, with end time; does not move historical records or expose either company earnings. Overlapping active duty produces 409 driver_unavailable. W2.57 (0.6.2-stage2): extend moves the end of the window of an approved transfer (endsAt) — also after the window while its started trip is closing (overdue); the start of the window does not move."

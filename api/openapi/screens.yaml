    stage: 2
    ws: W2.25
    stories: [S2-18, S2-20]
    reference: design-stage-2 · Ортус CRM.dc.html · pg.home «Требует решения», «Сегодня в работе», «Рейсы сегодня» (05 §5, 01 §23)

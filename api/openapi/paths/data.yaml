# Контракт Ортус · тег Data: пути и операции. Пишет только стюард контракта (план v2 §3.5).
/api/v1/tenants/{tenantId}/datasets:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listDatasets
    tags:
      - Data
    summary: Read authorized module datasets and visible fields
    x-permissions:
      - data.catalog.read
    x-scope: effective-module-and-field-scopes
    description: Read authorized module datasets and visible fields
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/data/schemas.yaml#/DatasetCatalog
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-permissions-mode: all
/api/v1/tenants/{tenantId}/datasets/{datasetId}/query:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
    - $ref: ../components/common/parameters.yaml#/datasetId
  post:
    operationId: queryDataset
    tags:
      - Data
    summary: Query a dataset through a constrained typed query
    x-permissions:
      - data.query
    x-scope: effective-module-and-field-scopes
    description: "Read-only POST. Requires data.query AND the dataset own permission (e.g. fleet.trips.read). Same scope and field rules as canonical domain API; no generic registry bypass. Limits query time/rows and excludes disabled modules. Cookie-authenticated query POST still requires CSRF/Origin. W2.51 (0.6.0-stage2, S2-16, AC-14): a dataset of the catalog of the module the member may not read (no dataset permission in any scope) — 403 forbidden_action; an unknown dataset or a dataset of a disabled module — 404 not_found; a field hidden by the rights of the member (Dataset.hiddenFieldLabels) and an unknown field in select, filters, sort, groupBy or aggregates get the same 422 validation_failed (code unknown_field, detail «Поле недоступно: {key}.») — the answer never confirms that a hidden field exists; a cursor of another query — 400 malformed_request (DatasetQuery.cursor)."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/data/schemas.yaml#/DatasetQueryResult
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/data/schemas.yaml#/DatasetQuery
          example:
            select:
              - id
              - status
              - startsAt
            filters:
              - fieldKey: status
                operator: eq
                values:
                  - type: text
                    value: in_progress
            sort:
              - fieldKey: startsAt
                direction: desc
            limit: 50
    x-permissions-mode: all
# W2.52 (0.6.1-stage2, D-11 комплекта «выгрузка CSV расходов и рейсов», W2.50): синхронная выгрузка набора в CSV.
/api/v1/tenants/{tenantId}/datasets/{datasetId}/export:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
    - $ref: ../components/common/parameters.yaml#/datasetId
  post:
    operationId: exportDataset
    tags:
      - Data
    summary: Export the visible rows of a dataset as a CSV file
    x-permissions:
      - data.export
    x-scope: effective-module-and-field-scopes
    description: "W2.52 (0.6.1-stage2, D-11 комплекта — a cheap substitute of an accounting integration, W2.50). Read-only POST, as queryDataset: requires data.export AND the dataset own permission (Dataset.permissionKey) in the scope of the rows; the same scope, field and cursor-free rules as queryDataset. Stage 2 datasets with export (Dataset.exportAllowed): fleet.expenses «Расходы» and fleet.trips «Поездки» (D-11 комплекта), fleet.vehicles «Автомобили»; a dataset without export or a member without data.export — 403 forbidden_action; an unknown dataset or a disabled module — 404 not_found; a hidden or unknown field in select, filters or sort — the same 422 validation_failed (code unknown_field) as queryDataset — hidden fields never reach the file. File (content — the client saves it as UTF-8 with a BOM, as Excel expects): delimiter ; (Excel and 1C of a Russian locale), CRLF, RFC 4180 quoting, a header row of field labels in select order; choices — labels, money — rubles with a decimal comma (1234,50), decimals with a decimal comma, dates ДД.ММ.ГГГГ and instants ДД.ММ.ГГГГ ЧЧ:ММ in the time zone of the tenant, null — an empty cell. Against CSV formula injection (OWASP) the text, choices, reference and files cells starting with =, +, -, @, tab or CR, also after leading whitespace, are prefixed with an apostrophe; money, decimal, date, instant and boolean cells are never prefixed (-1234,50 stays a number for Excel and 1C). Up to 10 000 rows (rowLimit); more matching rows — the first 10 000 by sort and truncated=true. Writes an audit row data.exported (dataset, filters, row count — never the content)."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/data/schemas.yaml#/DatasetExport
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/data/schemas.yaml#/DatasetExportCreate
    x-permissions-mode: all
# W4.06 (0.7.0-stage4, W4.50): сохранённые виды набора — «Вид», «Без сохранённого вида», «Сохранить вид» (DATA-03).
/api/v1/tenants/{tenantId}/datasets/{datasetId}/views:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
    - $ref: ../components/common/parameters.yaml#/datasetId
  get:
    operationId: listDatasetViews
    tags:
      - Data
    summary: List the saved views of a dataset
    x-permissions:
      - data.query
    x-scope: effective-module-and-field-scopes
    description: "W4.06 (0.7.0-stage4, DATA-03, prototype dtViews «Вид» — «Без сохранённого вида»). Requires data.query AND the dataset own permission (Dataset.permissionKey), as queryDataset: the personal views of the member and the shared views of the dataset, ordered by name. A view stores a query spec, never rows: the rows of a view are the rows of queryDataset for the viewer. Filters, columns, search and sort over fields hidden by the rights of the viewer (or removed from the dataset) are cut out of the returned view and their labels are listed in DatasetView.hiddenFieldLabels — their values never reach the viewer. A dataset the member may not query — 403 forbidden_action; unknown or of a disabled module — 404, as queryDataset."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/data/schemas.yaml#/DatasetViewList
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-permissions-mode: all
  post:
    operationId: createDatasetView
    tags:
      - Data
    summary: Save a view of a dataset
    x-permissions:
      - data.query
    x-scope: effective-module-and-field-scopes
    description: "W4.06 (0.7.0-stage4, DATA-03, prototype onSaveView «Сохранить вид» — toast «Вид сохранён · личный»; the client proposes the name «{dataset}: «{filter}»»). Requires data.query AND the dataset own permission. visibility personal (default) — only the author sees and changes the view; shared — every member who may query the dataset sees it (rows still limited by the scope of each viewer); creating, changing and deleting a shared view requires data.export over the dataset (the publication of a selection, as an export) or the owner of the organization — otherwise 403 forbidden_action. The query is validated as queryDataset: a hidden or unknown field — the same 422 validation_failed (code unknown_field, «Поле недоступно: {key}.»). The name is unique per author and dataset among personal views and per dataset among shared views (case-insensitive): a taken name — 422 validation_failed (field name, code taken, «Вид с таким именем уже есть.»); at most 50 personal views of a member per dataset — 422 (field name, code too_many, «Не больше 50 личных видов набора.»). hiddenFieldLabels of the answer — as listDatasetViews. The prototype onSaveView replaces a view with the same name silently; the contract never replaces on create: the client of «Сохранить вид» first looks for the own personal view with that name in listDatasetViews and changes its query with updateDatasetView (If-Match — the revision of that view), and calls createDatasetView only for a new name."
    responses:
      "201":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/data/schemas.yaml#/DatasetView
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/data/schemas.yaml#/DatasetViewCreate
    x-permissions-mode: all
/api/v1/tenants/{tenantId}/datasets/{datasetId}/views/{viewId}:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
    - $ref: ../components/common/parameters.yaml#/datasetId
    - $ref: ../components/common/parameters.yaml#/viewId
  patch:

# Матрица изоляции: салон и SPA контракта 0.12.0-stage5 (W5.00, контрактный PR этапа 5); хендлеры — W5.20.
# Строки писались до хендлера (pending, W5.00); W5.20 снял pending: без сессии 401, чужая организация 404 (AC-02).
# Положительные строки владельца (услуги, визиты) требуют подключённого модуля spa: у фикстур W1.04 подключена только
# «Логистика», и шлюз отвечает владельцу 403 module_not_installed (modules_gate.yaml) — эти случаи (чужой tenant и
# область «self» практика, чужая услуга и визит — 404, список только своих) проверены integration-тестами модуля
# (backend/internal/modules/spa/*_integration_test.go) и стеком (cmd/api/spa_stack_integration_test.go).
# Формат — README.md.
# После правки: go -C backend generate ./test/isolation
module: spa_w500
endpoints:
  - op: getSpaService
    method: GET
    path: /api/v1/tenants/{tenantId}/spa/services/{serviceId}
    rows:
      - actor: anonymous
        params: { tenantId: tenant:a, serviceId: tenant:missing }
        status: 401
      - actor: b.owner
        params: { tenantId: tenant:a, serviceId: tenant:missing }
        status: 404
        absent: [tenant:a]
        note: чужая организация — как несуществующая (AC-02)
  - op: updateSpaService
    method: PATCH
    path: /api/v1/tenants/{tenantId}/spa/services/{serviceId}
    rows:
      - actor: anonymous
        params: { tenantId: tenant:a, serviceId: tenant:missing }
        status: 401
        body: "{}"
      - actor: b.owner
        params: { tenantId: tenant:a, serviceId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: "{}"
        note: чужая организация — как несуществующая (AC-02)
  - op: cancelAppointment
    method: POST
    path: /api/v1/tenants/{tenantId}/spa/appointments/{appointmentId}/cancel
    rows:
      - actor: anonymous
        params: { tenantId: tenant:a, appointmentId: tenant:missing }
        status: 401
        body: "{}"
      - actor: b.owner
        params: { tenantId: tenant:a, appointmentId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: "{}"
        note: чужая организация — как несуществующая (AC-02)
  - op: rescheduleAppointment
    method: POST
    path: /api/v1/tenants/{tenantId}/spa/appointments/{appointmentId}/reschedule
    rows:
      - actor: anonymous
        params: { tenantId: tenant:a, appointmentId: tenant:missing }
        status: 401
        body: "{}"
      - actor: b.owner
        params: { tenantId: tenant:a, appointmentId: tenant:missing }
        status: 404
        absent: [tenant:a]
        body: "{}"
        note: чужая организация — как несуществующая (AC-02)

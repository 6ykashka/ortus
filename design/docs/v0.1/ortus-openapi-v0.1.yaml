      type: object
      additionalProperties: false
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/DatasetRow'
        nextCursor:
          type:
          - string
          - 'null'
        schemaVersion:
          type: string
      required:
      - rows
      - nextCursor
      - schemaVersion
      description: No unrestricted total count; aggregation is computed only over visible scoped rows. Personal
        data export is a separate permission/async contract.
    UploadCreate:
      type: object
      additionalProperties: false
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
          format: int64
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        purpose:
          type: string
          enum:
          - inspection
          - expense_receipt
          - knowledge_attachment
          - form_attachment
          - repair_evidence
        owner:
          $ref: '#/components/schemas/ObjectRef'
      required:
      - fileName
      - contentType
      - sizeBytes
      - sha256
      - purpose
      - owner
      description: Reject oversized or unsupported MIME; reserve bytes before issuing a URL. Owner belongs
        to same tenant and the actor can attach files to it. Before inspection creation, departure photos attach
        to the reservation and return photos to the trip; submitInspection binds them atomically to its evidence.
        Expense receipts likewise attach to the trip before expense creation. A repair report may attach photos
        to its project before the work log exists. These are explicit allowed owner transitions, never arbitrary
        reparenting. File display name is not an object storage path.
    UploadTicket:
      type: object

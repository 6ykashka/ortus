# Матрица изоляции: «Задачи и проекты» контракта 0.10.0-stage4 (W4.03, контрактный PR 2 этапа 4) — до хендлеров W4.11
# (тег Tasks в cmd/api — 501 целиком; pending: 501 или совпавший ответ шлюза; в строгом режиме -tags isolation_pending —
# красные до хендлера). Проекты, задачи, правила и вложения — в области tasks.* (проект — по уровню доступа, TP-03;
# задача исполнителя — область self); чужая организация — 404 (AC-02), без сессии — 401. Строк tasks.projects и
# tasks.tasks в фикстурах нет (объект project:a.fleet — только цель назначений, PD-53; W4.11 добавит проект и задачи
# в содержимое фикстур): положительные строки — списки владельца без другого тенанта, по id — «нет такого объекта»
# (tenant:missing) — 404 и владельцу. Ключ перехода и пункт чек-листа — не UUID: в пути — литералы t3 и ch-1.
# Изоляция между проектами (возврат 1): роль руководителя «Автопарка» (a.project-lead) в проекте «Стройка»
# (project:a.build, ролей в нём нет ни у кого) не даёт ничего — 404, как несуществующий; TP-03 — «Стройка» без роли
# владельца в ней — 404 и владельцу (W4.11 кладёт «Стройку» закрытым проектом в содержимое фикстур). «Согласующий»
# (a.project-approver) проходит шлюз transitionTask по tasks.approve.
# Команды с If-Match строки не передают If-Match (README, «Цель набора»): у них отказы до предусловия — без сессии 401,
# чужая организация 404. Отказы шлюза (403) — tasks_w403_gate.yaml. Формат — README.md.
# После правки: go -C backend generate ./test/isolation

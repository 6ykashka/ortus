        propertyName: type
        mapping:
          text: "#/components/schemas/TextValue"
          decimal: "#/components/schemas/DecimalValue"
          boolean: "#/components/schemas/BooleanValue"
          date: "#/components/schemas/DateValue"
          instant: "#/components/schemas/InstantValue"
          reference: "#/components/schemas/ReferenceValue"
          money: "#/components/schemas/MoneyValue"
          files: "#/components/schemas/FilesValue"
          choices: "#/components/schemas/ChoicesValue"
          "null": "#/components/schemas/NullValue"

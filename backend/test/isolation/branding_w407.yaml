# Матрица изоляции: тег Branding контрактного PR 6 этапа 4 (W4.07, 0.8.0-stage4; шаг 4.6) — оформление организации.
# Хендлеры — W4.60. Отказы шлюза (x-scope tenant-owner) — в branding_w407_gate.yaml. updateTenantBranding требует If-Match — строки только отказов.
# Формат — README.md. После правки: go -C backend generate ./test/isolation
module: branding_w407
endpoints:
  - op: getTenantBranding
    method: GET
    path: /api/v1/tenants/{tenantId}/branding
    rows:
      - actor: a.owner
        params: { tenantId: tenant:a }
        status: 200
        absent: [tenant:b]
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
  - op: updateTenantBranding
    method: PUT
    path: /api/v1/tenants/{tenantId}/branding
    rows:
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        body: '{"displayName": "Чужое имя", "shortName": null, "accentHex": "#1F6B52", "logoAssetId": null, "markAssetId": null, "terms": {}, "menu": {"items": {}, "order": []}, "poweredBy": true}'
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401
  - op: uploadBrandingAsset
    method: POST
    path: /api/v1/tenants/{tenantId}/branding/assets
    rows:
      - actor: b.owner
        params: { tenantId: tenant:a }
        status: 404
        absent: [tenant:a]
        body: '{"kind": "logo", "fileName": "logo.svg", "contentType": "image/svg+xml", "contentBase64": "PHN2Zy8+"}'
      - actor: anonymous
        params: { tenantId: tenant:a }
        status: 401

# Контракт Ортус · тег Forms: пути и операции. Пишет только стюард контракта (план v2 §3.5).
# W4.05 (0.11.0-stage4, контрактный PR 4 этапа 4): черновик и публикация из черновика, правила, перенос и повтор
# действий, отправка сотрудником, сводка, CSV, варианты вопросов CRM, шаблоны, группы; FormPatch v2 (C п. 13).
/api/v1/tenants/{tenantId}/forms:
  parameters:
    - $ref: ../components/common/parameters.yaml#/tenantId
  get:
    operationId: listForms
    tags:
      - Forms
    summary: List scoped form definitions
    x-permissions:
      - forms.read
    x-scope: tenant-org-unit-project
    description: "List scoped form definitions. W4.05 (0.11.0-stage4, «Формы и группы»): forms whose area (Form.orgUnitId; null — the whole organization) is covered by a grant of forms.read of the member, the latest change first. Filters: q — the name contains the text without regard to case («Поиск»); owner=me — «Мои формы»; status — «Черновики» (draft), «Принимают ответы» (open — published), «Приём закрыт» (closed); groupId — the forms of a group. An empty list after filters — «Ничего не найдено»."
    responses:
      "200":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/forms/schemas.yaml#/FormPage
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    parameters:
      - $ref: ../components/common/parameters.yaml#/Cursor
      - $ref: ../components/common/parameters.yaml#/Limit
      - name: q
        in: query
        required: false
        description: W4.05 (0.11.0-stage4). «Поиск формы» — a part of the name.
        schema:
          type: string
          maxLength: 100
      - name: owner
        in: query
        required: false
        description: W4.05 (0.11.0-stage4). me — «Мои формы» (the owner is the requesting member).
        schema:
          type: string
          enum:
            - me
      - name: status
        in: query
        required: false
        description: W4.05 (0.11.0-stage4). draft — «Черновики», open — «Принимают ответы», closed — «Приём закрыт».
        schema:
          type: string
          enum:
            - draft
            - open
            - closed
      - name: groupId
        in: query
        required: false
        description: W4.05 (0.11.0-stage4). Forms of the group (FormGroup.id).
        schema:
          $ref: ../components/common/schemas.yaml#/Id
    x-permissions-mode: all
  post:
    operationId: createForm
    tags:
      - Forms
    summary: Create a form and immutable initial version
    x-permissions:
      - forms.create
    x-scope: tenant-org-unit-project
    description: "Create a form and immutable initial version. W4.05 (0.11.0-stage4, D-24 комплекта, Q-W4.00-forms-1): the form is created as a draft without versions and rules — responses are accepted after publishForm of v1, which creates the immutable version. forms.create in the area of the form (orgUnitId; null — the organization). Texts of the prototype (api.js:590–595): 422 validation_failed «Укажите название формы — не короче 3 символов», «Форма «{name}» уже есть — измените название» (name), «Шаблон не найден» (templateId), «Область не найдена» (orgUnitId), «Форма не найдена» (sourceFormId the member does not see); 403 module_not_installed «Модуль «{module}» не подключён: шаблон недоступен» (a template of a module that is not active). Answers the form; the screen opens «Конструктор» (getFormDraft) and toasts «Создан черновик «{name}»» / «Создана копия «{name}»». Event forms.form.created.v1 (the owners — «Создан черновик формы «…» из шаблона «…»»)."
    responses:
      "201":
        description: Successful result.
        headers:
          X-Request-Id:
            $ref: ../components/common/headers.yaml#/RequestId
          ETag:
            $ref: ../components/common/headers.yaml#/ETag
          Idempotency-Replayed:
            $ref: ../components/common/headers.yaml#/IdempotencyReplayed
          Cache-Control:
            description: Never cache authenticated, confidential or capability-bearing API responses in shared caches.
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema:
              $ref: ../components/forms/schemas.yaml#/Form
      "400":
        $ref: ../components/common/responses.yaml#/BadRequest
      "401":
        $ref: ../components/common/responses.yaml#/Unauthenticated
      "402":
        $ref: ../components/common/responses.yaml#/PlanRequired
      "403":
        $ref: ../components/common/responses.yaml#/Forbidden
      "404":
        $ref: ../components/common/responses.yaml#/NotFound
      "409":
        $ref: ../components/common/responses.yaml#/Conflict
      "422":
        $ref: ../components/common/responses.yaml#/Validation
      "428":
        $ref: ../components/common/responses.yaml#/PreconditionRequired
      "429":
        $ref: ../components/common/responses.yaml#/RateLimited
    x-csrf-required-for-cookie: true
    parameters:
      - $ref: ../components/common/parameters.yaml#/IdempotencyKey
      - $ref: ../components/common/parameters.yaml#/Csrf
      - $ref: ../components/common/parameters.yaml#/Origin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/forms/schemas.yaml#/FormCreate
    x-permissions-mode: all
